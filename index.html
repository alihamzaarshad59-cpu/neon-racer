<div id="gameOverHook"></div>
<script>
'use strict';
(function () {
// GAME RUNTIME STATE (For slow-mo, last chance, near misses)
const game = {
  slowMo: 1.0,
  lastChanceUsed: false,
  nearMissPopups: []
};

// AUDIO SYNTHESIZER
let audioCtx = null, soundEnabled = true;
try { const s = localStorage.getItem('neon_racer_sound'); if (s !== null) soundEnabled = (s === 'true'); } catch (e) {}

function loadPct(key, def) {
  try { const v = localStorage.getItem(key); if (v !== null) { const n = parseInt(v, 10); if (!isNaN(n)) return Math.min(100, Math.max(0, n)); } } catch (e) {}
  return def;
}
let musicVolPct = loadPct('neon_racer_music_vol', 100), sfxVolPct = loadPct('neon_racer_sfx_vol', 100);
function sfxVol() { return sfxVolPct / 100; }
function musicVol() { return musicVolPct / 100; }

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('neon_racer_sound', soundEnabled ? 'true' : 'false'); } catch (e) {}
  if (soundEnabled) { soundCoin(); if (currentState === STATE_PLAYING) startEngineSound(); }
  else { stopEngineSound(); }
}
function initAudio() {
  if (!soundEnabled) return;
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, dur, gStart, gEnd, endFreq) {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  try {
    const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain(), v = sfxVol();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, now);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), now + dur);
    g.gain.setValueAtTime(Math.max((gStart !== undefined ? gStart : 0.15) * v, 0.0002), now);
    g.gain.exponentialRampToValueAtTime(Math.max((gEnd !== undefined ? gEnd : 0.001) * v, 0.0001), now + dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
  } catch (e) {}
}

// ENGINE HUM SOUND
let engineOsc = null, engineFilter = null, engineGain = null, engineRunning = false;
const MAX_ENGINE_SPEED = 950;
function startEngineSound() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0 || engineRunning) return;
  try {
    const now = audioCtx.currentTime;
    engineOsc = audioCtx.createOscillator();
    engineFilter = audioCtx.createBiquadFilter();
    engineGain = audioCtx.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(60, now);
    engineFilter.type = 'lowpass';
    engineFilter.frequency.setValueAtTime(400, now);
    const initialGain = 0.03 * sfxVol();
    engineGain.gain.setValueAtTime(0.0001, now);
    engineGain.gain.setTargetAtTime(initialGain, now, 0.1);
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start(now);
    engineRunning = true;
  } catch (e) {}
}
function updateEngineSound() {
  if (!engineRunning || !audioCtx || !engineOsc || !engineFilter || !engineGain) return;
  if (!soundEnabled || currentState !== STATE_PLAYING || sfxVol() <= 0) { stopEngineSound(); return; }
  try {
    const now = audioCtx.currentTime;
    const ratio = Math.min(1, Math.max(0, currentSpeed / MAX_ENGINE_SPEED));
    const targetFreq = 60 + (180 - 60) * ratio;
    const targetFilterFreq = 400 + (1000 - 400) * ratio;
    const targetGain = (0.03 + (0.08 - 0.03) * ratio) * sfxVol();
    engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.1);
    engineFilter.frequency.setTargetAtTime(targetFilterFreq, now, 0.1);
    engineGain.gain.setTargetAtTime(targetGain, now, 0.1);
  } catch (e) {}
}
function stopEngineSound() {
  if (!engineRunning) return;
  try {
    if (audioCtx && engineGain) {
      const now = audioCtx.currentTime;
      engineGain.gain.setTargetAtTime(0.0001, now, 0.1);
      const prevOsc = engineOsc;
      setTimeout(() => { try { if (prevOsc) prevOsc.stop(); } catch (e) {} }, 200);
    }
  } catch (e) {}
  engineOsc = null; engineFilter = null; engineGain = null; engineRunning = false;
}

// BACKGROUND MUSIC
const MUSIC_BASS = [55, 55, 82.41, 55, 65.41, 65.41, 98, 65.41];
let musicTimer = 0, musicStep = 0;
function musicNote(freq, type, dur, gain) {
  try {
    const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(Math.max(gain * musicVol(), 0.0002), now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
  } catch (e) {}
}
function updateMusic(dt) {
  if (!soundEnabled || !audioCtx || musicVol() <= 0) return;
  musicTimer -= dt;
  if (musicTimer > 0) return;
  musicTimer = 0.24;
  const f = MUSIC_BASS[musicStep % 8];
  musicNote(f * 2, 'triangle', 0.22, 0.09);
  if (musicStep % 2 === 1) musicNote(f * 8, 'square', 0.12, 0.022);
  musicStep++;
}

function soundPlayerShoot() { playTone(880, 'square', 0.08, 0.08, 0.001, 220); }
function soundEnemyShoot() { playTone(320, 'sawtooth', 0.1, 0.06, 0.001, 110); }
function soundBossShoot() { playTone(260, 'sawtooth', 0.18, 0.12, 0.001, 70); }
function soundLightning() { playTone(650, 'sawtooth', 0.28, 0.28, 0.001, 80); }
function soundEnemyExplosion() { playTone(240, 'triangle', 0.15, 0.2, 0.001, 40); }
function soundBossExplosion() { playTone(180, 'sawtooth', 0.85, 0.4, 0.001, 20); }
function soundFreeze() { playTone(950, 'sine', 0.18, 0.18, 0.01, 1300); }
function soundNitro() { playTone(200, 'sawtooth', 0.5, 0.25, 0.001, 900); }
function soundMissile() { playTone(450, 'sawtooth', 0.16, 0.14, 0.001, 180); }
function soundCharge() { playTone(150, 'sawtooth', 0.4, 0.28, 0.01, 550); }
function soundPlayerHit() {
  try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
  playTone(140, 'sawtooth', 0.2, 0.25, 0.001, 45);
}
function soundPowerup() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  const now = audioCtx.currentTime, v = sfxVol();
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
    try {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.05);
      g.gain.setValueAtTime(Math.max(0.12 * v, 0.0002), now + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.12);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.12);
    } catch (e) {}
  });
}
function soundMissionComplete() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  const now = audioCtx.currentTime, v = sfxVol();
  [440, 554.37, 659.25, 880].forEach((f, i) => {
    try {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.08);
      g.gain.setValueAtTime(Math.max(0.15 * v, 0.0002), now + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.2);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.2);
    } catch (e) {}
  });
}
function soundCoin() {
  playTone(987.77, 'square', 0.08, 0.12, 0.001);
  setTimeout(() => playTone(1318.51, 'square', 0.14, 0.15, 0.001), 70);
}
function soundCrash() {
  try { if (navigator.vibrate) navigator.vibrate([120, 50, 250]); } catch (e) {}
  playTone(160, 'sawtooth', 0.5, 0.35, 0.001, 25);
}
function soundStart() { playTone(523.25, 'triangle', 0.12, 0.15, 0.001); setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.18, 0.001), 90); }

// STATES
const STATE_MENU = 0, STATE_PLAYING = 1, STATE_GAMEOVER = 2, STATE_GARAGE = 3, STATE_UPGRADES = 4, STATE_PAUSED = 5, STATE_ACHIEVEMENTS = 6, STATE_SETTINGS = 7, STATE_MODE = 8, STATE_DIFFICULTY = 9;
let currentState = STATE_MENU, gameOverTimestamp = 0, gameOverReason = 'crash';
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let screenWidth = 0, screenHeight = 0, dpr = 1, roadX = 0, roadW = 0, laneWidth = 0, roadScrollOffset = 0;
let currentSpeed = 420, distanceTraveled = 0, score = 0, bestScore = 0, bestScoreBeforeRun = 0, coinsCollected = 0, gameTime = 0;

// TOAST
let toastText = '', toastColor = '#39ff14', toastTimer = 0;
function showToast(text, color) { toastText = text; toastColor = color || '#39ff14'; toastTimer = 2.2; }

// NEAR MISS STATE
let nearMissCooldown = 0;

// LAST CHANCE STATE
let lastChanceActive = false;
let lastChanceTimer = 0;
let postClutchInvincibleTimer = 0;
let lastChanceToast = false;
let lastChanceToastTimer = 0;
let clutchSaveToast = false;
let clutchSaveToastTimer = 0;

// GAME OVER HOOK
let gameOverHookMain = '';
let gameOverHookSub = '';

// SCREEN SHAKE (visual only - never affects collisions)
let shakeIntensity = 0, shakeDecay = 0.88, shakeX = 0, shakeY = 0;
function triggerScreenShake(intensity, duration) {
  shakeIntensity = Math.max(shakeIntensity, intensity);
}
function updateScreenShake() {
  if (shakeIntensity > 0) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= shakeDecay;
    if (shakeIntensity < 0.3) { shakeIntensity = 0; shakeX = 0; shakeY = 0; }
  } else if (shakeX !== 0 || shakeY !== 0) { shakeX = 0; shakeY = 0; }
}
function clearScreenShake() { shakeIntensity = 0; shakeX = 0; shakeY = 0; }

// KILL STREAK (rapid kills within 1.5s - separate from long-term combo)
let killStreakCount = 0, killStreakTimer = 0, lastKillTime = 0;
function showStreakText(text, color) {
  floatingTexts.push({ text: text, x: screenWidth / 2, y: screenHeight * 0.4, vy: 40, alpha: 1, decay: 0.67, color: color, size: 28, blur: 20 });
}
function registerKillStreak() {
  killStreakCount++;
  killStreakTimer = 1.5;
  lastKillTime = gameTime;
  if (killStreakCount === 2) showStreakText('DOUBLE KILL!', '#39ff14');
  else if (killStreakCount === 3) showStreakText('TRIPLE KILL!', '#00ffff');
  else if (killStreakCount === 5) showStreakText('RAMPAGE!', '#ffd700');
  else if (killStreakCount === 10) showStreakText('UNSTOPPABLE!', '#ff7700');
  else if (killStreakCount === 20) showStreakText('GODLIKE!', '#ff0055');
  else if (killStreakCount === 30) showStreakText('LEGENDARY!', getRainbowColor());
}

// MILESTONES
let nextMilestone = 5000, milestonesReached = 0, highestMilestoneEver = 0;
try { const hm = parseInt(localStorage.getItem('neon_racer_highest_milestone') || '0', 10); if (!isNaN(hm)) highestMilestoneEver = hm; } catch (e) {}
let milestonePopup = { score: 0, reward: 0, timer: 0, active: false };
const MILESTONE_REWARDS = {
  5000: 50,
  10000: 100,
  15000: 150,
  20000: 200,
  25000: 250,
  30000: 300,
  35000: 400,
  40000: 500,
  45000: 750,
  50000: 1000
  // 60000+: 500 coins each
};
function getMilestoneReward(m) {
  if (MILESTONE_REWARDS[m]) return MILESTONE_REWARDS[m];
  if (m >= 50000) return 500;
  return 100;
}
function showMilestonePopup(sc, reward) {
  milestonePopup = { score: sc, reward: reward, timer: 2.5, active: true };
}
function checkMilestones() {
  if (score >= nextMilestone) {
    const reward = getMilestoneReward(nextMilestone);
    totalCoins += reward;
    saveCoins();
    milestonesReached++;
    if (nextMilestone > highestMilestoneEver) {
      highestMilestoneEver = nextMilestone;
      try { localStorage.setItem('neon_racer_highest_milestone', highestMilestoneEver.toString()); } catch (e) {}
    }
    showMilestonePopup(nextMilestone, reward);
    soundMissionComplete();
    triggerScreenShake(12, 0.5);
    for (let p = 0; p < 60; p++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 400 + 100;
      particles.push({
        x: screenWidth / 2,
        y: screenHeight / 2,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        size: Math.random() * 5 + 3,
        color: Math.random() < 0.5 ? '#ffd700' : getRainbowColor(p * 10),
        alpha: 1,
        decay: 1.2
      });
    }
    for (let i = 0; i < 5; i++) {
      coins.push({
        x: roadX + Math.floor(Math.random() * laneCount) * laneWidth + laneWidth / 2,
        y: -40 - i * 60,
        radius: 13,
        pulseOffset: Math.random() * 6
      });
    }
    nextMilestone += 5000;
  }
}

// TUTORIAL (first-time only)
let tutorialDone = false;
try { tutorialDone = localStorage.getItem('neon_racer_tutorial_done') === 'true'; } catch (e) {}
let tutorialActive = false, tutorialStep = 0;
const TUTORIAL_STEPS = [
  { icon: '🎮', title: 'WELCOME', lines: ["Let's learn to play in 20 seconds", '', 'Tap NEXT to continue'] },
  { icon: '👈👉', title: 'STEERING', lines: ['Tap LEFT half of screen = move left', 'Tap RIGHT half = move right'] },
  { icon: '💥', title: 'AUTO-FIRE', lines: ['Your car shoots automatically.', 'Focus on dodging and steering!'] },
  { icon: '🪙', title: 'COLLECT & DESTROY', lines: ['Collect coins 🪙 for upgrades.', 'Destroy red enemy cars for score.'] },
  { icon: '🔥', title: 'NITRO BOOST', lines: ['Tap the 🔥 button (bottom-right) for', 'a 1.5x speed boost!'] },
  { icon: '👹', title: 'BOSSES & MISSIONS', lines: ['Bosses appear every 5,000 score.', 'Complete missions for bonus points!'] },
  { icon: '🏁', title: 'READY TO RACE!', lines: ['Good luck! Set a new high score!'] }
];
function tutorialLayout() {
  const cw = Math.min(screenWidth * 0.9, 340), chh = 320, midX = screenWidth / 2, midY = screenHeight / 2;
  return { cw: cw, chh: chh, midX: midX, cx0: midX - cw / 2, cy0: midY - chh / 2 };
}
function markTutorialDone() {
  tutorialDone = true;
  tutorialActive = false;
  try { localStorage.setItem('neon_racer_tutorial_done', 'true'); } catch (e) {}
  resetSteering();
  if (currentState === STATE_PLAYING) startEngineSound();
}
function tutorialNext() {
  soundCoin();
  if (tutorialStep < TUTORIAL_STEPS.length - 1) tutorialStep++;
  else markTutorialDone();
}
function handleTutorialClick(cx, cy) {
  const L = tutorialLayout();
  const last = tutorialStep >= TUTORIAL_STEPS.length - 1;
  if (!last && Math.abs(cx - (L.cx0 + L.cw - 42)) <= 38 && Math.abs(cy - (L.cy0 + 22)) <= 20) { soundCoin(); markTutorialDone(); return; }
  if (Math.abs(cx - L.midX) <= 95 && Math.abs(cy - (L.cy0 + L.chh - 62)) <= 26) { tutorialNext(); return; }
}
function fitFont(text, maxW, px, weight) {
  let s = px;
  do { ctx.font = weight + ' ' + s + 'px sans-serif'; s -= 0.5; } while (ctx.measureText(text).width > maxW && s > 8);
}

// SETTINGS
const STEER_SPEEDS = { slow: 500, normal: 640, fast: 800 };
let sensitivity = 'normal';
try { const sv = localStorage.getItem('neon_racer_sensitivity'); if (sv && STEER_SPEEDS[sv]) sensitivity = sv; } catch (e) {}

// RACING MODES
const MODES = [
  { id: 'classic', name: 'CLASSIC', icon: '🏁', color: '#00ffff', desc: 'Normal gameplay - all features' },
  { id: 'timetrial', name: 'TIME TRIAL', icon: '⏱️', color: '#ffe600', desc: 'Survive 30 seconds - highest score wins' },
  { id: 'elimination', name: 'ELIMINATION', icon: '💀', color: '#ff0055', desc: 'Deadly traffic - 1 hit = death - 2x score' },
  { id: 'drift', name: 'DRIFT', icon: '🌪️', color: '#b026ff', desc: 'No shooting - +5/s steering, +10/s combo' }
];
const TIME_TRIAL_DURATION = 30;
let gameMode = 'classic';
try { const sm = localStorage.getItem('neon_racer_mode'); if (sm && MODES.some(m => m.id === sm)) gameMode = sm; } catch (e) {}
function getMode() { return MODES.find(m => m.id === gameMode) || MODES[0]; }
let driftScore = 0, driftStreak = 0, driftCombo = false, driftActive = false;

// DIFFICULTY (dynamic lane count)
const DIFFICULTIES = [
  {
    id: 'easy',
    name: 'EASY',
    icon: '🟢',
    color: '#39ff14',
    lanes: 3,
    trafficSpeedMult: 0.85,
    spawnRateMult: 0.85,
    scoreMult: 1.0,
    desc: '3 lanes - Relaxed racing for beginners'
  },
  {
    id: 'medium',
    name: 'MEDIUM',
    icon: '🟡',
    color: '#ffe600',
    lanes: 4,
    trafficSpeedMult: 1.0,
    spawnRateMult: 1.0,
    scoreMult: 1.3,
    desc: '4 lanes - Balanced challenge, 1.3x score'
  },
  {
    id: 'hard',
    name: 'HARD',
    icon: '🔴',
    color: '#ff0055',
    lanes: 5,
    trafficSpeedMult: 1.15,
    spawnRateMult: 1.2,
    scoreMult: 1.6,
    desc: '5 lanes - Intense chaos, 1.6x score reward!'
  }
];
let currentDifficulty = 'easy';
try {
  const sdf = localStorage.getItem('neon_racer_difficulty');
  if (sdf && DIFFICULTIES.some(d => d.id === sdf)) currentDifficulty = sdf;
} catch (e) {}
function getDifficulty() {
  return DIFFICULTIES.find(d => d.id === currentDifficulty) || DIFFICULTIES[0];
}
let laneCount = getDifficulty().lanes;
function laneSpeedMult() { return laneCount >= 5 ? 1.2 : (laneCount === 4 ? 1.1 : 1.0); }
function diffScore(v) { return Math.round(v * getDifficulty().scoreMult); }

// CURRENCY
let totalCoins = 0;
try { totalCoins = parseInt(localStorage.getItem('neon_racer_coins') || '0', 10) || 0; } catch (e) {}
function saveCoins() { try { localStorage.setItem('neon_racer_coins', totalCoins.toString()); } catch (e) {} }

const UPGRADE_DEFS = {
  speed: { id: 'speed', name: 'TOP SPEED', icon: '⚡', max: 5, costs: [100, 250, 500, 1000, 2000], desc: '+8% Base Speed per level' },
  fireRate: { id: 'fireRate', name: 'FIRE RATE', icon: '🔫', max: 5, costs: [100, 250, 500, 1000, 2000], desc: '-5% Fire Interval per level' },
  hp: { id: 'hp', name: 'MAX HEALTH', icon: '❤️', max: 3, costs: [500, 1500, 3000], desc: '+1 Heart per level (Max 6)' },
  shield: { id: 'shield', name: 'SHIELD DURATION', icon: '🛡️', max: 3, costs: [300, 800, 1500], desc: '+2 Sec duration per level' },
  engine: { id: 'engine', name: 'ENGINE', icon: '🏎️', max: 5, costs: [200, 500, 1000, 2000, 4000], desc: '+10% Top Speed per level' },
  tires: { id: 'tires', name: 'TIRES', icon: '🌀', max: 5, costs: [150, 400, 800, 1500, 3000], desc: '+5% Steering per level' },
  nitrous: { id: 'nitrous', name: 'NITROUS', icon: '🔥', max: 3, costs: [500, 1500, 3000], desc: '+2s Nitro Boost per level' }
};
const UPGRADE_KEYS = ['speed', 'fireRate', 'hp', 'shield', 'engine', 'tires', 'nitrous'];
let upgrades = { speed: 0, fireRate: 0, hp: 0, shield: 0, engine: 0, tires: 0, nitrous: 0 };
try { const su = localStorage.getItem('neon_racer_upgrades'); if (su) upgrades = Object.assign(upgrades, JSON.parse(su)); } catch (e) {}
function saveUpgrades() { try { localStorage.setItem('neon_racer_upgrades', JSON.stringify(upgrades)); } catch (e) {} }
function getMaxHP() { return 3 + (upgrades.hp || 0); }
function getRunMaxHP() { return gameMode === 'elimination' ? 1 : getMaxHP(); }
function getSpeedMult() { return 1 + (upgrades.speed || 0) * 0.08 + (upgrades.engine || 0) * 0.10; }
function getSteerSpeed() { return STEER_SPEEDS[sensitivity] * (1 + (upgrades.tires || 0) * 0.05) * laneSpeedMult(); }

const UPG_STEP = 74, UPG_START = 98, UPG_HEADER = 84;
let upgScroll = 0, scrollTouch = null;
function clampUpgScroll(v) {
  const contentBottom = UPG_START + UPGRADE_KEYS.length * UPG_STEP, minS = Math.min(0, screenHeight - contentBottom - 12);
  return Math.max(minS, Math.min(0, v));
}

// NITRO
let nitroTimer = 0, nitroCooldown = 0, nitroDuration = 3;

        if (shieldTimer > 0) {

          floatingTexts.push({ text: 'SHIELD DEFLECTED CHARGE!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
        } else if (postClutchInvincibleTimer > 0) {
          // invincible
        } else if (lastChanceActive) {
          if (handleLethalHit()) return;
        } else {
          playerHP -= 1; screenDamageFlash = 0.45; screenDamageFlashColor = 'rgba(176, 38, 255, 0.5)'; soundPlayerHit();
          triggerScreenShake(8, 0.3);
          if (playerHP <= 0) { if (handleLethalHit()) return; }
        }
      }
      if (boss.y >= screenHeight * 0.72) boss.chargeState = 3;
    } else if (boss.chargeState === 3) {
      boss.y -= 380 * dt;
      if (boss.y <= boss.baseTargetY) {
        boss.y = boss.baseTargetY;
        boss.targetY = boss.baseTargetY;
        boss.chargeState = 0;
        boss.chargeTimer = 6.0 + Math.random() * 3.0;
      }
    }
  } else {
    if (boss.y < boss.targetY) { boss.y += 180 * dt; if (boss.y > boss.targetY) boss.y = boss.targetY; }
    boss.sinOffset += dt * 1.8;
    boss.x = (roadX + roadW / 2) + Math.sin(boss.sinOffset) * ((roadW / 2) - (boss.width / 2) - 16);
  }

  // ATTACK LOGIC
  boss.shootTimer += dt;
  if (boss.isMega) {
    if (boss.telegraphTimer > 0) {
      boss.telegraphTimer -= dt;
      if (boss.telegraphTimer <= 0) {
        soundLightning(); boss.strikeActive = 0.25; const sx = boss.telegraphX;
        for (let p = 0; p < 35; p++) particles.push({ x: sx + (Math.random() - 0.5) * 38, y: Math.random() * screenHeight, vx: (Math.random() - 0.5) * 130, vy: (Math.random() - 0.5) * 130, size: 3.5, color: '#ffe600', alpha: 1, decay: 2.8 });
        if (Math.abs(player.x - sx) < (player.width / 2 + 16)) {
          if (shieldTimer > 0) {
            shieldTimer = 0; soundPowerup();
            floatingTexts.push({ text: 'SHIELD GROUNDED!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
          } else if (postClutchInvincibleTimer > 0) {
            // invincible
          } else if (lastChanceActive) {
            if (handleLethalHit()) return;
          } else {
            playerHP -= 1; screenDamageFlash = 0.45; screenDamageFlashColor = 'rgba(255, 220, 0, 0.5)'; soundPlayerHit();
            triggerScreenShake(8, 0.3);
            if (playerHP <= 0) { if (handleLethalHit()) return; }
          }
        }
      }
    }
    if (boss.shootTimer >= 1.5 && boss.y >= boss.baseTargetY - 20 && boss.chargeState === 0) {
      boss.shootTimer = 0;
      const pattern = boss.attackPatternIndex % 4;
      boss.attackPatternIndex++;
      if (pattern === 0) {
        soundBossShoot();
        [-0.42, -0.21, 0, 0.21, 0.42].forEach(ang => {
          enemyBullets.push({ x: boss.x, y: boss.y + boss.height / 2 + 10, vx: Math.sin(ang) * 400, vy: Math.cos(ang) * 400, width: 8, height: 16, color: '#ff3300', isBoss: true, type: 'fire' });
        });
      } else if (pattern === 1) {
        soundBossShoot();
        [-0.20, 0, 0.20].forEach(ang => {
          enemyBullets.push({ x: boss.x, y: boss.y + boss.height / 2 + 10, vx: Math.sin(ang) * 250, vy: Math.cos(ang) * 250, width: 9, height: 18, color: '#00e5ff', isBoss: true, type: 'ice' });
        });
      } else if (pattern === 2) {
        boss.telegraphX = player.x; boss.telegraphTimer = 0.75;
      } else if (pattern === 3) {
        soundMissile();
        [-28, 28].forEach(ox => {
          enemyBullets.push({ x: boss.x + ox, y: boss.y + boss.height / 2 + 10, vx: 0, vy: 300, width: 10, height: 18, color: '#b026ff', isBoss: true, type: 'missile', homing: true });
        });
        floatingTexts.push({ text: '🚀 HOMING MISSILES!', x: boss.x, y: boss.y + boss.height / 2 + 30, vy: 40, alpha: 1, decay: 1.4, color: '#b026ff' });
      }
    }
  } else {
    if (boss.y >= boss.targetY - 10) {
      if (boss.type === 'fire' && boss.shootTimer >= 2.0) {
        boss.shootTimer = 0; soundBossShoot();
        [-0.42, -0.21, 0, 0.21, 0.42].forEach(ang => {
          enemyBullets.push({ x: boss.x, y: boss.y + boss.height / 2 + 10, vx: Math.sin(ang) * 360, vy: Math.cos(ang) * 360, width: 7, height: 14, color: '#ff3300', isBoss: true, type: 'fire' });
        });
      } else if (boss.type === 'ice' && boss.shootTimer >= 2.0) {
        boss.shootTimer = 0; soundBossShoot();
        [-0.18, 0, 0.18].forEach(ang => {
          enemyBullets.push({ x: boss.x, y: boss.y + boss.height / 2 + 10, vx: Math.sin(ang) * 210, vy: Math.cos(ang) * 210, width: 8, height: 16, color: '#00e5ff', isBoss: true, type: 'ice' });
        });
      } else if (boss.type === 'electric') {
        if (boss.telegraphTimer > 0) {
          boss.telegraphTimer -= dt;
          if (boss.telegraphTimer <= 0) {
            soundLightning(); boss.strikeActive = 0.25; const sx = boss.telegraphX;
            for (let p = 0; p < 30; p++) particles.push({ x: sx + (Math.random() - 0.5) * 36, y: Math.random() * screenHeight, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120, size: 3.5, color: '#ffe600', alpha: 1, decay: 2.8 });
            if (Math.abs(player.x - sx) < (player.width / 2 + 16)) {
              if (shieldTimer > 0) {
                shieldTimer = 0; soundPowerup();
                floatingTexts.push({ text: 'SHIELD GROUNDED!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
              } else if (postClutchInvincibleTimer > 0) {
                // invincible
              } else if (lastChanceActive) {
                if (handleLethalHit()) return;
              } else {
                playerHP -= 1; screenDamageFlash = 0.45; screenDamageFlashColor = 'rgba(255, 220, 0, 0.5)'; soundPlayerHit();
                triggerScreenShake(8, 0.3);
                if (playerHP <= 0) { if (handleLethalHit()) return; }
              }
            }
          }
        } else if (boss.shootTimer >= 2.2) {
          boss.shootTimer = 0; boss.telegraphX = player.x; boss.telegraphTimer = 0.85;
        }
      }
    }
  }

  boss.dropCarTimer += dt;
  const dropLimit = boss.isMega ? 3.5 : 4.2;
  if (boss.dropCarTimer >= dropLimit && boss.y >= boss.baseTargetY - 10) {
    boss.dropCarTimer = 0;
    const lane = Math.floor(Math.random() * laneCount);
    trafficCars.push({ x: roadX + lane * laneWidth + laneWidth / 2, y: boss.y + boss.height / 2 + 15, width: 38, height: 68, speed: currentSpeed * 0.45, colorPalette: TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)], isEnemy: false, hp: 1, shootCooldown: 999 });
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    if (Math.abs(b.x - boss.x) <= boss.width / 2 && Math.abs(b.y - boss.y) <= boss.height / 2) {
      playerBullets.splice(i, 1); boss.hp -= 1; boss.flashTimer = 0.08;
      for (let p = 0; p < 4; p++) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 150, vy: (Math.random() - 0.5) * 150, size: 3, color: boss.isMega ? getRainbowColor() : boss.color, alpha: 1, decay: 2.5 });
      if (boss.hp <= 0) { defeatBoss(); break; }
    }
  }
}

function defeatBoss() {
  const wasMega = !!boss.isMega;
  soundBossExplosion();
  totalBossesDefeated += 1;

    triggerScreenShake(16, 0.7);

    totalCoins += 10;

    lifetimeStats.megaBossesDefeated = (lifetimeStats.megaBossesDefeated || 0) + 1;
    lifetimeStats.bossesDefeated = (lifetimeStats.bossesDefeated || 0) + 1;
    saveStats();
    checkAchievements();
    floatingTexts.push({ text: '👹 MEGA BOSS DEFEATED! +' + megaPts, x: screenWidth / 2, y: boss.y, vy: 70, alpha: 1, decay: 2.2, color: '#b026ff' });
    floatingTexts.push({ text: '+10 🪙 BONUS & FULL HEALTH!', x: screenWidth / 2, y: boss.y + 36, vy: 55, alpha: 1, decay: 2.2, color: '#ffd700' });
    for (let p = 0; p < 150; p++) {
      const ang = Math.random() * Math.PI * 2, spd = Math.random() * 450 + 60;
      const col = Math.random() < 0.4 ? '#b026ff' : (Math.random() < 0.7 ? getRainbowColor(p * 15) : '#ffd700');
      particles.push({ x: boss.x, y: boss.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: Math.random() * 8 + 3, color: col, alpha: 1, decay: 1.1 });
    }
  } else {
    triggerScreenShake(10, 0.4);
    const bossPts = diffScore(500);

    lifetimeStats.bossesDefeated = (lifetimeStats.bossesDefeated || 0) + 1;
    saveStats();
    checkAchievements();
    floatingTexts.push({ text: boss.name + ' DEFEATED! +' + bossPts, x: screenWidth / 2, y: boss.y, vy: 70, alpha: 1, decay: 1.8, color: '#ffd700' });

    }
  }
  checkDailyProgress(missionEnemiesKilled, gameTime, score, coinsCollected, true);
  boss = null;
}

// COMBAT & ENTITIES
let playerHP = 3, playerShootTimer = 0, rapidFireTimer = 0, shieldTimer = 0, screenDamageFlash = 0, screenDamageFlashColor = 'rgba(255, 0, 50, 0.4)';
const activeTouches = new Map();
let keyLeft = false, keyRight = false;
const player = { x: 0, y: 0, width: 44, height: 82, vx: 0, tilt: 0 };
let trafficCars = [], playerBullets = [], enemyBullets = [], coins = [], powerups = [], particles = [], floatingTexts = [], stars = [];
let nextCarSpawnTimer = 0, nextCoinSpawnTimer = 0, nextPowerupSpawnTimer = 0;
const TRAFFIC_PALETTES = [
  { body: '#ffe600', glow: '#ffe600', light: '#fff275' },
  { body: '#39ff14', glow: '#39ff14', light: '#8aff75' },
  { body: '#b026ff', glow: '#b026ff', light: '#d580ff' },

  { body: '#00e5ff', glow: '#00e5ff', light: '#80f2ff' }
];

// ROAD / LANE LAYOUT (depends on difficulty)
function applyDifficultyLayout() {
  const d = getDifficulty();
  laneCount = d.lanes;
  let w;
  if (laneCount >= 5) w = Math.min(Math.max(screenWidth * 0.94, 360), 540);
  else if (laneCount === 4) w = Math.min(Math.max(screenWidth * 0.86, 320), 500);
  else w = Math.min(Math.max(screenWidth * 0.78, 280), 460);
  // never wider than the screen (fits 5 lanes on 320px phones)
  roadW = Math.min(w, Math.max(200, screenWidth - 8));
  roadX = (screenWidth - roadW) / 2;
  laneWidth = roadW / laneCount;
  player.width = Math.min(Math.max(laneWidth * 0.44, 38), 50);
  player.width = Math.min(player.width, laneWidth * 0.8);
  player.height = player.width * 1.86;
}
function clampPlayerToRoad() {
  const minX = roadX + player.width / 2 + 6, maxX = roadX + roadW - player.width / 2 - 6;
  if (player.x < minX) player.x = minX; else if (player.x > maxX) player.x = maxX;
}

function resize() {
  screenWidth = window.innerWidth; screenHeight = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.floor(screenWidth * dpr); canvas.height = Math.floor(screenHeight * dpr);
  applyDifficultyLayout();
  player.y = (currentState === STATE_MENU || currentState >= STATE_GARAGE) ? screenHeight * 0.78 : (screenHeight - player.height - 40);
  if (currentState === STATE_MENU) player.x = roadX + roadW / 2;
  else clampPlayerToRoad();
  stars = Array.from({ length: Math.max(50, Math.floor((screenWidth * screenHeight) / 10000)) }, () => ({ x: Math.random() * screenWidth, y: Math.random() * screenHeight, radius: Math.random() * 1.5 + 0.5, alpha: Math.random() * 0.8 + 0.2, speed: Math.random() * 18 + 6, pulseSpeed: Math.random() * 3 + 1, pulseOffset: Math.random() * Math.PI * 2 }));
  initWeather();
  upgScroll = clampUpgScroll(upgScroll);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

function setDifficulty(id) {
  if (!DIFFICULTIES.some(d => d.id === id)) return;
  if (id === currentDifficulty) { soundCoin(); return; }
  currentDifficulty = id;
  try { localStorage.setItem('neon_racer_difficulty', id); } catch (e) {}
  // reset active entities when switching difficulty
  trafficCars = []; playerBullets = []; enemyBullets = []; coins = []; powerups = []; particles = []; floatingTexts = [];
  boss = null;
  game.nearMissPopups = [];
  applyDifficultyLayout();
  player.x = roadX + roadW / 2;
  player.y = screenHeight * 0.78;
  soundCoin();
}

function resetSteering() { keyLeft = false; keyRight = false; activeTouches.clear(); }
function isSteeringLeft() {
  if (keyLeft) return true;
  for (const touch of activeTouches.values()) { if (touch.x < screenWidth * 0.5) return true; }
  return false;
}
function isSteeringRight() {
  if (keyRight) return true;
  for (const touch of activeTouches.values()) { if (touch.x >= screenWidth * 0.5) return true; }
  return false;
}

function pauseGame() {
  if (currentState === STATE_PLAYING) {
    currentState = STATE_PAUSED;
    resetSteering();
    stopEngineSound();
    clearScreenShake();
    soundCoin();
  }
}
function resumeGame() {
  if (currentState === STATE_PAUSED) {
    currentState = STATE_PLAYING;
    resetSteering();
    startEngineSound();
    soundCoin();
  }
}
function returnToMainMenu() {
  currentState = STATE_MENU; resetSteering();
  stopEngineSound();
  game.slowMo = 1.0;
  lastChanceActive = false;
  tutorialActive = false;
  clearScreenShake();
  milestonePopup.active = false;
  boss = null; trafficCars = []; playerBullets = []; enemyBullets = []; coins = []; powerups = []; particles = []; floatingTexts = [];
  game.nearMissPopups = [];
  nitroTimer = 0; nitroCooldown = 0;
  player.x = roadX + roadW / 2; player.y = screenHeight * 0.78;
  const hookEl = document.getElementById('gameOverHook');
  if (hookEl) hookEl.style.display = 'none';
  soundCoin();
}

window.addEventListener('keydown', e => {
  initAudio();
  if (tutorialActive) {
    if (e.key === ' ' || e.key === 'Enter') tutorialNext();
    e.preventDefault(); return;
  }
  if (rewardPopup && currentState === STATE_MENU) {
    if (e.key === ' ' || e.key === 'Enter') claimDailyReward();
    e.preventDefault(); return;
  }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (currentState === STATE_PLAYING) pauseGame();
    else if (currentState === STATE_PAUSED) resumeGame();
    else if (currentState >= STATE_GARAGE) returnToMainMenu();
    e.preventDefault(); return;
  }
  if (currentState === STATE_PLAYING) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyLeft = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyRight = true; e.preventDefault(); }
    else if (e.key === 'n' || e.key === 'N' || e.key === ' ' || e.key === 'Shift') { activateNitro(); e.preventDefault(); }
  } else if (e.key === ' ' || e.key === 'Enter') {
    handleActionInput(screenWidth / 2, screenHeight / 2); e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (tutorialActive) { handleTutorialClick(t.clientX, t.clientY); continue; }
    if (currentState === STATE_PLAYING) {
      const px = screenWidth - 58, py = 78, mx = px - 48;
      if (t.clientX >= px && t.clientX <= px + 40 && t.clientY >= py && t.clientY <= py + 40) { pauseGame(); return; }
      if (t.clientX >= mx && t.clientX <= mx + 40 && t.clientY >= py && t.clientY <= py + 40) { toggleSound(); return; }
      if (inNitroBtn(t.clientX, t.clientY)) { activateNitro(); continue; }
    }
    if (currentState === STATE_UPGRADES && !rewardPopup) {
      scrollTouch = { id: t.identifier, startY: t.clientY, lastY: t.clientY, moved: false };
      continue;
    }
    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    handleActionInput(t.clientX, t.clientY);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (scrollTouch && t.identifier === scrollTouch.id) {
      const dy = t.clientY - scrollTouch.lastY; scrollTouch.lastY = t.clientY;
      if (Math.abs(t.clientY - scrollTouch.startY) > 10) scrollTouch.moved = true;
      if (scrollTouch.moved && currentState === STATE_UPGRADES) upgScroll = clampUpgScroll(upgScroll + dy);
    }
  }
}, { passive: false });

const endTouch = (e, cancelled) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    activeTouches.delete(t.identifier);
    if (scrollTouch && t.identifier === scrollTouch.id) {
      if (!cancelled && !scrollTouch.moved && currentState === STATE_UPGRADES) handleActionInput(t.clientX, t.clientY);
      scrollTouch = null;
    }
  }
};
canvas.addEventListener('touchend', e => endTouch(e, false), { passive: false });
canvas.addEventListener('touchcancel', e => endTouch(e, true), { passive: false });
canvas.addEventListener('wheel', e => { if (currentState === STATE_UPGRADES) { upgScroll = clampUpgScroll(upgScroll - e.deltaY); e.preventDefault(); } }, { passive: false });

canvas.addEventListener('mousedown', e => {
  initAudio();
  if (tutorialActive) { handleTutorialClick(e.clientX, e.clientY); return; }
  if (currentState === STATE_PLAYING) {
    const px = screenWidth - 58, py = 78, mx = px - 48;
    if (e.clientX >= px && e.clientX <= px + 40 && e.clientY >= py && e.clientY <= py + 40) { pauseGame(); return; }
    if (e.clientX >= mx && e.clientX <= mx + 40 && e.clientY >= py && e.clientY <= py + 40) { toggleSound(); return; }
    if (inNitroBtn(e.clientX, e.clientY)) { activateNitro(); return; }
    if (e.clientX < screenWidth * 0.5) keyLeft = true; else keyRight = true;
  }
  handleActionInput(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { keyLeft = false; keyRight = false; });

// Main menu is vertically shifted up a little on short screens so every button stays visible
function menuShift() { return Math.min(0, screenHeight / 2 - 276); }

function handleActionInput(cx, cy) {
  const midX = screenWidth / 2, midY = screenHeight / 2;
  if (tutorialActive) { handleTutorialClick(cx, cy); return; }
  if (rewardPopup && currentState === STATE_MENU) {
    if (Math.abs(cx - midX) <= 100 && Math.abs(cy - (midY + 105)) <= 26) claimDailyReward();
    return;
  }
  if (currentState === STATE_MENU) {
    const my = midY + menuShift();
    if (cx >= screenWidth - 62 && cy <= 62) { toggleSound(); return; }
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (my - 50)) <= 24) { startGame(); return; }
    if (Math.abs(cx - midX) <= 100 && Math.abs(cy - (my - 4)) <= 20) { currentState = STATE_GARAGE; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= 100 && Math.abs(cy - (my + 40)) <= 20) { currentState = STATE_UPGRADES; upgScroll = 0; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (my + 132)) <= 17) { currentState = STATE_MODE; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (my + 170)) <= 17) { currentState = STATE_DIFFICULTY; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= 110 && Math.abs(cy - (my + 208)) <= 17) { currentState = STATE_ACHIEVEMENTS; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= 110 && Math.abs(cy - (my + 246)) <= 17) { currentState = STATE_SETTINGS; soundPowerup(); return; }
  } else if (currentState === STATE_SETTINGS) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    const sensKeys = ['slow', 'normal', 'fast'];
    sensKeys.forEach((k, i) => {
      const bx = midX + (i - 1) * 100;
      if (Math.abs(cx - bx) <= 46 && Math.abs(cy - 160) <= 19) {
        sensitivity = k; try { localStorage.setItem('neon_racer_sensitivity', k); } catch (e) {} soundCoin();
      }
    });
    [[272, 'music'], [382, 'sfx']].forEach(row => {
      const ry = row[0];
      if (Math.abs(cy - ry) <= 22) {
        let d = 0;
        if (Math.abs(cx - (midX - 90)) <= 26) d = -10; else if (Math.abs(cx - (midX + 90)) <= 26) d = 10;
        if (d !== 0) {
          if (row[1] === 'music') { musicVolPct = Math.min(100, Math.max(0, musicVolPct + d)); try { localStorage.setItem('neon_racer_music_vol', String(musicVolPct)); } catch (e) {} }
          else { sfxVolPct = Math.min(100, Math.max(0, sfxVolPct + d)); try { localStorage.setItem('neon_racer_sfx_vol', String(sfxVolPct)); } catch (e) {} soundCoin(); }
        }
      }
    });
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - 500) <= 19) {
      tutorialDone = false;
      try { localStorage.removeItem('neon_racer_tutorial_done'); } catch (e) {}
      soundCoin();
      showToast('Tutorial will show next game', '#00ffff');
      return;
    }
  } else if (currentState === STATE_MODE) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    const cardW = Math.min(screenWidth * 0.88, 380), cardH = 78, startY = 100;
    MODES.forEach((m, idx) => {
      const cardY = startY + idx * 90, cardX = midX - cardW / 2;
      if (cx >= cardX && cx <= cardX + cardW && cy >= cardY && cy <= cardY + cardH) {
        gameMode = m.id; try { localStorage.setItem('neon_racer_mode', gameMode); } catch (e) {} soundCoin();
      }
    });
  } else if (currentState === STATE_DIFFICULTY) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    const cardW = Math.min(screenWidth * 0.88, 380), cardH = 90, startY = 100;
    DIFFICULTIES.forEach((d, idx) => {
      const cardY = startY + idx * (cardH + 12), cardX = midX - cardW / 2;
      if (cx >= cardX && cx <= cardX + cardW && cy >= cardY && cy <= cardY + cardH) setDifficulty(d.id);
    });
  } else if (currentState === STATE_PAUSED) {
    const btnW = 200, btnH = 46, resY = midY - 15, rstY = resY + 62, quitY = rstY + 62;
    if (Math.abs(cx - midX) <= btnW / 2) {
      if (Math.abs(cy - resY) <= btnH / 2) { resumeGame(); return; }
      if (Math.abs(cy - rstY) <= btnH / 2) { startGame(); return; }
      if (Math.abs(cy - quitY) <= btnH / 2) { returnToMainMenu(); return; }
    }
  } else if (currentState === STATE_GARAGE) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    const cardW = Math.min(screenWidth * 0.88, 380), cardH = 82, startY = 95;
    SKINS.forEach((skin, idx) => {
      const cardY = startY + idx * 98, cardX = midX - cardW / 2;
      if (cx >= cardX && cx <= cardX + cardW && cy >= cardY && cy <= cardY + cardH) {
        if (unlockedSkinIds.includes(skin.id)) { selectedSkinId = skin.id; try { localStorage.setItem('neon_racer_selected_skin', selectedSkinId); } catch (e) {} soundCoin(); }
        else soundPlayerHit();
      }
    });
  } else if (currentState === STATE_UPGRADES) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    if (cy < UPG_HEADER) return;
    const cardW = Math.min(screenWidth * 0.90, 390), cardH = 64;
    UPGRADE_KEYS.forEach((key, idx) => {
      const def = UPGRADE_DEFS[key], cardY = UPG_START + idx * UPG_STEP + upgScroll, cardX = midX - cardW / 2, cur = upgrades[key] || 0;
      const btnW = 92, btnH = 36, bx = cardX + cardW - btnW - 12, by = cardY + (cardH - btnH) / 2;
      if (cx >= bx && cx <= bx + btnW && cy >= by && cy <= by + btnH) {
        if (cur < def.max) {
          const cost = def.costs[cur];
          if (totalCoins >= cost) {
            totalCoins -= cost; upgrades[key] = cur + 1; saveCoins(); saveUpgrades(); soundCoin();
            showToast('+ ' + def.name + ' LV ' + upgrades[key], '#39ff14');
          } else { soundPlayerHit(); showToast('NEED ' + (cost - totalCoins) + ' MORE COINS!', '#ff0055'); }
        }
      }
    });
  } else if (currentState === STATE_ACHIEVEMENTS) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { returnToMainMenu(); return; }
  } else if (currentState === STATE_GAMEOVER) {
    if (performance.now() - gameOverTimestamp >= 400) {
      if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (midY + 174)) <= 26) { returnToMainMenu(); return; }
      if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (midY + 116)) <= 26) { startGame(); return; }
      startGame();
    }
  }
}

function startGame() {
  initDailyChallenge(); currentState = STATE_PLAYING;

  score = 0; distanceTraveled = 0; coinsCollected = 0; gameTime = 0; gameOverReason = 'crash';

  nitroTimer = 0; nitroCooldown = 0; driftScore = 0; driftStreak = 0; driftCombo = false; driftActive = false; musicTimer = 0;
  comboKills = 0; lastComboTier = 1;
  lastBossThreshold = 0; boss = null; totalBossesDefeated = 0;

  // milestones, kill streak, shake reset
  nextMilestone = 5000; milestonesReached = 0;
  milestonePopup = { score: 0, reward: 0, timer: 0, active: false };
  killStreakCount = 0; killStreakTimer = 0; lastKillTime = 0;
  clearScreenShake();

  game.slowMo = 1.0;

  gameOverHookMain = '';
  gameOverHookSub = '';

  const hookEl = document.getElementById('gameOverHook');
  if (hookEl) hookEl.style.display = 'none';

  trafficCars = []; playerBullets = []; enemyBullets = []; coins = []; powerups = []; particles = []; floatingTexts = [];
  nextCarSpawnTimer = 0.8 / getDifficulty().spawnRateMult; nextCoinSpawnTimer = 1.6; nextPowerupSpawnTimer = 7.0;
  player.x = roadX + roadW / 2; player.vx = 0; player.tilt = 0; player.y = screenHeight - player.height - 40;
  lifetimeStats.totalGames += 1; saveStats(); initWeather(); checkAchievements(); assignRandomMission(); soundStart();
  startEngineSound();

}

function triggerGameOver() {
  const timeUp = gameOverReason === 'time';
  currentState = STATE_GAMEOVER; gameOverTimestamp = performance.now(); resetSteering();
  stopEngineSound();
  game.slowMo = 1.0;
  lastChanceActive = false;
  if (timeUp) soundMissionComplete(); else soundCrash();

  // ONE MORE RUN HOOK (compared against your best on this difficulty)
  const prevBest = bestDiffBeforeRun;
  const diff = prevBest - score;
  if (prevBest === 0) {
    gameOverHookMain = '🏁 FIRST RUN! Set a new record!';
  } else if (score > prevBest) {
    gameOverHookMain = '🎉 NEW HIGH SCORE!';
  } else if (diff <= 100) {
    gameOverHookMain = `🔥 SO CLOSE! Only ${diff} points from your best!`;
  } else if (diff <= 500) {
    gameOverHookMain = `💪 You were ${diff} points from your best!`;
  } else if (diff <= 2000) {
    gameOverHookMain = `⚡ ${diff} points away from your best. Try again!`;
  } else {
    gameOverHookMain = `🎯 Your best: ${prevBest}. You can do better!`;
  }
  gameOverHookSub = '';
  if (comboKills >= 8 && comboKills <= 9) {
    gameOverHookSub = `🎯 ${10 - comboKills} more kills for x2 COMBO!`;
  } else if (comboKills >= 18 && comboKills <= 19) {
    gameOverHookSub = `🎯 ${20 - comboKills} more kills for x3 COMBO!`;
  } else if (boss && boss.hp > 0 && boss.hp < 20) {
    gameOverHookSub = `👹 Boss had only ${boss.hp} HP left!`;
  }

  saveStats();
  try { localStorage.setItem('neon_racer_best', bestScore.toString()); } catch (e) {}
  checkSkinUnlocks();
  checkAchievements();

  const hookEl = document.getElementById('gameOverHook');
  if (hookEl) {
    let hookHtml = `<div>${gameOverHookMain}</div>`;
    if (gameOverHookSub) {
      hookHtml += `<div style="font-size: 11.5px; margin-top: 3px; color: #ffe600; opacity: 0.95;">${gameOverHookSub}</div>`;
    }
    hookEl.innerHTML = hookHtml;
    hookEl.style.display = 'block';
  }

  for (let i = 0; i < 45; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 260 + 40;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: 4, color: timeUp ? (Math.random() > 0.4 ? '#39ff14' : '#00ffff') : (Math.random() > 0.4 ? '#ff0055' : '#00ffff'), alpha: 1, decay: 1.8 });
  }
}

function laneIndexOf(x) { return Math.floor((x - roadX) / laneWidth); }

function spawnTrafficCar() {
  if (boss !== null) return;
  const occupied = [];
  trafficCars.forEach(c => { if (c.y < 240) { const idx = laneIndexOf(c.x); if (idx >= 0 && idx < laneCount && !occupied.includes(idx)) occupied.push(idx); } });
  const maxOccupied = laneCount >= 5 ? 3 : 2;
  if (occupied.length >= maxOccupied) return;
  // don't drop a car on top of a freshly spawned coin / powerup
  const itemLanes = [];
  coins.concat(powerups).forEach(it => { if (it.y < 110) { const idx = laneIndexOf(it.x); if (!itemLanes.includes(idx)) itemLanes.push(idx); } });
  const avail = [];
  for (let l = 0; l < laneCount; l++) { if (!occupied.includes(l) && !itemLanes.includes(l)) avail.push(l); }
  if (!avail.length) return;
  const lane = avail[Math.floor(Math.random() * avail.length)];
  const df = getDifficulty();
  const ws = WEATHER_DEFS[currentWeather].enemySlow || 1.0;
  const elim = gameMode === 'elimination';
  const isE = Math.random() < (elim ? 0.6 : 0.38);
  trafficCars.push({
    x: roadX + lane * laneWidth + laneWidth / 2, y: -100, width: player.width * 0.94, height: player.height * 0.94,
    speed: currentSpeed * (0.35 + Math.random() * 0.35) * ws * df.trafficSpeedMult, isEnemy: isE, hp: 1, shootCooldown: elim ? 0.4 + Math.random() * 0.5 : 1.0 + Math.random(),
    colorPalette: isE ? { body: '#ff0033', glow: '#ff0033', light: '#ff4d6d' } : TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)]
  });
}

// Pick a lane for a coin / powerup that has no traffic car (or other pickup) where it would spawn / catch up
function pickFreeLane(spawnY) {
  const free = [];
  for (let l = 0; l < laneCount; l++) {
    const lx = roadX + l * laneWidth + laneWidth / 2;
    let blocked = false;
    for (let i = 0; i < trafficCars.length && !blocked; i++) {
      const c = trafficCars[i];
      if (Math.abs(c.x - lx) < laneWidth * 0.5 && c.y > spawnY - 90 && c.y < screenHeight + 60) blocked = true;
    }
    if (!blocked) {
      const others = coins.concat(powerups);
      for (let i = 0; i < others.length && !blocked; i++) {
        const o = others[i];
        if (Math.abs(o.x - lx) < laneWidth * 0.5 && Math.abs(o.y - spawnY) < 70) blocked = true;
      }
    }
    if (!blocked) free.push(l);
  }
  return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
}

function applyPowerup(type) {
  if (type === 'shield') {
    shieldTimer = 8.0 + (upgrades.shield || 0) * 2;
    floatingTexts.push({ text: `SHIELD ACTIVE (${shieldTimer.toFixed(0)}s)!`, x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00e5ff' });
  } else if (type === 'rapid') {
    rapidFireTimer = 7.0;
    floatingTexts.push({ text: 'RAPID FIRE!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#ffe600' });
  } else if (type === 'health') {
    playerHP = Math.min(playerHP + 1, getRunMaxHP());
    floatingTexts.push({ text: '+1 HEALTH!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#39ff14' });
  }
}

// UPDATE
function update(dt) {
  if (currentState === STATE_PAUSED) return;
  updateScreenShake();
  if (tutorialActive) return;
  if (toastTimer > 0) toastTimer -= dt;
  if (lastChanceToastTimer > 0) lastChanceToastTimer -= dt;
  if (clutchSaveToastTimer > 0) clutchSaveToastTimer -= dt;
  if (postClutchInvincibleTimer > 0) postClutchInvincibleTimer = Math.max(0, postClutchInvincibleTimer - dt);
  if (milestonePopup.active) {
    milestonePopup.timer -= dt;
    if (milestonePopup.timer <= 0) { milestonePopup.timer = 0; milestonePopup.active = false; }
  }

  if (lastChanceActive) {
    lastChanceTimer -= dt;
    if (lastChanceTimer <= 0) {
      lastChanceActive = false;
      game.slowMo = 1.0;
      playerHP = 1;
      postClutchInvincibleTimer = 2.0;
      clutchSaveToast = true;
      clutchSaveToastTimer = 2.0;
      soundMissionComplete();
      floatingTexts.push({ text: '💚 CLUTCH SAVE!', x: player.x, y: player.y - 45, vy: 50, alpha: 1, decay: 2.0, color: '#00ff88' });
    }
  }

  if (nearMissCooldown > 0) nearMissCooldown -= dt;
  gameTime += dt;
  stars.forEach(s => { s.y += (s.speed + (currentState === STATE_PLAYING ? (currentSpeed - 420) * 0.1 : 0)) * dt; if (s.y > screenHeight) { s.y = 0; s.x = Math.random() * screenWidth; } });

  if (currentState !== STATE_PLAYING) {
    player.x = roadX + roadW / 2 + Math.sin(gameTime * 1.5) * 12;
    player.tilt = Math.sin(gameTime * 1.5) * 0.05;
    roadScrollOffset = (roadScrollOffset + 180 * dt) % 60;
    return;
  }

  updateWeather(dt);
  updateMusic(dt);
  updateEngineSound();
  if (playerFrozenTimer > 0) playerFrozenTimer = Math.max(0, playerFrozenTimer - dt);

  if (nitroTimer > 0) { nitroTimer -= dt; if (nitroTimer <= 0) { nitroTimer = 0; nitroCooldown = 5; } }
  else if (nitroCooldown > 0) nitroCooldown = Math.max(0, nitroCooldown - dt);

  // kill streak decay
  if (killStreakTimer > 0) {
    killStreakTimer -= dt;
    if (killStreakTimer <= 0) { killStreakTimer = 0; killStreakCount = 0; }
  }

  checkBossSpawn(); updateBoss(dt); checkSkinUnlocks(); updateMissionProgress();
  checkDailyProgress(missionEnemiesKilled, gameTime, score, coinsCollected, false); checkAchievements();

  if (screenDamageFlash > 0) screenDamageFlash = Math.max(0, screenDamageFlash - dt * 2.2);
  if (rapidFireTimer > 0) rapidFireTimer = Math.max(0, rapidFireTimer - dt);
  if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - dt);

  playerShootTimer += dt;
  const fireInterval = (rapidFireTimer > 0 ? 0.14 : 0.3) * (1 - (upgrades.fireRate || 0) * 0.05);
  if (playerShootTimer >= fireInterval) {
    playerShootTimer = 0;
    if (gameMode !== 'drift') {
      const sk = getSelectedSkin(), bCol = sk.glow === 'rainbow' ? getRainbowColor() : sk.glow;
      playerBullets.push({ x: player.x - 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
      playerBullets.push({ x: player.x + 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
      soundPlayerShoot();
    }
  }

  const freezeFactor = playerFrozenTimer > 0 ? 0.5 : 1.0;
  let moveDir = 0;
  if (isSteeringLeft()) moveDir -= 1;
  if (isSteeringRight()) moveDir += 1;
  driftActive = moveDir !== 0;
  if (driftActive) { driftStreak += dt; driftCombo = driftStreak >= 3; driftScore += (driftCombo ? 10 : 5) * dt; }
  else { driftStreak = 0; driftCombo = false; }

  let spd = Math.min((420 * getSpeedMult() + distanceTraveled * 0.028) * (1.0 + (WEATHER_DEFS[currentWeather].speedBoost || 0)) * freezeFactor, 950);
  if (nitroTimer > 0) spd *= 1.5;
  currentSpeed = spd;
  const roadTravel = currentSpeed * dt;
  distanceTraveled += roadTravel;
  const dMult = getDifficulty().scoreMult;
  if (gameMode === 'drift') score = Math.floor((Math.floor(driftScore) + coinsCollected * 5) * dMult);
  else score = Math.floor((Math.floor((distanceTraveled / 30) * getWeatherScoreMultiplier()) + coinsCollected * 5) * (gameMode === 'elimination' ? 2 : 1) * dMult);
  if (score > bestScore) bestScore = score;
  roadScrollOffset = (roadScrollOffset + roadTravel) % 60;

  // milestone rewards use the raw (already multiplied) score
  checkMilestones();

  if (gameMode === 'timetrial' && gameTime >= TIME_TRIAL_DURATION) {
    score += 250; gameOverReason = 'time';
    floatingTexts.push({ text: "TIME'S UP! +250", x: screenWidth / 2, y: screenHeight * 0.4, vy: 40, alpha: 1, decay: 1.5, color: '#39ff14' });
    triggerGameOver(); return;
  }

  player.vx = moveDir * getSteerSpeed() * freezeFactor;
  player.x += player.vx * dt;
  player.tilt += (moveDir * 0.14 - player.tilt) * Math.min(dt * 15, 1);
  const minX = roadX + player.width / 2 + 6, maxX = roadX + roadW - player.width / 2 - 6;
  if (player.x < minX) { player.x = minX; player.vx = 0; } else if (player.x > maxX) { player.x = maxX; player.vx = 0; }

  const curSkin = getSelectedSkin(), trCol = curSkin.trail === 'rainbow' ? getRainbowColor(180) : curSkin.trail;
  [-8, 8].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 - 2, vx: (Math.random() - 0.5) * 20, vy: 140, size: 3, color: trCol, alpha: 0.75, decay: 3.5 }));
  if (nitroTimer > 0) {
    [-9, 0, 9].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 + 4, vx: (Math.random() - 0.5) * 40, vy: 280 + Math.random() * 120, size: 3 + Math.random() * 3, color: Math.random() > 0.5 ? '#00ffff' : '#80f2ff', alpha: 0.9, decay: 3.2 }));
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) { const b = playerBullets[i]; b.y += b.vy * dt; if (b.y < -30) playerBullets.splice(i, 1); }

  // ENEMY BULLETS + NEAR MISS DETECTION
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.homing) {
      const dx = player.x - b.x;
      b.vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2.2, 160);
      particles.push({ x: b.x, y: b.y - 6, vx: (Math.random() - 0.5) * 30, vy: -50, size: 2.5, color: '#b026ff', alpha: 0.8, decay: 4 });
    }
    b.y += (b.vy || 500) * dt; if (b.vx) b.x += b.vx * dt;

    if (gameMode !== 'drift' && !b.nearMissAwarded) {
      const bdx = Math.abs(b.x - player.x);
      const bdy = Math.abs(b.y - player.y);
      if (bdx > 20 && bdx < 60 && bdy < 60) {
        if (nearMissCooldown <= 0) {
          b.nearMissAwarded = true;
          nearMissCooldown = 0.3;
          score += 5;
          soundCoin();
          game.nearMissPopups.push({ text: 'NEAR MISS +5', x: player.x, y: player.y - 35, vy: 40, alpha: 1, decay: 1.0, color: '#00ffff' });
        }
      }
    }

    if (Math.abs(b.x - player.x) <= player.width * 0.42 && Math.abs(b.y - player.y) <= player.height * 0.44) {
      const isIce = b.type === 'ice', isMissile = b.type === 'missile';
      enemyBullets.splice(i, 1); comboKills = 0; lastComboTier = 1;
      if (shieldTimer > 0) {
        shieldTimer = 0; soundPowerup();
        floatingTexts.push({ text: 'SHIELD ABSORBED!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
      } else if (postClutchInvincibleTimer > 0) {
        // invincible
      } else if (lastChanceActive) {
        if (handleLethalHit()) return;
      } else {
        playerHP -= 1;
        screenDamageFlash = 0.45;
        screenDamageFlashColor = isIce ? 'rgba(0, 229, 255, 0.45)' : (isMissile ? 'rgba(176, 38, 255, 0.5)' : 'rgba(255, 0, 50, 0.45)');
        triggerScreenShake(8, 0.3);
        if (isIce) { playerFrozenTimer = 1.0; soundFreeze(); floatingTexts.push({ text: '❄️ FROZEN! 50% SPEED', x: player.x, y: player.y - 45, vy: 40, alpha: 1, decay: 1.8, color: '#00e5ff' }); }
        else soundPlayerHit();
        for (let p = 0; p < 15; p++) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180, size: 3, color: isIce ? '#00e5ff' : (isMissile ? '#b026ff' : '#ff0055'), alpha: 1, decay: 2.5 });
        if (playerHP <= 0) { if (handleLethalHit()) return; }
      }
      continue;
    }
    if (b.y > screenHeight + 40 || b.x < -30 || b.x > screenWidth + 30) enemyBullets.splice(i, 1);
  }

  // UPDATE NEAR MISS POPUPS
  for (let i = game.nearMissPopups.length - 1; i >= 0; i--) {
    const p = game.nearMissPopups[i];
    p.y -= p.vy * dt;
    p.alpha -= p.decay * dt;
    if (p.alpha <= 0) game.nearMissPopups.splice(i, 1);
  }

  if (boss === null) {
    if ((nextCarSpawnTimer -= dt) <= 0) { spawnTrafficCar(); nextCarSpawnTimer = (Math.max(1.0 - (currentSpeed - 420) * 0.0012, 0.45) + Math.random() * 0.4) * (gameMode === 'elimination' ? 0.7 : 1) * (1 / getDifficulty().spawnRateMult); }
    if ((nextCoinSpawnTimer -= dt) <= 0) {
      const cl = pickFreeLane(-40);
      if (cl < 0) { nextCoinSpawnTimer = 0.25; }
      else { coins.push({ x: roadX + cl * laneWidth + laneWidth / 2, y: -40, radius: 13, pulseOffset: Math.random() * 6 }); nextCoinSpawnTimer = 1.4 + Math.random() * 1.8; }
    }
    if ((nextPowerupSpawnTimer -= dt) <= 0) {
      const pl = pickFreeLane(-50);
      if (pl < 0) { nextPowerupSpawnTimer = 0.25; }
      else {
        const ptypes = gameMode === 'elimination' ? ['shield', 'rapid'] : ['shield', 'rapid', 'health'];
        powerups.push({ type: ptypes[Math.floor(Math.random() * ptypes.length)], x: roadX + pl * laneWidth + laneWidth / 2, y: -50, radius: 17, pulseOffset: Math.random() * 6 });
        nextPowerupSpawnTimer = 10.0 + Math.random() * 6;
      }
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i]; p.y += currentSpeed * dt;
    if (Math.hypot(player.x - p.x, player.y - p.y) < player.width / 2 + p.radius) { applyPowerup(p.type); soundPowerup(); powerups.splice(i, 1); continue; }
    if (p.y > screenHeight + 60) powerups.splice(i, 1);
  }

  for (let i = trafficCars.length - 1; i >= 0; i--) {
    const car = trafficCars[i]; car.y += (currentSpeed - car.speed) * dt;
    if (car.isEnemy && (car.shootCooldown -= dt) <= 0 && car.y > 20 && car.y < screenHeight - 120) {
      const elim = gameMode === 'elimination';
      car.shootCooldown = elim ? 0.75 : 1.5;
      enemyBullets.push({ x: car.x, y: car.y + car.height / 2 + 6, vy: elim ? 620 : 500, width: 5, height: 14 });
      soundEnemyShoot();
    }
    let destroyed = false;
    for (let j = playerBullets.length - 1; j >= 0; j--) {
      const b = playerBullets[j];
      if (Math.abs(b.x - car.x) <= car.width / 2 && Math.abs(b.y - car.y) <= car.height / 2) {
        playerBullets.splice(j, 1);
        if ((car.hp -= 1) <= 0) {
          destroyed = true; comboKills += 1; const mult = getComboMultiplier(); checkComboTierUp();
          registerKillStreak();
          const pts = Math.round(10 * mult * getDifficulty().scoreMult); score += pts; distanceTraveled += 300; missionEnemiesKilled += 1; lifetimeStats.totalEnemies += 1;
          soundEnemyExplosion();
          floatingTexts.push({ text: `+${pts}${mult > 1 ? (' x' + mult) : ''}`, x: car.x, y: car.y, vy: 55, alpha: 1, decay: 1.8, color: getComboColor(mult) });
          for (let p = 0; p < 20; p++) particles.push({ x: car.x, y: car.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, size: 3.5, color: car.colorPalette.glow, alpha: 1, decay: 1.8 });
          break;
        }
      }
    }
    if (destroyed) { trafficCars.splice(i, 1); continue; }
    if (Math.abs(player.x - car.x) < player.width * 0.7 && Math.abs(player.y - car.y) < player.height * 0.75) {
      comboKills = 0; lastComboTier = 1;
      if (shieldTimer > 0) {
        shieldTimer = 0; trafficCars.splice(i, 1); soundEnemyExplosion();
        floatingTexts.push({ text: 'SHIELD RAM!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
      } else if (postClutchInvincibleTimer > 0) {
        // invincible
      } else if (lastChanceActive) {
        if (handleLethalHit()) return;
      } else {
        trafficCars.splice(i, 1);
        if (handleLethalHit()) return;
      }
    }
    if (car.y > screenHeight + 120) trafficCars.splice(i, 1);
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i]; c.y += currentSpeed * dt;
    if (Math.hypot(player.x - c.x, player.y - c.y) < player.width / 2 + c.radius) {
      const coinPts = diffScore(5);
      coinsCollected += 1; totalCoins += 1; saveCoins(); score += coinPts; missionCoinsGathered += 1; lifetimeStats.totalCoins += 1;
      soundCoin();
      floatingTexts.push({ text: `+${coinPts} (🪙+1)`, x: c.x, y: c.y, vy: 60, alpha: 1, decay: 2, color: '#ffd700' });
      for (let p = 0; p < 8; p++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120, size: 2.5, color: '#ffd700', alpha: 1, decay: 2 });
      coins.splice(i, 1); continue;
    }
    if (c.y > screenHeight + 40) coins.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; if ((p.alpha -= p.decay * dt) <= 0) particles.splice(i, 1); }
  for (let i = floatingTexts.length - 1; i >= 0; i--) { const ft = floatingTexts[i]; ft.y -= ft.vy * dt; if ((ft.alpha -= ft.decay * dt) <= 0) floatingTexts.splice(i, 1); }
}

function drawBackground() {

function drawTutorial() {
  const L = tutorialLayout(), st = TUTORIAL_STEPS[Math.min(tutorialStep, TUTORIAL_STEPS.length - 1)];

  }
  // icon
  ctx.font = '48px sans-serif'; ctx.fillStyle = '#ffffff';
  ctx.fillText(st.icon, L.midX, L.cy0 + 66);

    ctx.fillText(ln, L.midX, L.cy0 + 160 + i * 24);

  // NEXT / START button
  drawBtn(L.midX, L.cy0 + L.chh - 62, 180, 44, '#00ffff', '#051829', last ? 'START RACING' : 'NEXT ▶', 16);
  // progress dots
  const n = TUTORIAL_STEPS.length, gap = 18, sx = L.midX - ((n - 1) * gap) / 2;

    ctx.strokeStyle = d.color; ctx.lineWidth = 1.2; ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.roundRect(cardX + 62, by, 62, bh, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = d.color; ctx.textAlign = 'center'; ctx.fillText(d.lanes + ' LANES', cardX + 62 + 31, by + bh / 2 + 0.5);
    ctx.strokeStyle = '#ffd700'; ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.roundRect(cardX + 130, by, 46, bh, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd700'; ctx.fillText(d.scoreMult.toFixed(1) + 'x', cardX + 130 + 23, by + bh / 2 + 0.5);
    // best score on this difficulty
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText('BEST: ' + (bestByDiff[d.id] || 0), cardX + cardW - 12, by + bh / 2 + 0.5);
    if (sel) { ctx.fillStyle = d.color; ctx.font = 'bold 11px sans-serif'; ctx.fillText('SELECTED ★', cardX + cardW - 12, cardY + 22); }
    ctx.restore();
  });
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#667'; ctx.font = '10.5px sans-serif';
  ctx.fillText('Difficulty changes lanes, traffic speed, spawn rate & score', midX, startY + DIFFICULTIES.length * (cardH + 12) + 10);
  ctx.restore();
}

function drawGarage() {
  ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
  const midX = screenWidth / 2;
  drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
  ctx.textAlign = 'center'; ctx.font = '900 22px sans-serif'; ctx.fillStyle = '#ff007f'; ctx.fillText('CYBER GARAGE', midX + 20, 43);
  const cardW = Math.min(screenWidth * 0.88, 380), cardH = 82, startY = 95;
  SKINS.forEach((skin, idx) => {
    const cardY = startY + idx * 98, cardX = midX - cardW / 2;
    const un = unlockedSkinIds.includes(skin.id), sel = selectedSkinId === skin.id;
    const col = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;
    ctx.save();
    ctx.fillStyle = sel ? '#12233f' : '#0a0d1e';
    ctx.strokeStyle = sel ? col : (un ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.12)');
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = un ? '#fff' : '#777';
    ctx.fillText(skin.name, cardX + 24, cardY + 28);
    ctx.font = '11.5px sans-serif'; ctx.fillStyle = un ? '#39ff14' : '#ff6688';
    ctx.fillText(un ? 'UNLOCKED' : `🔒 ${skin.reqDesc}`, cardX + 24, cardY + 54);
    ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = sel ? col : (un ? '#8e9bbb' : '#555');
    ctx.fillText(sel ? 'SELECTED ★' : (un ? 'EQUIP ▶' : '🔒'), cardX + cardW - 16, cardY + cardH / 2);
    ctx.restore();
  });
}

function drawUpgrades() {
  ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
  const midX = screenWidth / 2, cardW = Math.min(screenWidth * 0.90, 390), cardH = 64;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, UPG_HEADER, screenWidth, screenHeight - UPG_HEADER); ctx.clip();
  UPGRADE_KEYS.forEach((key, idx) => {
    const def = UPGRADE_DEFS[key], cardY = UPG_START + idx * UPG_STEP + upgScroll, cardX = midX - cardW / 2;
    if (cardY + cardH < UPG_HEADER || cardY > screenHeight) return;
    const cur = upgrades[key] || 0, isMax = cur >= def.max, cost = isMax ? 0 : def.costs[cur], can = !isMax && totalCoins >= cost;
    ctx.save();
    ctx.fillStyle = '#0a0e20';
    ctx.strokeStyle = can ? 'rgba(255,230,0,0.45)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, cardX + 30, cardY + cardH / 2);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
    ctx.fillText(def.name, cardX + 58, cardY + 16);
    ctx.fillStyle = '#8e9bbb'; ctx.font = '10px sans-serif';
    ctx.fillText(def.desc, cardX + 58, cardY + 34);
    ctx.fillStyle = '#39ff14'; ctx.font = 'bold 10.5px sans-serif';
    ctx.fillText(`Lv ${cur}/${def.max}`, cardX + 58, cardY + 50);
    drawBtn(cardX + cardW - 58, cardY + cardH / 2, 92, 36, isMax ? '#778899' : (can ? '#39ff14' : '#ff7799'), isMax ? '#1a1f2e' : (can ? '#1f2b09' : '#22141a'), isMax ? 'MAXED' : `🪙 ${cost}`, 12);
    ctx.restore();
  });
  ctx.restore();
  ctx.fillStyle = 'rgba(4, 6, 20, 0.98)'; ctx.fillRect(0, 0, screenWidth, UPG_HEADER);
  drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '900 22px sans-serif'; ctx.fillStyle = '#ffe600';
  ctx.fillText('PERFORMANCE SHOP', midX + 20, 36);
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffd700';
  ctx.fillText('BALANCE: 🪙 ' + totalCoins, midX + 20, 56);
  if (clampUpgScroll(-99999) < 0) {
    ctx.font = '10px sans-serif'; ctx.fillStyle = '#667';
    ctx.fillText(upgScroll > clampUpgScroll(-99999) + 2 ? '▼ scroll for more' : '▲ scroll up', midX + 20, 74);
  }
}

function drawPause() {
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
  const midX = screenWidth / 2, midY = screenHeight / 2;
  ctx.textAlign = 'center'; ctx.font = '900 46px sans-serif'; ctx.fillStyle = '#00ffff'; ctx.fillText('PAUSED', midX, midY - 90);
  drawBtn(midX, midY - 15, 200, 46, '#00ffff', '#051829', '▶ RESUME', 18);
  drawBtn(midX, midY + 47, 200, 46, '#ff66c4', '#2a0a20', '🔄 RESTART', 18);
  drawBtn(midX, midY + 109, 200, 46, '#ff4d6d', '#220810', '🏠 QUIT', 18);
  ctx.restore();
}

function drawGameOver() {
  ctx.save(); ctx.fillStyle = 'rgba(10,2,12,0.84)'; ctx.fillRect(-20, -20, screenWidth + 40, screenHeight + 40);
  const midX = screenWidth / 2, midY = screenHeight / 2, timeUp = gameOverReason === 'time', md = getMode(), gdf = getDifficulty();
  ctx.textAlign = 'center'; ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = md.color;
  ctx.fillText(`${md.icon} ${md.name} MODE`, midX, midY - 152);
  ctx.font = 'bold 10.5px sans-serif'; ctx.fillStyle = gdf.color;
  ctx.fillText(`${gdf.icon} ${gdf.name} • ${gdf.lanes} LANES${gdf.scoreMult > 1 ? ' • x' + gdf.scoreMult : ''}`, midX, midY - 136);
  ctx.font = '900 48px sans-serif'; ctx.fillStyle = timeUp ? '#39ff14' : '#ff0055';
  ctx.fillText(timeUp ? "TIME'S UP!" : 'CRASHED!', midX, midY - 105);
  const cw = Math.min(screenWidth * 0.82, 310), cy = midY - 65;
  ctx.fillStyle = 'rgba(14,18,36,0.9)';
  ctx.strokeStyle = timeUp ? 'rgba(57,255,20,0.4)' : 'rgba(255,0,127,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(midX - cw / 2, cy, cw, 126, 16); ctx.fill(); ctx.stroke();
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#8e9bbb'; ctx.fillText('FINAL SCORE', midX, cy + 20);
  ctx.font = '900 32px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(score.toString(), midX, cy + 52);
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffd700';
  ctx.fillText(`BEST SCORE: ${lifetimeStats.bestScore || bestScore}`, midX, cy + 78);
  ctx.fillStyle = '#ffe600';
  ctx.fillText(`RUN COINS: +${coinsCollected} • TOTAL: 🪙 ${totalCoins}`, midX, cy + 96);
  ctx.fillStyle = '#ffb347';
  ctx.fillText(`🏆 MILESTONES: ${milestonesReached}`, midX, cy + 114);
  // Note: gameOverHook is rendered via DOM element (#gameOverHook)
  const rdy = performance.now() - gameOverTimestamp >= 400;
  drawBtn(midX, midY + 116, 190, 48, rdy ? '#ff007f' : '#666', rdy ? '#2a0a20' : '#1a1a24', 'RETRY', 19);
  drawBtn(midX, midY + 174, 190, 48, rdy ? '#00ffff' : '#666', rdy ? '#051829' : '#1a1a24', '🏠 MAIN MENU', 18);
  ctx.restore();
}

function drawToast() {
  if (toastTimer <= 0 || currentState === STATE_PLAYING) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, toastTimer * 1.5); ctx.font = '900 14px sans-serif';
  const tw = ctx.measureText(toastText).width + 36, x = screenWidth / 2, y = screenHeight - 50;
  ctx.shadowColor = toastColor; ctx.shadowBlur = 14;
  ctx.fillStyle = 'rgba(8,12,28,0.95)'; ctx.strokeStyle = toastColor; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - tw / 2, y - 18, tw, 36, 18); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = toastColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(toastText, x, y);
  ctx.restore();
}

// LOOP
let lastTime = performance.now();
function gameLoop(now) {
  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const dt = rawDt * (game.slowMo || 1.0);
  if (currentState !== STATE_PAUSED) update(dt);
  ctx.save(); ctx.scale(dpr, dpr);
  ctx.translate(shakeX, shakeY);
  drawBackground(); drawRoad(); drawSpeedLines();
  coins.forEach(c => {
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(0, 0, c.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  powerups.forEach(p => {
    ctx.save(); ctx.translate(p.x, p.y);
    const col = p.type === 'rapid' ? '#ffe600' : (p.type === 'health' ? '#39ff14' : '#00ffff');
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.fillStyle = '#091522'; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  playerBullets.forEach(b => { ctx.fillStyle = b.color || '#00ffff'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
  enemyBullets.forEach(b => { ctx.fillStyle = b.color || '#ff0033'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
  drawBoss(); drawPlayerCar(); drawTraffic();
  particles.forEach(p => {
    ctx.save(); ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  drawWeatherOverlay();
  if (currentState === STATE_PLAYING) { drawHUD(); if (tutorialActive) drawTutorial(); }
  else if (currentState === STATE_PAUSED) { drawHUD(); drawPause(); }
  else if (currentState === STATE_MENU) { drawMenu(); if (rewardPopup) drawRewardPopup(); }
  else if (currentState === STATE_GARAGE) drawGarage();
  else if (currentState === STATE_UPGRADES) drawUpgrades();
  else if (currentState === STATE_ACHIEVEMENTS) drawAchievements();
  else if (currentState === STATE_SETTINGS) drawSettings();
  else if (currentState === STATE_MODE) drawModeSelect();
  else if (currentState === STATE_DIFFICULTY) drawDifficultySelect();
  else if (currentState === STATE_GAMEOVER) drawGameOver();
  drawToast();
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

resize();
requestAnimationFrame(t => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
