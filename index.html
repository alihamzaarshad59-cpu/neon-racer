  } else {
    gameOverHookMain = '🎯 Your best: ' + prevBest + '. You can do better!';
  }
  gameOverHookSub = '';
  if (comboKills >= 8 && comboKills <= 9) {
    gameOverHookSub = '🎯 ' + (10 - comboKills) + ' more kills for x2 COMBO!';
  } else if (comboKills >= 5 && comboKills <= 7) {
    gameOverHookSub = '🎯 Just ' + (10 - comboKills) + ' more kills for x2 COMBO!';
  } else if (comboKills >= 18 && comboKills <= 19) {
    gameOverHookSub = '🎯 ' + (20 - comboKills) + ' more kills for x3 COMBO!';
  } else if (boss && boss.hp > 0 && boss.hp < 30) {
    gameOverHookSub = '👹 Boss had only ' + boss.hp + ' HP left!';
  }

  checkSkinUnlocks();
  saveStats();
  try { localStorage.setItem('neon_racer_best', bestScore.toString()); } catch (e) {}
  checkSkinUnlocks();
  checkAchievements();
  checkSkinUnlocks();

  const hookEl = document.getElementById('gameOverHook');
  if (hookEl) {
    let hookHtml = '<div>' + gameOverHookMain + '</div>';
    if (gameOverHookSub) {
      hookHtml += '<div style="font-size: 11.5px; margin-top: 3px; color: #ffe600; opacity: 0.95;">' + gameOverHookSub + '</div>';
    }
    hookEl.innerHTML = hookHtml;
    hookEl.style.display = 'block';
  }

  for (let i = 0; i < 45; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 260 + 40;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: 4, color: timeUp ? (Math.random() > 0.4 ? '#39ff14' : '#00ffff') : (Math.random() > 0.4 ? '#ff0055' : '#00ffff'), alpha: 1, decay: 1.8 });
  }
}

function laneIndexOf(x) { return Math.floor((x - roadX) / laneWidth); }

function spawnTrafficCar() {
  if (boss !== null) return;
  const occupied = [];
  trafficCars.forEach(c => { if (c.y < 240) { const idx = laneIndexOf(c.x); if (idx >= 0 && idx < laneCount && !occupied.includes(idx)) occupied.push(idx); } });
  const maxOccupied = laneCount >= 5 ? 3 : 2;
  if (occupied.length >= maxOccupied) return;
  const itemLanes = [];
  coins.concat(powerups).forEach(it => { if (it.y < 110) { const idx = laneIndexOf(it.x); if (!itemLanes.includes(idx)) itemLanes.push(idx); } });
  const avail = [];
  for (let l = 0; l < laneCount; l++) { if (!occupied.includes(l) && !itemLanes.includes(l)) avail.push(l); }
  if (!avail.length) return;
  const lane = avail[Math.floor(Math.random() * avail.length)];
  const cfg = getLaneCfg();
  const ws = WEATHER_DEFS[currentWeather].enemySlow || 1.0;
  const elim = gameMode === 'elimination';
  const isE = Math.random() < (elim ? 0.6 : 0.38);
  trafficCars.push({
    x: roadX + lane * laneWidth + laneWidth / 2, y: -100, width: player.width * 0.88, height: player.height * 0.88,
    speed: currentSpeed * (0.35 + Math.random() * 0.35) * ws * cfg.trafficMult, isEnemy: isE, hp: 1, shootCooldown: elim ? 0.4 + Math.random() * 0.5 : 1.0 + Math.random(),
    colorPalette: isE ? { body: '#ff0033', glow: '#ff0033', light: '#ff4d6d' } : TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)]
  });
}

function pickFreeLane(spawnY) {
  const free = [];
  for (let l = 0; l < laneCount; l++) {
    const lx = roadX + l * laneWidth + laneWidth / 2;
    let blocked = false;
    for (let i = 0; i < trafficCars.length && !blocked; i++) {
      const c = trafficCars[i];
      if (Math.abs(c.x - lx) < laneWidth * 0.5 && c.y > spawnY - 90 && c.y < screenHeight + 60) blocked = true;
    }
    if (!blocked) {
      const others = coins.concat(powerups);
      for (let i = 0; i < others.length && !blocked; i++) {
        const o = others[i];
        if (Math.abs(o.x - lx) < laneWidth * 0.5 && Math.abs(o.y - spawnY) < 70) blocked = true;
      }
    }
    if (!blocked) free.push(l);
  }
  return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
}

function applyPowerup(type) {
  dailyBump('powerups', 1);
  if (type === 'health') dailyBump('healers', 1);
  if (type === 'shield') {
    shieldTimer = 8.0 + (upgrades.shield || 0) * 2;
    floatingTexts.push({ text: 'SHIELD ACTIVE (' + shieldTimer.toFixed(0) + 's)!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00e5ff' });
  } else if (type === 'rapid') {
    rapidFireTimer = 7.0;
    floatingTexts.push({ text: 'RAPID FIRE!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#ffe600' });
  } else if (type === 'health') {
    playerHP = Math.min(playerHP + 1, getRunMaxHP());
    floatingTexts.push({ text: '+1 HEALTH!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#39ff14' });
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; if ((p.alpha -= p.decay * dt) <= 0) particles.splice(i, 1); }
  for (let i = floatingTexts.length - 1; i >= 0; i--) { const ft = floatingTexts[i]; ft.y -= ft.vy * dt; if ((ft.alpha -= ft.decay * dt) <= 0) floatingTexts.splice(i, 1); }
}

// UPDATE
function update(dt) {
  if (currentState === STATE_PAUSED) return;
  updateScreenShake();
  if (tutorialActive) return;
  if (toastTimer > 0) toastTimer -= dt;
  if (milestonePopup.active) {
    milestonePopup.timer -= dt;
    if (milestonePopup.timer <= 0) { milestonePopup.timer = 0; milestonePopup.active = false; }
  }
  if (dailyAchDirty) {
    dailyAchSaveTimer -= dt;
    if (dailyAchSaveTimer <= 0) { saveDailyAch(); dailyAchSaveTimer = 1.5; }
  }
  if (coinsDirty) {
    coinsSaveTimer -= dt;
    if (coinsSaveTimer <= 0) { flushCoins(); coinsSaveTimer = 2.0; }
  }

  let slowMotionFactor = 1.0;

  if (nearMissCooldown > 0) nearMissCooldown -= dt * slowMotionFactor;
  gameTime += dt * slowMotionFactor;
  stars.forEach(s => { s.y += (s.speed + (currentState === STATE_PLAYING ? (currentSpeed - 420) * 0.1 : 0)) * dt * slowMotionFactor; if (s.y > screenHeight) { s.y = 0; s.x = Math.random() * screenWidth; } });

  if (currentState !== STATE_PLAYING) {
    player.x = roadX + roadW / 2 + Math.sin(gameTime * 1.5) * 12;
    player.tilt = Math.sin(gameTime * 1.5) * 0.05;
    roadScrollOffset = (roadScrollOffset + 180 * dt) % 60;
    updateRoadDecor(dt, 180);
    dailyAchCheckTimer -= dt;
    if (dailyAchCheckTimer <= 0) { dailyAchCheckTimer = 5; initDailyAchievements(); }
    return;
  }

  updateWeather(dt, slowMotionFactor);
  markWeather();
  updateMusic(dt * slowMotionFactor);
  updateEngineSound();
  if (playerFrozenTimer > 0) playerFrozenTimer = Math.max(0, playerFrozenTimer - dt * slowMotionFactor);

  if (playerHP < runPrevHP) runHitTaken = true;
  runPrevHP = playerHP;
  if (!runHitTaken) runNoHitTime += dt * slowMotionFactor;

  if (nitroTimer > 0) { nitroTimer -= dt * slowMotionFactor; if (nitroTimer <= 0) { nitroTimer = 0; nitroCooldown = 5; } }
  else if (nitroCooldown > 0) nitroCooldown = Math.max(0, nitroCooldown - dt * slowMotionFactor);

  if (killStreakTimer > 0) {
    killStreakTimer -= dt * slowMotionFactor;
    if (killStreakTimer <= 0) { killStreakTimer = 0; killStreakCount = 0; }
  }

  checkBossSpawn(); updateBoss(dt, slowMotionFactor);
  if (currentState !== STATE_PLAYING) return;
  skinCheckTimer -= dt;
  if (skinCheckTimer <= 0) { checkSkinUnlocks(); skinCheckTimer = 1.5; }
  updateMissionProgress();
  checkDailyProgress(missionEnemiesKilled, gameTime, score, coinsCollected, false);
  achCheckTimer -= dt;
  if (achCheckTimer <= 0) { achCheckTimer = 0.25; checkAchievements(); }

  if (screenDamageFlash > 0) screenDamageFlash = Math.max(0, screenDamageFlash - dt * 2.2);
  if (rapidFireTimer > 0) rapidFireTimer = Math.max(0, rapidFireTimer - dt * slowMotionFactor);
  if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - dt * slowMotionFactor);

  playerShootTimer += dt * slowMotionFactor;
  const fireInterval = (rapidFireTimer > 0 ? 0.14 : 0.3) * (1 - (upgrades.fireRate || 0) * 0.05);
  if (playerShootTimer >= fireInterval) {
    playerShootTimer = 0;
    if (gameMode !== 'drift') {
      const sk = getSelectedSkin(), bCol = sk.glow === 'rainbow' ? getRainbowColor() : sk.glow;
      playerBullets.push({ x: player.x - 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
      playerBullets.push({ x: player.x + 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
      soundPlayerShoot();
    }
  }

  const freezeFactor = playerFrozenTimer > 0 ? 0.5 : 1.0;
  let moveDir = 0;
  // ---- GYRO (TILT) STEERING - continuous input from device orientation ----
  if (gyroEnabled && gyroBaseGamma !== null) {
    const tilt = gyroCurrentGamma - gyroBaseGamma;
    const mag = Math.abs(tilt);
    if (mag > GYRO_DEADZONE_DEG) {
      moveDir = Math.sign(tilt) * Math.min(1, (mag - GYRO_DEADZONE_DEG) / GYRO_MAX_TILT_DEG);
    }
  }
  // ---- Touch / keyboard override (binary) ----
  if (isSteeringLeft()) moveDir = -1;
  if (isSteeringRight()) moveDir = 1;
  
  driftActive = Math.abs(moveDir) > 0.15;
  if (driftActive) { driftStreak += dt * slowMotionFactor; driftCombo = driftStreak >= 3; driftScore += (driftCombo ? 10 : 5) * dt * slowMotionFactor; }
  else { driftStreak = 0; driftCombo = false; }

  const laneCfg = getLaneCfg();
  const dynamicSpeedCap = (950 * laneCfg.speedMult) + Math.floor(distanceTraveled / 10000) * 50;
  let spd = Math.min((420 * getSpeedMult() * laneCfg.speedMult + distanceTraveled * 0.028) * (1.0 + (WEATHER_DEFS[currentWeather].speedBoost || 0)) * freezeFactor, dynamicSpeedCap);
  if (nitroTimer > 0) spd *= 1.5;
  currentSpeed = spd;
  const roadTravel = currentSpeed * dt * slowMotionFactor;
  distanceTraveled += roadTravel;
  const dMult = laneCfg.scoreMult;
  if (gameMode === 'drift') score = Math.floor((Math.floor(driftScore) + coinsCollected * 5) * dMult);
  else {
    const baseScore = Math.floor((distanceTraveled / 30) * getWeatherScoreMultiplier()) + coinsCollected * 5;
    score = Math.floor((baseScore + bonusScore) * (gameMode === 'elimination' ? 2 : 1) * dMult);
  }
  if (score > bestScore) bestScore = score;
  roadScrollOffset = (roadScrollOffset + roadTravel) % 60;

  updateRoadDecor(dt * slowMotionFactor, currentSpeed * 0.8);

  trackRunStats();
  checkMilestones();

  if (gameMode === 'timetrial' && gameTime >= TIME_TRIAL_DURATION) {
    score += 250; gameOverReason = 'time';
    floatingTexts.push({ text: "TIME'S UP! +250", x: screenWidth / 2, y: screenHeight * 0.4, vy: 40, alpha: 1, decay: 1.5, color: '#39ff14' });
    triggerGameOver(); return;
  }

  player.vx = moveDir * getSteerSpeed() * freezeFactor;
  player.x += player.vx * dt * slowMotionFactor;
  player.tilt += (moveDir * 0.14 - player.tilt) * Math.min(dt * 15, 1);
  const minX = roadX + player.width / 2 + 6, maxX = roadX + roadW - player.width / 2 - 6;
  if (player.x < minX) { player.x = minX; player.vx = 0; } else if (player.x > maxX) { player.x = maxX; player.vx = 0; }

  const curSkin = getSelectedSkin();
  const trCol = curSkin.trail === 'rainbow' ? getRainbowColor(180)
    : (curSkin.trail === 'cosmic' ? (Math.random() < 0.4 ? '#ffffff' : getRainbowColor(Math.random() * 360)) : curSkin.trail);
  [-8, 8].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 - 2, vx: (Math.random() - 0.5) * 20, vy: 140, size: 3, color: trCol, alpha: 0.75, decay: 3.5 }));
  if (curSkin.special && Math.random() < 0.6) {
    const sa = Math.random() * Math.PI * 2, sr = 18 + Math.random() * 26;
    particles.push({ x: player.x + Math.cos(sa) * sr * 0.6, y: player.y + Math.sin(sa) * sr, vx: (Math.random() - 0.5) * 40, vy: 30 + Math.random() * 60, size: 1.5 + Math.random() * 1.8, color: Math.random() < 0.5 ? '#ffffff' : getRainbowColor(Math.random() * 360), alpha: 1, decay: 2.4 });
  }
  if (nitroTimer > 0) {
    [-9, 0, 9].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 + 4, vx: (Math.random() - 0.5) * 40, vy: 280 + Math.random() * 120, size: 3 + Math.random() * 3, color: Math.random() > 0.5 ? '#00ffff' : '#80f2ff', alpha: 0.9, decay: 3.2 }));
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) { const b = playerBullets[i]; b.y += b.vy * dt * slowMotionFactor; if (b.y < -30) playerBullets.splice(i, 1); }

  // ENEMY BULLETS + NEAR MISS DETECTION
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.homing) {
      const dx = player.x - b.x;
      b.vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2.2, 160);
      particles.push({ x: b.x, y: b.y - 6, vx: (Math.random() - 0.5) * 30, vy: -50, size: 2.5, color: '#b026ff', alpha: 0.8, decay: 4 });
    }
    b.y += (b.vy || 500) * dt * slowMotionFactor; if (b.vx) b.x += b.vx * dt * slowMotionFactor;

    if (gameMode !== 'drift' && !b.nearMissAwarded) {
      const bdx = Math.abs(b.x - player.x);
      const bdy = Math.abs(b.y - player.y);
      if (bdx > 18 && bdx < 65 && bdy < 60) {
        if (nearMissCooldown <= 0) {
          b.nearMissAwarded = true;
          nearMissCooldown = 0.3;
          bonusScore += 5;
          dailyBump('nearMiss', 1);
          playTone(600, 'sine', 0.08, 0.06, 0.001, 900);
          game.nearMissPopups.push({ text: '⚡ NEAR MISS +5', x: player.x, y: player.y - 35, vy: 40, alpha: 1, decay: 1.0, color: '#00ffff' });
        }
      }
    }

    if (Math.abs(b.x - player.x) <= player.width * 0.42 && Math.abs(b.y - player.y) <= player.height * 0.44) {
      const isIce = b.type === 'ice', isMissile = b.type === 'missile';
      enemyBullets.splice(i, 1); comboKills = 0; lastComboTier = 1;
      if (shieldTimer > 0) {
        shieldTimer = 0; soundPowerup();
        floatingTexts.push({ text: 'SHIELD ABSORBED!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
      } else {
        playerHP -= 1;
        screenDamageFlash = 0.45;
        screenDamageFlashColor = isIce ? 'rgba(0, 229, 255, 0.45)' : (isMissile ? 'rgba(176, 38, 255, 0.5)' : 'rgba(255, 0, 50, 0.45)');
        triggerScreenShake(8, 0.3);
        if (isIce) { playerFrozenTimer = 1.0; soundFreeze(); floatingTexts.push({ text: '❄️ FROZEN! 50% SPEED', x: player.x, y: player.y - 45, vy: 40, alpha: 1, decay: 1.8, color: '#00e5ff' }); }
        else soundPlayerHit();
        for (let p = 0; p < 15; p++) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180, size: 3, color: isIce ? '#00e5ff' : (isMissile ? '#b026ff' : '#ff0055'), alpha: 1, decay: 2.5 });
        if (playerHP <= 0) {
          triggerGameOver();
          return;
        }
      }
      continue;
    }
    if (b.y > screenHeight + 40 || b.x < -30 || b.x > screenWidth + 30) enemyBullets.splice(i, 1);
  }

  // UPDATE NEAR MISS POPUPS
  for (let i = game.nearMissPopups.length - 1; i >= 0; i--) {
    const p = game.nearMissPopups[i];
    p.y -= p.vy * dt * slowMotionFactor;
    p.alpha -= p.decay * dt * slowMotionFactor;
    if (p.alpha <= 0) game.nearMissPopups.splice(i, 1);
  }

  if (boss === null) {
    const minSpawnRate = Math.max(0.30, 0.45 - Math.floor(distanceTraveled / 20000) * 0.05);
    if ((nextCarSpawnTimer -= dt * slowMotionFactor) <= 0) { spawnTrafficCar(); nextCarSpawnTimer = (Math.max(1.0 - (currentSpeed - 420) * 0.0012, minSpawnRate) + Math.random() * 0.4) * (gameMode === 'elimination' ? 0.7 : 1) * (1 / laneCfg.spawnRateMult); }
    if ((nextCoinSpawnTimer -= dt * slowMotionFactor) <= 0) {
      const cl = pickFreeLane(-40);
      if (cl < 0) { nextCoinSpawnTimer = 0.25; }
      else { coins.push({ x: roadX + cl * laneWidth + laneWidth / 2, y: -40, radius: 9, pulseOffset: Math.random() * 6 }); nextCoinSpawnTimer = 1.4 + Math.random() * 1.8; }
    }
    if ((nextPowerupSpawnTimer -= dt * slowMotionFactor) <= 0) {
      const pl = pickFreeLane(-50);
      if (pl < 0) { nextPowerupSpawnTimer = 0.25; }
      else {
        const ptypes = gameMode === 'elimination' ? ['shield', 'rapid'] : ['shield', 'rapid', 'health'];
        powerups.push({ type: ptypes[Math.floor(Math.random() * ptypes.length)], x: roadX + pl * laneWidth + laneWidth / 2, y: -50, radius: 12, pulseOffset: Math.random() * 6 });
        nextPowerupSpawnTimer = 10.0 + Math.random() * 6;
      }
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i]; p.y += currentSpeed * dt * slowMotionFactor;
    if (Math.hypot(player.x - p.x, player.y - p.y) < player.width / 2 + p.radius) { applyPowerup(p.type); soundPowerup(); powerups.splice(i, 1); continue; }
    if (p.y > screenHeight + 60) powerups.splice(i, 1);
  }

  for (let i = trafficCars.length - 1; i >= 0; i--) {
    const car = trafficCars[i]; car.y += (currentSpeed - car.speed) * dt * slowMotionFactor;
    if (car.isEnemy && (car.shootCooldown -= dt * slowMotionFactor) <= 0 && car.y > 20 && car.y < screenHeight - 120) {
      const elim = gameMode === 'elimination';
      car.shootCooldown = elim ? 0.75 : 1.5;
      enemyBullets.push({ x: car.x, y: car.y + car.height / 2 + 6, vy: elim ? 620 : 500, width: 5, height: 14 });
      soundEnemyShoot();
    }
    let destroyed = false;
    for (let j = playerBullets.length - 1; j >= 0; j--) {
      const b = playerBullets[j];
      if (Math.abs(b.x - car.x) <= car.width / 2 && Math.abs(b.y - car.y) <= car.height / 2) {
        playerBullets.splice(j, 1);
        if ((car.hp -= 1) <= 0) {
          destroyed = true; comboKills += 1; const mult = getComboMultiplier(); checkComboTierUp();
          registerKillStreak();
          const pts = Math.round(10 * mult * laneCfg.scoreMult); bonusScore += pts; distanceTraveled += 300; missionEnemiesKilled += 1; lifetimeStats.totalEnemies += 1;
          dailyBump('enemies', 1);
          soundEnemyExplosion();
          floatingTexts.push({ text: '+' + pts + (mult > 1 ? (' x' + mult) : ''), x: car.x, y: car.y, vy: 55, alpha: 1, decay: 1.8, color: getComboColor(mult) });
          for (let p = 0; p < 20; p++) particles.push({ x: car.x, y: car.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, size: 3.5, color: car.colorPalette.glow, alpha: 1, decay: 1.8 });
          break;
        }
      }
    }
    if (destroyed) { trafficCars.splice(i, 1); continue; }
    if (Math.abs(player.x - car.x) < player.width * 0.7 && Math.abs(player.y - car.y) < player.height * 0.75) {
      comboKills = 0; lastComboTier = 1;
      if (shieldTimer > 0) {
        shieldTimer = 0; trafficCars.splice(i, 1); soundEnemyExplosion();
        floatingTexts.push({ text: 'SHIELD RAM!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
      } else {
        trafficCars.splice(i, 1);
        triggerScreenShake(8, 0.3);
        triggerGameOver(); // Instant Out
        return;
      }
    }
    if (car.y > screenHeight + 120) trafficCars.splice(i, 1);
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i]; c.y += currentSpeed * dt * slowMotionFactor;
    if (Math.hypot(player.x - c.x, player.y - c.y) < player.width / 2 + c.radius) {
      const coinPts = diffScore(5);
      coinsCollected += 1; totalCoins += 1; saveCoins(); missionCoinsGathered += 1; lifetimeStats.totalCoins += 1;
      dailyBump('coins', 1);
      soundCoin();
      floatingTexts.push({ text: '+' + coinPts + ' (🪙+1)', x: c.x, y: c.y, vy: 60, alpha: 1, decay: 2, color: '#ffd700' });
      for (let p = 0; p < 8; p++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120, size: 2.5, color: '#ffd700', alpha: 1, decay: 2 });
      coins.splice(i, 1); continue;
    }
    if (c.y > screenHeight + 40) coins.splice(i, 1);
  }

  updateEffects(dt * slowMotionFactor);
}

// DRAWING
function drawBtn(x, y, w, h, col, bg, txt, sz) {
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.fillStyle = bg; ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = sz || 14;
  do { ctx.font = 'bold ' + fs + 'px sans-serif'; fs -= 0.5; } while (ctx.measureText(txt).width > w - 18 && fs > 8);
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function drawWrapped(text, cx, y, maxW, lh) {
  const words = text.split(' '), lines = [];
  let line = '';
  words.forEach(w => {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  });
  if (line) lines.push(line);
  lines.forEach((ln, i) => ctx.fillText(ln, cx, y + i * lh));
  return lines.length;
}

function drawSectionHead(text, y, x, w, rightText, rightCol) {
  ctx.save();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = '900 13px sans-serif'; ctx.fillStyle = '#ffd700';
  ctx.fillText(text, x + 4, y);
  if (rightText) {
    ctx.textAlign = 'right'; ctx.font = 'bold 10.5px sans-serif'; ctx.fillStyle = rightCol || '#39ff14';
    ctx.fillText(rightText, x + w - 4, y);
  }
  ctx.restore();
}

function drawScreenHeader(title, subtitle, accent) {
  ctx.save();
  ctx.fillStyle = 'rgba(4, 6, 20, 0.98)';
  ctx.fillRect(0, 0, screenWidth, UPG_HEADER);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = accent; ctx.shadowBlur = 16; ctx.fillStyle = accent;
  fitFont(title, screenWidth - 32, 21, '900');
  ctx.fillText(title, screenWidth / 2, 28);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#8e9bbb';
  fitFont(subtitle, screenWidth - 32, 11, 'bold');
  ctx.fillText(subtitle, screenWidth / 2, 52);
  drawBtn(screenWidth / 2, 86, 112, 30, '#00ffff', '#0a1d30', '◀ BACK', 13);
  ctx.restore();
}

function drawTabs(tabs, activeId, accent) {
  const rects = tabRects(tabs.length);
  ctx.save();
  for (let i = 0; i < tabs.length; i++) {
    const t = tabs[i], r = rects[i], sel = (t.id === activeId);
    ctx.save();
    if (sel) { ctx.shadowColor = accent; ctx.shadowBlur = 14; }
    ctx.fillStyle = sel ? 'rgba(18, 35, 63, 0.96)' : 'rgba(10, 13, 30, 0.9)';
    ctx.strokeStyle = sel ? accent : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = sel ? 2.2 : 1.4;
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = sel ? accent : '#8e9bbb';
    let fs = 13;
    do { ctx.font = 'bold ' + fs + 'px sans-serif'; fs -= 0.5; } while (ctx.measureText(t.label).width > r.w - 12 && fs > 7.5);
    ctx.fillText(t.label, r.x + r.w / 2, r.y + r.h / 2);
    if (sel) {
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.roundRect(r.x + 10, r.y + r.h - 5, r.w - 20, 3, 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawScrollHint(s) {
  const bottom = scrollBottom(s);
  if (screenHeight >= bottom + 12) return;
  const cur = getScroll(s);
  const minS = clampScroll(s, -99999);
  if (minS >= 0) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = 'rgba(160,175,200,0.65)';
  ctx.fillText(cur > minS + 2 ? '▼ scroll for more' : '▲ scroll up', screenWidth / 2, screenHeight - 12);
  ctx.restore();
}

function drawBackground() {
  const rd = getRoad();
  const grad = ctx.createLinearGradient(0, 0, 0, screenHeight);
  grad.addColorStop(0, rd.bg[0]);
  grad.addColorStop(0.5, rd.bg[1]);
  grad.addColorStop(1, rd.bg[2]);
  ctx.fillStyle = grad; ctx.fillRect(-20, -20, screenWidth + 40, screenHeight + 40);
  stars.forEach(s => {
    ctx.fillStyle = 'rgba(' + rd.star + ', ' + (s.alpha * (0.7 + 0.3 * Math.sin(gameTime * s.pulseSpeed + s.pulseOffset))) + ')';
    ctx.fillRect(s.x, s.y, s.radius, s.radius);
  });
}

function drawRoad() {
  const rd = getRoad();
  ctx.save();
  ctx.fillStyle = rd.road; ctx.fillRect(roadX, -20, roadW, screenHeight + 40);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)'; ctx.lineWidth = 1;
  for (let y = roadScrollOffset - 60; y < screenHeight + 60; y += 40) { ctx.beginPath(); ctx.moveTo(roadX, y); ctx.lineTo(roadX + roadW, y); ctx.stroke(); }
  ctx.shadowColor = rd.left; ctx.shadowBlur = 18; ctx.strokeStyle = rd.left; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(roadX, -20); ctx.lineTo(roadX, screenHeight + 20); ctx.stroke();
  ctx.shadowColor = rd.right; ctx.shadowBlur = 18; ctx.strokeStyle = rd.right; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(roadX + roadW, -20); ctx.lineTo(roadX + roadW, screenHeight + 20); ctx.stroke();
  ctx.shadowColor = rd.laneGlow; ctx.shadowBlur = 8; ctx.strokeStyle = rd.lane;
  ctx.lineWidth = laneCount > 3 ? 1.8 : 2.5; ctx.setLineDash([32, 28]); ctx.lineDashOffset = -roadScrollOffset;
  for (let i = 1; i <= laneCount - 1; i++) { const lx = roadX + i * laneWidth; ctx.beginPath(); ctx.moveTo(lx, -60); ctx.lineTo(lx, screenHeight + 60); ctx.stroke(); }
  ctx.restore();
}

function drawSpeedLines() {
  if (nitroTimer <= 0 || (currentState !== STATE_PLAYING && currentState !== STATE_PAUSED)) return;
  ctx.save(); ctx.strokeStyle = 'rgba(0, 255, 255, 0.45)'; ctx.lineWidth = 2; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 8;
  for (let i = 0; i < 18; i++) {
    const x = roadX + 6 + ((i * 53) % Math.max(1, roadW - 12)), y = (gameTime * 1500 + i * 97) % (screenHeight + 140) - 70, len = 40 + (i % 4) * 22;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
  }
  ctx.restore();
}

function drawWeatherOverlay() {
  if (currentState !== STATE_PLAYING && currentState !== STATE_PAUSED) return;
  ctx.save();
  if (currentWeather === 'rain' || prevWeather === 'rain') {
    const a = (currentWeather === 'rain' ? weatherTransition : (1 - weatherTransition)) * 0.65;
    if (a > 0.01) { ctx.strokeStyle = 'rgba(120, 200, 255, ' + a + ')'; ctx.lineWidth = 1.5; rainDrops.forEach(r => { ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 4, r.y + r.l); ctx.stroke(); }); }
  }
  if (currentWeather === 'snow' || prevWeather === 'snow') {
    const a = (currentWeather === 'snow' ? weatherTransition : (1 - weatherTransition)) * 0.85;
    if (a > 0.01) { ctx.fillStyle = 'rgba(235, 248, 255, ' + a + ')'; snowFlakes.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }); }
  }
  if (currentWeather === 'fog' || prevWeather === 'fog') {
    const a = (currentWeather === 'fog' ? weatherTransition : (1 - weatherTransition)) * 0.3;
    if (a > 0.01) { ctx.fillStyle = 'rgba(170, 190, 210, ' + a + ')'; ctx.fillRect(-20, -20, screenWidth + 40, screenHeight + 40); }
  }
  if (currentWeather === 'night' || prevWeather === 'night') {
    const a = (currentWeather === 'night' ? weatherTransition : (1 - weatherTransition)) * 0.38;
    if (a > 0.01) { ctx.fillStyle = 'rgba(3, 4, 15, ' + a + ')'; ctx.fillRect(-20, -20, screenWidth + 40, screenHeight + 40); }
  }
  ctx.restore();
}

function drawPlayerCar() {
  ctx.save();
  ctx.translate(player.x, player.y); ctx.rotate(player.tilt);
  const hw = player.width / 2, hh = player.height / 2, skin = getSelectedSkin();
  const glow = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;

  if (nitroTimer > 0 && (currentState === STATE_PLAYING || currentState === STATE_PAUSED)) {
    const fl = 34 + Math.sin(gameTime * 70) * 10;
    ctx.save(); ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
    [-hw * 0.5, hw * 0.5].forEach(fx => {
      ctx.fillStyle = 'rgba(0, 229, 255, 0.85)';
      ctx.beginPath(); ctx.moveTo(fx - 7, hh - 2); ctx.lineTo(fx, hh + fl); ctx.lineTo(fx + 7, hh - 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath(); ctx.moveTo(fx - 3, hh - 2); ctx.lineTo(fx, hh + fl * 0.55); ctx.lineTo(fx + 3, hh - 2); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
  }
  if (shieldTimer > 0) {
    ctx.save(); ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 24; ctx.strokeStyle = 'rgba(0, 240, 255, 0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(hw, hh) + 12 + Math.sin(gameTime * 8) * 3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(0, 220, 255, 0.15)'; ctx.fill(); ctx.restore();
  }
  if (playerFrozenTimer > 0) {
    ctx.save(); ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18; ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(-hw - 4, -hh - 4, player.width + 8, player.height + 8, 10); ctx.stroke();
    ctx.fillStyle = 'rgba(0, 229, 255, 0.22)'; ctx.fill(); ctx.restore();
  }
  const isNight = currentWeather === 'night';
  const beam = ctx.createLinearGradient(0, -hh, 0, -hh - (isNight ? 220 : 160));
  beam.addColorStop(0, isNight ? 'rgba(0, 255, 255, 0.55)' : 'rgba(0, 255, 255, 0.35)');
  beam.addColorStop(1, 'rgba(0, 255, 255, 0)');
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(-hw + 6, -hh); ctx.lineTo(-hw - 22, -hh - 160); ctx.lineTo(-hw + 30, -hh - 160); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hw - 6, -hh); ctx.lineTo(hw - 30, -hh - 160); ctx.lineTo(hw + 22, -hh - 160); ctx.closePath(); ctx.fill();
  if (skin.special) {
    ctx.save();
    const auraCol = getRainbowColor(90);
    ctx.shadowColor = auraCol; ctx.shadowBlur = 40; ctx.strokeStyle = auraCol; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.45 + 0.25 * Math.sin(gameTime * 5);
    ctx.beginPath(); ctx.roundRect(-hw - 5, -hh - 5, player.width + 10, player.height + 10, 12); ctx.stroke();
    ctx.restore();
  }
  ctx.shadowColor = glow; ctx.shadowBlur = skin.special ? 38 : 24; ctx.fillStyle = glow;
  ctx.beginPath(); ctx.roundRect(-hw * 0.9, -hh * 0.9, player.width * 0.9, player.height * 0.9, 8); ctx.fill();
  const bg = ctx.createLinearGradient(0, -hh, 0, hh);
  bg.addColorStop(0, skin.bodyTop); bg.addColorStop(0.5, skin.bodyMid); bg.addColorStop(1, skin.bodyBot);
  ctx.fillStyle = bg; ctx.strokeStyle = glow; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(-hw, -hh, player.width, player.height, 8); ctx.fill(); ctx.stroke();
  if (skin.special) {
    ctx.save();
    ctx.beginPath(); ctx.roundRect(-hw, -hh, player.width, player.height, 8); ctx.clip();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 14; i++) {
      const sx = -hw + (((i * 53 + 17) % 100) / 100) * player.width;
      const sy = -hh + ((((i * 37 + 11) % 100) / 100) * player.height + gameTime * (10 + (i % 4) * 6)) % player.height;
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(gameTime * 3 + i));
      ctx.fillStyle = i % 3 === 0 ? getRainbowColor(i * 40) : '#ffffff';
      ctx.fillRect(sx, sy, 1.8, 1.8);
    }
    ctx.restore();
  }
  ctx.shadowBlur = 6; ctx.fillStyle = '#061324'; ctx.strokeStyle = skin.accent; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(-hw * 0.58, -hh * 0.42, player.width * 0.58, player.height * 0.38, 5); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawTraffic() {
  trafficCars.forEach(car => {
    ctx.save(); ctx.translate(car.x, car.y);
    const hw = car.width / 2, hh = car.height / 2;
    ctx.shadowColor = car.colorPalette.glow; ctx.shadowBlur = 18;
    ctx.fillStyle = '#0c101d'; ctx.strokeStyle = car.colorPalette.glow; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.roundRect(-hw, -hh, car.width, car.height, 8); ctx.fill(); ctx.stroke();
    if (car.isEnemy) { ctx.fillStyle = '#ff0033'; ctx.beginPath(); ctx.moveTo(0, -hh + 8); ctx.lineTo(-hw + 6, hh - 8); ctx.lineTo(hw - 6, hh - 8); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#05070f'; ctx.strokeStyle = car.colorPalette.light; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.roundRect(-hw * 0.6, -hh * 0.45, car.width * 0.6, car.height * 0.38, 4); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}

function drawBoss() {
  if (!boss) return;
  ctx.save();
  if (boss.telegraphTimer > 0) {
    ctx.strokeStyle = 'rgba(255, 230, 0, ' + (0.5 + 0.5 * Math.sin(gameTime * 24)) + ')'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(boss.telegraphX, 0); ctx.lineTo(boss.telegraphX, screenHeight); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 230, 0, 0.12)'; ctx.fillRect(boss.telegraphX - 22, 0, 44, screenHeight);
    ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#ffe600'; ctx.textAlign = 'center'; ctx.fillText('⚠️ LIGHTNING INCOMING', boss.telegraphX, screenHeight * 0.4);
  }
  if (boss.strikeActive > 0) {
    ctx.fillStyle = 'rgba(255, 255, 200, 0.45)'; ctx.fillRect(boss.telegraphX - 24, 0, 48, screenHeight);
    ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 24; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(boss.telegraphX, 0); ctx.lineTo(boss.telegraphX, screenHeight); ctx.stroke();
  }
  ctx.translate(boss.x, boss.y);
  const hbw = boss.width / 2, hbh = boss.height / 2;
  if (boss.isMega) {
    const auraPulse = Math.sin(gameTime * 6) * 10;
    const rainbowGlow = getRainbowColor();
    ctx.save();
    ctx.shadowColor = rainbowGlow;
    ctx.shadowBlur = 32;
    ctx.strokeStyle = rainbowGlow;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-hbw - 10 - auraPulse * 0.5, -hbh - 10 - auraPulse * 0.5, boss.width + 20 + auraPulse, boss.height + 20 + auraPulse, 22);
    ctx.stroke();
    ctx.fillStyle = 'rgba(176, 38, 255, 0.16)';
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowColor = boss.flashTimer > 0 ? '#ffffff' : (boss.isMega ? '#b026ff' : boss.color);
  ctx.shadowBlur = boss.isMega ? 30 : 22;
  ctx.fillStyle = boss.flashTimer > 0 ? '#ffffff' : (boss.isMega ? '#1a052e' : '#140510');
  ctx.strokeStyle = boss.flashTimer > 0 ? '#ffffff' : (boss.isMega ? getRainbowColor() : boss.color);
  ctx.lineWidth = boss.isMega ? 4 : 3;
  ctx.beginPath();
  ctx.roundRect(-hbw, -hbh, boss.width, boss.height, boss.isMega ? 18 : 14);
  ctx.fill();
  ctx.stroke();
  if (boss.isMega) {
    ctx.strokeStyle = '#b026ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-hbw * 0.75, -hbh * 0.78, boss.width * 0.75, boss.height * 0.78, 10);
    ctx.stroke();
  }
  ctx.font = boss.isMega ? '36px sans-serif' : '22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(boss.emblem, 0, 0);
  ctx.restore();
}

function drawNitroButton() {
  const nb = nitroBtn(), active = nitroTimer > 0, cd = nitroCooldown > 0;
  const col = active ? '#00ffff' : (cd ? '#667788' : '#00e5ff');
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = active ? 22 : 12;
  ctx.fillStyle = active ? 'rgba(0, 70, 90, 0.9)' : 'rgba(5, 24, 41, 0.85)';
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  if (active || cd) {
    const frac = active ? nitroTimer / nitroDuration : 1 - nitroCooldown / 5;
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(nb.x, nb.y, nb.r - 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (active) { ctx.fillStyle = '#ffffff'; ctx.font = '900 15px sans-serif'; ctx.fillText(nitroTimer.toFixed(1) + 's', nb.x, nb.y); }
  else if (cd) { ctx.fillStyle = '#8899aa'; ctx.font = '900 18px sans-serif'; ctx.fillText(Math.ceil(nitroCooldown).toString(), nb.x, nb.y); }
  else { ctx.font = '18px sans-serif'; ctx.fillText('🔥', nb.x, nb.y - 6); ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('NITRO', nb.x, nb.y + 14); }
  ctx.restore();
}

function drawMilestoneBar() {
  if (boss) return;
  if (currentState !== STATE_PLAYING && currentState !== STATE_PAUSED) return;
  const bw = Math.min(200, screenWidth * 0.52), bh = 6, bx = screenWidth / 2 - bw / 2, by = 64;
  const prevM = nextMilestone - 5000;
  const frac = Math.max(0, Math.min(1, (score - prevM) / 5000));
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 9.5px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 6;
  ctx.fillText('NEXT: ' + nextMilestone, screenWidth / 2, 58);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  if (frac > 0) {
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#b8860b'); g.addColorStop(0.5, '#ffd700'); g.addColorStop(1, '#fff3a0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(bx, by, Math.max(bh, bw * frac), bh, 3); ctx.fill();
  }
  ctx.restore();
}

function drawMilestonePopup() {
  if (!milestonePopup.active) return;
  const t = milestonePopup.timer, el = 2.5 - t, ut = performance.now() / 1000;
  const slide = Math.min(1, el / 0.3), ease = 1 - Math.pow(1 - slide, 3);
  const a = t < 0.5 ? Math.max(0, t / 0.5) : 1;
  const w = Math.min(240, screenWidth - 20), h = 100;
  const x = screenWidth / 2 - w / 2, y = screenHeight * 0.72 - h / 2 + (1 - ease) * 60;
  const rb = off => 'hsl(' + ((ut * 120 + (off || 0)) % 360) + ', 100%, 55%)';
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = rb(0); ctx.shadowBlur = 22;
  const bgG = ctx.createLinearGradient(0, y, 0, y + h);
  bgG.addColorStop(0, '#3b2f0a'); bgG.addColorStop(1, '#1a1505');
  ctx.fillStyle = bgG;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();
  const rg = ctx.createLinearGradient(x, y, x + w, y + h);
  rg.addColorStop(0, rb(0)); rg.addColorStop(0.33, rb(90));
  rg.addColorStop(0.66, rb(180)); rg.addColorStop(1, rb(270));
  ctx.strokeStyle = rg; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffd700';
  fitFont('🎉 MILESTONE!', w - 24, 22, 'bold');
  ctx.fillText('🎉 MILESTONE!', screenWidth / 2, y + 26);
  ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText('SCORE: ' + milestonePopup.score, screenWidth / 2, y + 54);
  const pulse = 18 + Math.sin(ut * 10) * 1.5;
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12; ctx.fillStyle = '#ffd700'; ctx.font = '900 ' + pulse.toFixed(1) + 'px sans-serif';
  ctx.fillText('+' + milestonePopup.reward + ' 🪙', screenWidth / 2, y + 80);
  ctx.restore();
}

    const mw = Math.min(screenWidth * 0.44, 180);

    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#39ff14';
    ctx.fillText(currentMission.label + ': ' + Math.min(missionProgress, currentMission.target) + '/' + currentMission.target, screenWidth / 2, 23);
  }
  const wInfo = WEATHER_DEFS[currentWeather];

function drawAchCard(x, y, w, name, desc, done, cur, target, accent, lockIcon, doneLabel) {
  const fmt = n => Math.floor(n).toLocaleString('en-US');
  ctx.save();
  ctx.fillStyle = done ? '#0d1a29' : '#0a0d16';
  ctx.strokeStyle = done ? '#39ff14' : 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1.4;
  if (done) { ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 8; }
  ctx.beginPath(); ctx.roundRect(x, y, w, ACH_CARD_H, 8); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff';
  ctx.fillText(done ? '✅' : lockIcon, x + 24, y + ACH_CARD_H / 2);
  const tx = x + 46, maxW = w - 46 - 78;
  ctx.textAlign = 'left';
  ctx.fillStyle = done ? '#ffffff' : '#8a8a8a';
  fitFont(name, maxW, 13, 'bold');
  ctx.fillText(name, tx, y + 14);
  ctx.fillStyle = done ? '#8e9bbb' : '#666666';
  fitFont(desc, maxW, 10.5, '');
  ctx.fillText(desc, tx, y + 28);
  ctx.textAlign = 'right';
  if (done) {
    ctx.fillStyle = '#39ff14'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(doneLabel, x + w - 12, y + ACH_CARD_H / 2);
  } else {
    ctx.fillStyle = '#aab3c8'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(fmt(Math.min(cur, target)) + '/' + fmt(target), x + w - 12, y + ACH_CARD_H / 2);
    const bx = tx, by = y + 38, bw = maxW, frac = Math.max(0, Math.min(1, cur / target));
    ctx.fillStyle = '#14182c';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, 5, 2.5); ctx.fill();
    if (frac > 0) {
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.roundRect(bx, by, Math.max(5, bw * frac), 5, 2.5); ctx.fill();
    }
  }
  ctx.restore();
}

      ctx.fillStyle = '#8e9bbb'; ctx.font = '9.5px sans-serif';
      drawWrapped(cfg.desc, r.x + r.w / 2, r.y + 62, r.w - 14, 12);
      ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText('x' + cfg.scoreMult.toFixed(1) + ' SCORE', r.x + r.w / 2, r.y + r.h - 10);
      if (sel) { ctx.fillStyle = cfg.color; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('★', r.x + r.w - 8, r.y + 14); }
      ctx.restore();
    });
  } else {
    ROADS.forEach((rd, i) => {
      const r = roadCardRect(i), sel = roadType === rd.id;
      if (r.y + r.h < CONTENT_TOP || r.y > screenHeight) return;
      ctx.save();
      if (sel) { ctx.shadowColor = rd.accent; ctx.shadowBlur = 16; }
      ctx.fillStyle = sel ? '#12233f' : '#0a0d1e';
      ctx.strokeStyle = sel ? rd.accent : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '22px sans-serif'; ctx.fillStyle = '#ffffff';
      ctx.fillText(rd.icon, r.x + r.w / 2, r.y + 20);
      ctx.fillStyle = sel ? rd.accent : '#ffffff'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText(rd.name.toUpperCase() + (sel ? ' ★' : ''), r.x + r.w / 2, r.y + 41);
      const sg = ctx.createLinearGradient(r.x + 14, 0, r.x + r.w - 14, 0);
      sg.addColorStop(0, rd.left); sg.addColorStop(1, rd.right);
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.roundRect(r.x + 14, r.y + r.h - 12, r.w - 28, 4, 2); ctx.fill();
      ctx.restore();
    });
  }
  ctx.restore();

  const md = getMode();
  drawScreenHeader('🎮 MODE & TRACK', md.icon + ' ' + capName(md.name) + ' • ' + laneChoice + 'L • ' + getRoad().name, md.color);
  drawTabs(MODE_TABS, modeTab, '#00ffff');
  drawScrollHint(STATE_MODE);
}

function drawGarage() {
  ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
  const midX = screenWidth / 2, G = garLayout();
  const skinW = Math.min(screenWidth * 0.88, 380), upgW = Math.min(screenWidth * 0.90, 390);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, CONTENT_TOP, screenWidth, screenHeight - CONTENT_TOP); ctx.clip();

  if (garTab === 'skins') {
    SKINS.forEach((skin, idx) => {
      const cardY = G.contentTop + idx * G.skinStep + garScroll, cardX = midX - skinW / 2, cardH = G.skinH;
      if (cardY + cardH < CONTENT_TOP || cardY > screenHeight) return;
      const un = unlockedSkinIds.includes(skin.id), sel = selectedSkinId === skin.id;
      const col = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;
      ctx.save();
      if (skin.special) { ctx.shadowColor = getRainbowColor(120); ctx.shadowBlur = un ? 22 + Math.sin(gameTime * 4) * 6 : 8; }
      ctx.fillStyle = sel ? '#12233f' : (skin.special ? '#0c0a24' : '#0a0d1e');
      ctx.strokeStyle = sel ? col : (un ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.12)');
      if (skin.special) ctx.strokeStyle = un ? getRainbowColor(60) : 'rgba(180,150,255,0.3)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      ctx.beginPath(); ctx.roundRect(cardX, cardY, skinW, cardH, 12); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      if (skin.special) {
        ctx.save();
        ctx.beginPath(); ctx.roundRect(cardX, cardY, skinW, cardH, 12); ctx.clip();
        for (let i = 0; i < 18; i++) {
          const sx = cardX + (((i * 71 + 13) % 100) / 100) * skinW, sy = cardY + (((i * 47 + 29) % 100) / 100) * cardH;
          ctx.globalAlpha = (un ? 0.8 : 0.3) * Math.abs(Math.sin(gameTime * 2.5 + i));
          ctx.fillStyle = i % 3 === 0 ? getRainbowColor(i * 30) : '#ffffff';
          ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.restore();
      }
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = un ? '#fff' : '#777';
      ctx.fillText(skin.name, cardX + 24, cardY + 28);
      ctx.font = '11.5px sans-serif'; ctx.fillStyle = un ? '#39ff14' : '#ff6688';
      let status = un ? 'UNLOCKED' : ('🔒 ' + skin.reqDesc);
      if (!un && skin.reqAch) status = '🔒 ' + skin.reqDesc + ' (' + achUnlockedCount() + '/' + ACHIEVEMENTS.length + ')';
      fitFont(status, skinW - 24 - 100, 11.5, '');
      ctx.fillText(status, cardX + 24, cardY + 54);
      ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = sel ? col : (un ? '#8e9bbb' : '#555');
      ctx.textBaseline = 'middle';
      ctx.fillText(sel ? 'SELECTED ★' : (un ? 'EQUIP ▶' : '🔒'), cardX + skinW - 16, cardY + cardH / 2);
      ctx.restore();
    });
  } else {
    UPGRADE_KEYS.forEach((key, idx) => {
      const def = UPGRADE_DEFS[key], cardY = G.contentTop + idx * G.upgStep + garScroll, cardX = midX - upgW / 2, cardH = G.upgH;
      if (cardY + cardH < CONTENT_TOP || cardY > screenHeight) return;
      const cur = upgrades[key] || 0, isMax = cur >= def.max, cost = isMax ? 0 : def.costs[cur], can = !isMax && totalCoins >= cost;
      ctx.save();
      ctx.fillStyle = '#0a0e20';
      ctx.strokeStyle = can ? 'rgba(255,230,0,0.45)' : 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(cardX, cardY, upgW, cardH, 12); ctx.fill(); ctx.stroke();
      ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.icon, cardX + 30, cardY + cardH / 2);
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(def.name, cardX + 58, cardY + 16);
      ctx.fillStyle = '#8e9bbb';
      fitFont(def.desc, upgW - 58 - 110, 10, '');
      ctx.fillText(def.desc, cardX + 58, cardY + 34);
      ctx.fillStyle = '#39ff14'; ctx.font = 'bold 10.5px sans-serif';
      ctx.fillText('Lv ' + cur + '/' + def.max, cardX + 58, cardY + 50);
      drawBtn(cardX + upgW - 58, cardY + cardH / 2, 92, 36, isMax ? '#778899' : (can ? '#39ff14' : '#ff7799'), isMax ? '#1a1f2e' : (can ? '#1f2b09' : '#22141a'), isMax ? 'MAXED' : ('🪙 ' + cost), 12);
      ctx.restore();
    });
  }
  ctx.restore();

  drawScreenHeader('🚗 GARAGE & UPGRADES', '🪙 ' + totalCoins + ' • ' + unlockedSkinIds.length + '/' + SKINS.length + ' Skins • ' + upgradesMaxedCount() + '/' + UPGRADE_KEYS.length + ' Upgrades', '#ff66c4');
  drawTabs(GAR_TABS, garTab, '#ff66c4');
  drawScrollHint(STATE_GARAGE);
}

function drawPause() {
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
  const midX = screenWidth / 2, midY = screenHeight / 2;
  ctx.textAlign = 'center'; ctx.font = '900 46px sans-serif'; ctx.fillStyle = '#00ffff'; ctx.fillText('PAUSED', midX, midY - 90);
  drawBtn(midX, midY - 15, 200, 46, '#00ffff', '#051829', '▶ RESUME', 18);
  drawBtn(midX, midY + 47, 200, 46, '#ff66c4', '#2a0a20', '🔄 RESTART', 18);
  drawBtn(midX, midY + 109, 200, 46, '#ff4d6d', '#220810', '🏠 QUIT', 18);
  ctx.restore();
}

function drawGameOver() {
  ctx.save(); ctx.fillStyle = 'rgba(10,2,12,0.84)'; ctx.fillRect(-20, -20, screenWidth + 40, screenHeight + 40);
  const midX = screenWidth / 2, midY = screenHeight / 2, timeUp = gameOverReason === 'time', md = getMode(), gcfg = getLaneCfg();
  ctx.textAlign = 'center'; ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = md.color;
  ctx.fillText(md.icon + ' ' + md.name + ' MODE', midX, midY - 165);
  ctx.font = 'bold 10.5px sans-serif'; ctx.fillStyle = gcfg.color;
  ctx.fillText('🛣️ ' + gcfg.lanes + ' LANES • ' + getRoad().name.toUpperCase() + (gcfg.scoreMult > 1 ? ' • x' + gcfg.scoreMult : ''), midX, midY - 148);
  ctx.font = '900 42px sans-serif'; ctx.fillStyle = timeUp ? '#39ff14' : '#ff0055';
  ctx.fillText(timeUp ? "TIME'S UP!" : 'CRASHED!', midX, midY - 118);
  const cw = Math.min(screenWidth * 0.82, 310), cy = midY - 65;
  ctx.fillStyle = 'rgba(14,18,36,0.9)';
  ctx.strokeStyle = timeUp ? 'rgba(57,255,20,0.4)' : 'rgba(255,0,127,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(midX - cw / 2, cy, cw, 126, 16); ctx.fill(); ctx.stroke();
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#8e9bbb'; ctx.fillText('FINAL SCORE', midX, cy + 20);
  ctx.font = '900 32px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(score.toString(), midX, cy + 52);
  ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffd700';
  ctx.fillText('BEST SCORE: ' + (lifetimeStats.bestScore || bestScore), midX, cy + 78);
  ctx.fillStyle = '#ffe600';
  ctx.fillText('RUN COINS: +' + coinsCollected + ' • TOTAL: 🪙 ' + totalCoins, midX, cy + 96);
  ctx.fillStyle = '#ffb347';
  ctx.fillText('🏆 MILESTONES: ' + milestonesReached, midX, cy + 114);
  const rdy = performance.now() - gameOverTimestamp >= 400;
  drawBtn(midX, midY + 116, 190, 48, rdy ? '#ff007f' : '#666', rdy ? '#2a0a20' : '#1a1a24', 'RETRY', 19);
  drawBtn(midX, midY + 174, 190, 48, rdy ? '#00ffff' : '#666', rdy ? '#051829' : '#1a1a24', '🏠 MAIN MENU', 18);
  ctx.restore();
}

function drawToast() {
  if (toastTimer <= 0 || currentState === STATE_PLAYING) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, toastTimer * 1.5); ctx.font = '900 14px sans-serif';
  const tw = ctx.measureText(toastText).width + 36, x = screenWidth / 2, y = screenHeight - 50;
  ctx.shadowColor = toastColor; ctx.shadowBlur = 14;
  ctx.fillStyle = 'rgba(8,12,28,0.95)'; ctx.strokeStyle = toastColor; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - tw / 2, y - 18, tw, 36, 18); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = toastColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(toastText, x, y);
  ctx.restore();
}

// LOOP
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (currentState !== STATE_PAUSED) update(dt);
  ctx.save(); ctx.scale(dpr, dpr);
  ctx.translate(shakeX, shakeY);
  drawBackground(); drawRoadDecor(); drawRoad(); drawSpeedLines();
  coins.forEach(c => {
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(0, 0, c.radius + 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  powerups.forEach(p => {
    ctx.save(); ctx.translate(p.x, p.y);
    const col = p.type === 'rapid' ? '#ffe600' : (p.type === 'health' ? '#39ff14' : '#00ffff');
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.fillStyle = '#091522'; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  playerBullets.forEach(b => { ctx.fillStyle = b.color || '#00ffff'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
  enemyBullets.forEach(b => { ctx.fillStyle = b.color || '#ff0033'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
  drawBoss(); drawPlayerCar(); drawTraffic();
  particles.forEach(p => {
    ctx.save(); ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
  drawWeatherOverlay();
  if (currentState === STATE_PLAYING) { drawHUD(); if (tutorialActive) drawTutorial(); }
  else if (currentState === STATE_PAUSED) { drawHUD(); drawPause(); }
  else if (currentState === STATE_MENU) { drawMenu(); if (rewardPopup) drawRewardPopup(); }
  else if (currentState === STATE_GARAGE) drawGarage();
  else if (currentState === STATE_ACHIEVEMENTS) drawAchievements();
  else if (currentState === STATE_SETTINGS) drawSettings();
  else if (currentState === STATE_MODE) drawModeSelect();
  else if (currentState === STATE_GAMEOVER) drawGameOver();
  drawToast();
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

resize();
requestAnimationFrame(t => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
