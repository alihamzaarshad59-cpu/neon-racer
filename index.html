      ctx.roundRect(centerX - 105, ghostRowY - 16, 95, 32, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = ghostEnabled ? '#39ff14' : '#888888';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(ghostEnabled ? '👻 GHOST: ON' : '👻 GHOST: OFF', centerX - 58, ghostRowY);

      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#220812';
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(centerX + 10, ghostRowY - 16, 95, 32, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff6688';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('CLEAR GHOST', centerX + 57, ghostRowY);

      // Instruction footnote
      ctx.fillStyle = 'rgba(220, 240, 255, 0.7)';
      ctx.font = '11px sans-serif';
      ctx.fillText('Boss every 5k pts • Upgrades, Combos & Ghost racing', centerX, centerY + 218);
      ctx.restore();
    }

    function drawGarage() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)';
      ctx.fillRect(0, 0, screenWidth, screenHeight);
      const centerX = screenWidth / 2;

      ctx.save();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0a1d30';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(18, 24, 88, 38, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('◀ BACK', 62, 43);

      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 22px sans-serif';
      ctx.fillText('CYBER GARAGE', centerX + 20, 43);
      ctx.restore();

      const cardW = Math.min(screenWidth * 0.88, 380);
      const cardH = 82;
      const startY = 95;
      const gap = 16;

      SKINS.forEach(function (skin, idx) {
        const cardY = startY + idx * (cardH + gap);
        const cardX = centerX - cardW / 2;
        const isUnlocked = unlockedSkinIds.includes(skin.id);
        const isSelected = selectedSkinId === skin.id;
        const skinGlow = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;

        ctx.save();
        ctx.fillStyle = isSelected ? '#12233f' : '#0a0d1e';
        ctx.strokeStyle = isSelected ? skinGlow : (isUnlocked ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 255, 255, 0.12)');
        ctx.lineWidth = isSelected ? 2.5 : 1.5;
        if (isSelected) {
          ctx.shadowColor = skinGlow;
          ctx.shadowBlur = 16;
        }
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 14);
        ctx.fill();
        ctx.stroke();

        const previewX = cardX + 38;
        const previewY = cardY + cardH / 2;
        ctx.save();
        ctx.translate(previewX, previewY);
        ctx.scale(0.55, 0.55);
        ctx.shadowColor = isUnlocked ? skinGlow : '#555555';
        ctx.shadowBlur = 12;
        ctx.fillStyle = isUnlocked ? skin.bodyTop : '#222222';
        ctx.strokeStyle = isUnlocked ? skinGlow : '#666666';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-16, -28, 32, 56, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#081726';
        ctx.fillRect(-10, -8, 20, 14);
        ctx.restore();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.shadowColor = isUnlocked ? skinGlow : 'transparent';
        ctx.shadowBlur = 8;
        ctx.fillStyle = isUnlocked ? '#ffffff' : '#777777';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(skin.name, cardX + 76, cardY + 16);

        ctx.font = '12px sans-serif';
        if (isUnlocked) {
          ctx.fillStyle = '#39ff14';
          ctx.fillText('UNLOCKED', cardX + 76, cardY + 44);
        } else {
          ctx.fillStyle = '#ff6688';
          ctx.fillText('🔒 ' + skin.reqDesc, cardX + 76, cardY + 44);
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        if (isSelected) {
          ctx.fillStyle = skinGlow;
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('SELECTED ★', cardX + cardW - 16, cardY + cardH / 2);
        } else if (isUnlocked) {
          ctx.fillStyle = '#8e9bbb';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('EQUIP ▶', cardX + cardW - 16, cardY + cardH / 2);
        } else {
          ctx.fillStyle = '#555555';
          ctx.font = '18px sans-serif';
          ctx.fillText('🔒', cardX + cardW - 18, cardY + cardH / 2);
        }
        ctx.restore();
      });
    }

    // ==========================================
    // FEATURE 1: UPGRADES SHOP SCREEN
    // ==========================================
    function drawUpgrades() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)';
      ctx.fillRect(0, 0, screenWidth, screenHeight);
      const centerX = screenWidth / 2;

      // Back Button
      ctx.save();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0a1d30';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(18, 24, 88, 38, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('◀ BACK', 62, 43);

      // Title & Balance at Top
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffe600';
      ctx.font = '900 22px sans-serif';
      ctx.fillText('UPGRADES', centerX + 10, 36);

      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      ctx.fillText('BALANCE: 🪙 ' + totalCoins, centerX + 10, 56);
      ctx.restore();

      const cardW = Math.min(screenWidth * 0.90, 390);
      const cardH = 82;
      const startY = 100;
      const gap = 14;

      const keys = ['speed', 'fireRate', 'hp', 'shield'];
      keys.forEach(function (key, idx) {
        const def = UPGRADE_DEFS[key];
        const cardY = startY + idx * (cardH + gap);
        const cardX = centerX - cardW / 2;
        const curLvl = upgrades[key] || 0;
        const isMax = curLvl >= def.max;
        const cost = isMax ? 0 : def.costs[curLvl];
        const canAfford = !isMax && totalCoins >= cost;

        ctx.save();
        ctx.fillStyle = '#0a0e20';
        ctx.strokeStyle = canAfford ? 'rgba(255, 230, 0, 0.45)' : 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 12);
        ctx.fill();
        ctx.stroke();

        // Icon Box
        ctx.fillStyle = '#101633';
        ctx.beginPath();
        ctx.roundRect(cardX + 12, cardY + 14, 44, 54, 8);
        ctx.fill();
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(def.icon, cardX + 34, cardY + 41);

        // Name & Description
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(def.name, cardX + 66, cardY + 16);

        ctx.fillStyle = '#8e9bbb';
        ctx.font = '11px sans-serif';
        ctx.fillText(def.desc, cardX + 66, cardY + 37);

        // Level
        ctx.fillStyle = '#39ff14';
        ctx.font = 'bold 11px sans-serif';
        const lvlStr = 'Lv ' + curLvl + '/' + def.max;
        ctx.fillText(lvlStr, cardX + 66, cardY + 54);

        // Buy Button
        const btnW = 92;
        const btnH = 38;
        const btnX = cardX + cardW - btnW - 12;
        const btnY = cardY + (cardH - btnH) / 2;

        ctx.save();
        if (isMax) {
          ctx.fillStyle = '#1a1f2e';
          ctx.strokeStyle = '#444d66';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(btnX, btnY, btnW, btnH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#778899';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('MAXED', btnX + btnW / 2, btnY + btnH / 2);
        } else {
          ctx.fillStyle = canAfford ? '#1f2b09' : '#22141a';
          ctx.strokeStyle = canAfford ? '#39ff14' : '#663344';
          ctx.lineWidth = canAfford ? 2 : 1;
          if (canAfford) {
            ctx.shadowColor = '#39ff14';
            ctx.shadowBlur = 10;
          }
          ctx.beginPath();
          ctx.roundRect(btnX, btnY, btnW, btnH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = canAfford ? '#39ff14' : '#ff7799';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(canAfford ? 'BUY' : 'NEED', btnX + btnW / 2, btnY + btnH / 2 - 7);
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('🪙 ' + cost, btnX + btnW / 2, btnY + btnH / 2 + 8);
        }
        ctx.restore();

        ctx.restore();
      });
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(10, 2, 12, 0.84)';
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      const centerX = screenWidth / 2;
      const centerY = screenHeight / 2;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 32;
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 48px sans-serif';
      ctx.fillText('CRASHED!', centerX, centerY - 105);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeText('CRASHED!', centerX, centerY - 105);
      ctx.restore();

      const cardW = Math.min(screenWidth * 0.82, 310);
      const cardH = 126;
      const cardY = centerY - 65;

      ctx.save();
      ctx.fillStyle = 'rgba(14, 18, 36, 0.9)';
      ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(centerX - cardW / 2, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#8e9bbb';
      ctx.font = '12px sans-serif';
      ctx.fillText('FINAL SCORE', centerX, cardY + 24);

      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 32px sans-serif';
      ctx.fillText(score.toString(), centerX, cardY + 58);

      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('BEST SCORE: ' + (lifetimeStats.bestScore || bestScore), centerX, cardY + 86);

      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('RUN COINS: +' + coinsCollected + '  •  TOTAL: 🪙 ' + totalCoins, centerX, cardY + 108);
      ctx.restore();

      const ready = performance.now() - gameOverTimestamp >= 400;
      const pulse = ready ? 1 + 0.05 * Math.sin(gameTime * 5) : 1;
      const btnW = 190 * pulse;
      const btnH = 50 * pulse;

      // 1. RETRY Button at centerY + 108
      const retryBtnY = centerY + 108;
      ctx.save();
      ctx.shadowColor = ready ? '#ff007f' : '#555555';
      ctx.shadowBlur = ready ? 22 : 4;
      ctx.fillStyle = ready ? '#2a0a20' : '#1a1a24';
      ctx.strokeStyle = ready ? '#ff007f' : '#666666';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.roundRect(centerX - btnW / 2, retryBtnY - btnH / 2, btnW, btnH, 25);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = ready ? '#ffffff' : '#888888';
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('RETRY', centerX, retryBtnY);
      ctx.restore();

      // 2. MAIN MENU Button at centerY + 166
      const menuBtnY = centerY + 166;
      ctx.save();
      ctx.shadowColor = ready ? '#00ffff' : '#555555';
      ctx.shadowBlur = ready ? 22 : 4;
      ctx.fillStyle = ready ? '#051829' : '#1a1a24';
      ctx.strokeStyle = ready ? '#00ffff' : '#666666';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.roundRect(centerX - btnW / 2, menuBtnY - btnH / 2, btnW, btnH, 25);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = ready ? '#00ffff' : '#888888';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏠 MAIN MENU', centerX, menuBtnY);
      ctx.restore();
    }

    // ==========================================
    // MAIN GAME LOOP
    // ==========================================
    let lastTimestamp = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.05);
      lastTimestamp = now;

      update(dt);

      ctx.save();
      ctx.scale(dpr, dpr);

      drawBackground();
      drawRoad();
      drawCoins();
      drawPowerups();
      drawBullets();
      drawBoss();
      drawGhostCar();
      drawPlayerCar();
      drawTrafficCars();
      drawParticles();

      if (currentState === STATE_PLAYING) {
        drawHUD();
      } else if (currentState === STATE_MENU) {
        drawMenu();
      } else if (currentState === STATE_GARAGE) {
        drawGarage();
      } else if (currentState === STATE_UPGRADES) {
        drawUpgrades();
      } else if (currentState === STATE_GAMEOVER) {
        drawGameOver();
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    resize();
    requestAnimationFrame(function (timestamp) {
      lastTimestamp = timestamp;
      gameLoop(timestamp);
    });

  })();
  </script>
</body>
</html>
