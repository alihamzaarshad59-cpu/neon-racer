<script>
'use strict';
(function () {
// GAME RUNTIME STATE (near misses)
const game = {
  nearMissPopups: []
};

// AUDIO SYNTHESIZER
let audioCtx = null, soundEnabled = true;
try { const s = localStorage.getItem('neon_racer_sound'); if (s !== null) soundEnabled = (s === 'true'); } catch (e) {}

function loadPct(key, def) {
  try { const v = localStorage.getItem(key); if (v !== null) { const n = parseInt(v, 10); if (!isNaN(n)) return Math.min(100, Math.max(0, n)); } } catch (e) {}
  return def;
}
let musicVolPct = loadPct('neon_racer_music_vol', 100), sfxVolPct = loadPct('neon_racer_sfx_vol', 100);
function sfxVol() { return sfxVolPct / 100; }
function musicVol() { return musicVolPct / 100; }

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('neon_racer_sound', soundEnabled ? 'true' : 'false'); } catch (e) {}
  if (soundEnabled) { soundCoin(); if (currentState === STATE_PLAYING) startEngineSound(); }
  else { stopEngineSound(); }
}
function initAudio() {
  if (!soundEnabled) return;
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, dur, gStart, gEnd, endFreq) {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  try {
    const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain(), v = sfxVol();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, now);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), now + dur);
    g.gain.setValueAtTime(Math.max((gStart !== undefined ? gStart : 0.15) * v, 0.0002), now);
    g.gain.exponentialRampToValueAtTime(Math.max((gEnd !== undefined ? gEnd : 0.001) * v, 0.0001), now + dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
  } catch (e) {}
}

// ENGINE HUM SOUND
let engineOsc = null, engineOsc2 = null, engineFilter = null, engineGain = null, engineGain2 = null, engineRunning = false;
const MAX_ENGINE_SPEED = 950;
function startEngineSound() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0 || engineRunning) return;
  try {
    const now = audioCtx.currentTime;
    engineOsc = audioCtx.createOscillator();
    engineOsc2 = audioCtx.createOscillator();
    engineFilter = audioCtx.createBiquadFilter();
    engineGain = audioCtx.createGain();
    engineGain2 = audioCtx.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(55, now);
    engineOsc2.type = 'sine';
    engineOsc2.frequency.setValueAtTime(27.5, now);
    engineFilter.type = 'lowpass';
    engineFilter.frequency.setValueAtTime(300, now);
    const initialGain = 0.025 * sfxVol();
    engineGain.gain.setValueAtTime(0.0001, now);
    engineGain.gain.setTargetAtTime(initialGain, now, 0.1);
    engineGain2.gain.setValueAtTime(0.0001, now);
    engineGain2.gain.setTargetAtTime(initialGain * 0.5, now, 0.1);
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc2.connect(engineGain2);
    engineGain2.connect(audioCtx.destination);
    engineOsc.start(now);
    engineOsc2.start(now);
    engineRunning = true;
  } catch (e) {}
}
function updateEngineSound() {
  if (!engineRunning || !audioCtx || !engineOsc || !engineFilter || !engineGain) return;
  if (!soundEnabled || currentState !== STATE_PLAYING || sfxVol() <= 0) { stopEngineSound(); return; }
  try {
    const now = audioCtx.currentTime;
    const ratio = Math.min(1, Math.max(0, currentSpeed / MAX_ENGINE_SPEED));
    const targetFreq = 55 + (220 - 55) * Math.pow(ratio, 0.7) + Math.sin(gameTime * 8) * 2;
    const targetFilterFreq = 300 + (1400 - 300) * Math.pow(ratio, 0.8);
    const targetGain = (0.025 + (0.10 - 0.025) * ratio) * sfxVol();
    engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.1);
    if (engineOsc2) engineOsc2.frequency.setTargetAtTime(Math.max(1, targetFreq / 2), now, 0.1);
    engineFilter.frequency.setTargetAtTime(targetFilterFreq, now, 0.1);
    engineGain.gain.setTargetAtTime(targetGain, now, 0.1);
    if (engineGain2) engineGain2.gain.setTargetAtTime(targetGain * 0.5, now, 0.1);
  } catch (e) {}
}
function stopEngineSound() {
  if (!engineRunning) return;
  try {
    if (audioCtx) {
      const now = audioCtx.currentTime;
      if (engineGain) engineGain.gain.setTargetAtTime(0.0001, now, 0.1);
      if (engineGain2) engineGain2.gain.setTargetAtTime(0.0001, now, 0.1);
      const prevOsc = engineOsc;
      const prevOsc2 = engineOsc2;
      setTimeout(() => {
        try { if (prevOsc) prevOsc.stop(); } catch (e) {}
        try { if (prevOsc2) prevOsc2.stop(); } catch (e) {}
      }, 200);
    }
  } catch (e) {}
  engineOsc = null; engineOsc2 = null; engineFilter = null; engineGain = null; engineGain2 = null; engineRunning = false;
}

// BACKGROUND MUSIC
const MUSIC_BASS = [55, 55, 82.41, 55, 65.41, 65.41, 98, 65.41];
let musicTimer = 0, musicStep = 0;
function musicNote(freq, type, dur, gain) {
  try {
    const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(Math.max(gain * musicVol(), 0.0002), now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
  } catch (e) {}
}
function updateMusic(dt) {
  if (!soundEnabled || !audioCtx || musicVol() <= 0) return;
  musicTimer -= dt;
  if (musicTimer > 0) return;
  musicTimer = 0.24;
  const f = MUSIC_BASS[musicStep % 8];
  musicNote(f * 2, 'triangle', 0.22, 0.09);
  if (musicStep % 2 === 1) musicNote(f * 8, 'square', 0.12, 0.022);
  musicStep++;
}

function soundPlayerShoot() { playTone(880, 'square', 0.08, 0.08, 0.001, 220); }
function soundEnemyShoot() { playTone(320, 'sawtooth', 0.1, 0.06, 0.001, 110); }
function soundBossShoot() { playTone(260, 'sawtooth', 0.18, 0.12, 0.001, 70); }
function soundLightning() { playTone(650, 'sawtooth', 0.28, 0.28, 0.001, 80); }
function soundEnemyExplosion() { playTone(240, 'triangle', 0.15, 0.2, 0.001, 40); }
function soundBossExplosion() { playTone(180, 'sawtooth', 0.85, 0.4, 0.001, 20); }
function soundFreeze() { playTone(950, 'sine', 0.18, 0.18, 0.01, 1300); }
function soundNitro() { playTone(200, 'sawtooth', 0.5, 0.25, 0.001, 900); }
function soundMissile() { playTone(450, 'sawtooth', 0.16, 0.14, 0.001, 180); }
function soundCharge() { playTone(150, 'sawtooth', 0.4, 0.28, 0.01, 550); }
function soundPlayerHit() {
  try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
  playTone(140, 'sawtooth', 0.2, 0.25, 0.001, 45);
}
function soundPowerup() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  const now = audioCtx.currentTime, v = sfxVol();
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
    try {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.05);
      g.gain.setValueAtTime(Math.max(0.12 * v, 0.0002), now + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.12);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.12);
    } catch (e) {}
  });
}
function soundMissionComplete() {
  if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
  const now = audioCtx.currentTime, v = sfxVol();
  [440, 554.37, 659.25, 880].forEach((f, i) => {
    try {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.08);
      g.gain.setValueAtTime(Math.max(0.15 * v, 0.0002), now + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.2);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.2);
    } catch (e) {}
  });
}
function soundCoin() {
  playTone(987.77, 'square', 0.08, 0.12, 0.001);
  setTimeout(() => playTone(1318.51, 'square', 0.14, 0.15, 0.001), 70);
}
function soundCrash() {
  try { if (navigator.vibrate) navigator.vibrate([120, 50, 250]); } catch (e) {}
  playTone(160, 'sawtooth', 0.5, 0.35, 0.001, 25);
}
function soundStart() { playTone(523.25, 'triangle', 0.12, 0.15, 0.001); setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.18, 0.001), 90); }

// STATES
const STATE_MENU = 0, STATE_PLAYING = 1, STATE_GAMEOVER = 2, STATE_GARAGE = 3, STATE_PAUSED = 4, STATE_ACHIEVEMENTS = 5, STATE_SETTINGS = 6, STATE_MODE = 7;
let currentState = STATE_MENU, gameOverTimestamp = 0, gameOverReason = 'crash';
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let screenWidth = 0, screenHeight = 0, dpr = 1, roadX = 0, roadW = 0, laneWidth = 0, roadScrollOffset = 0;
let currentSpeed = 420, distanceTraveled = 0, score = 0, bonusScore = 0, bestScore = 0, bestScoreBeforeRun = 0, coinsCollected = 0, gameTime = 0;

// TOAST
let toastText = '', toastColor = '#39ff14', toastTimer = 0;
function showToast(text, color) { toastText = text; toastColor = color || '#39ff14'; toastTimer = 2.2; }

// NEAR MISS STATE
let nearMissCooldown = 0;

// PER-RUN TRACKING (no-hit time, achievements check throttle)
let runHitTaken = false, runNoHitTime = 0, runPrevHP = 3, achCheckTimer = 0;

// GAME OVER HOOK
let gameOverHookMain = '';
let gameOverHookSub = '';

// SCREEN SHAKE (visual only - never affects collisions)
let shakeIntensity = 0, shakeDecay = 0.88, shakeX = 0, shakeY = 0;
function triggerScreenShake(intensity, duration) {
  shakeIntensity = Math.max(shakeIntensity, intensity);
}
function updateScreenShake() {
  if (shakeIntensity > 0) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= shakeDecay;
    if (shakeIntensity < 0.3) { shakeIntensity = 0; shakeX = 0; shakeY = 0; }
  } else if (shakeX !== 0 || shakeY !== 0) { shakeX = 0; shakeY = 0; }
}
function clearScreenShake() { shakeIntensity = 0; shakeX = 0; shakeY = 0; }

// KILL STREAK (rapid kills within 1.5s - separate from long-term combo)
let killStreakCount = 0, killStreakTimer = 0, lastKillTime = 0;
function showStreakText(text, color, size) {
  floatingTexts.push({ text: text, x: screenWidth / 2, y: screenHeight * 0.4, vy: 40, alpha: 1, decay: 0.67, color: color, size: size || 28, blur: 20 });
}
function registerKillStreak() {
  killStreakCount++;
  killStreakTimer = 1.5;
  lastKillTime = gameTime;
  dailyMax('streak', killStreakCount);
  switch (killStreakCount) {
    case 2: showStreakText('DOUBLE KILL!', '#39ff14'); break;
    case 3: showStreakText('TRIPLE KILL!', '#00ffff'); break;
    case 4: showStreakText('QUAD KILL!', '#3d8bff'); break;
    case 5: showStreakText('RAMPAGE!', '#ffe600'); break;
    case 7: showStreakText('KILLING SPREE!', '#ff7700'); triggerScreenShake(4, 0.2); break;
    case 10: showStreakText('UNSTOPPABLE!', '#ff2222'); triggerScreenShake(6, 0.25); break;
    case 15: showStreakText('GODLIKE!', '#ff00ff'); triggerScreenShake(7, 0.3); break;
    case 20: showStreakText('LEGENDARY!', getRainbowColor()); triggerScreenShake(8, 0.3); break;
    case 25: showStreakText('IMMORTAL!', getRainbowColor(), 34); triggerScreenShake(10, 0.4); break;
    case 30:
      showStreakText('TRANSCENDENT!', getRainbowColor(), 32);
      triggerScreenShake(14, 0.5);
      screenDamageFlash = 0.6; screenDamageFlashColor = 'rgba(255, 255, 255, 0.45)';
      break;
    default: break;
  }
}

// MILESTONES (popup only - gameplay NEVER pauses)
let nextMilestone = 5000, milestonesReached = 0, highestMilestoneEver = 0;
try { const hm = parseInt(localStorage.getItem('neon_racer_highest_milestone') || '0', 10); if (!isNaN(hm)) highestMilestoneEver = hm; } catch (e) {}
let milestonePopup = { score: 0, reward: 0, timer: 0, active: false };
const MILESTONE_REWARDS = {
  5000: 50,
  10000: 100,
  15000: 150,
  20000: 200,
  25000: 250,
  30000: 300,
  35000: 400,
  40000: 500,
  45000: 750,
  50000: 1000
};
function getMilestoneReward(m) {
  if (MILESTONE_REWARDS[m]) return MILESTONE_REWARDS[m];
  if (m >= 50000) return 500;
  return 100;
}
function showMilestonePopup(sc, reward) {
  milestonePopup = { score: sc, reward: reward, timer: 2.5, active: true };
}
function checkMilestones() {
  if (score >= nextMilestone) {
    const reward = getMilestoneReward(nextMilestone);
    totalCoins += reward;
    saveCoins();
    milestonesReached++;
    lifetimeStats.totalMilestones = (lifetimeStats.totalMilestones || 0) + 1;
    if (milestonesReached > (lifetimeStats.maxMilestonesRun || 0)) lifetimeStats.maxMilestonesRun = milestonesReached;
    dailyBump('milestones', 1);
    if (nextMilestone > highestMilestoneEver) {
      highestMilestoneEver = nextMilestone;
      try { localStorage.setItem('neon_racer_highest_milestone', highestMilestoneEver.toString()); } catch (e) {}
    }
    showMilestonePopup(nextMilestone, reward);
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    soundMissionComplete();
    triggerScreenShake(12, 0.5);
    for (let p = 0; p < 45; p++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 400 + 100;
      particles.push({
        x: screenWidth / 2,
        y: screenHeight * 0.72,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        size: Math.random() * 5 + 3,
        color: Math.random() < 0.5 ? '#ffd700' : getRainbowColor(p * 10),
        alpha: 1,
        decay: 1.2
      });
    }
    for (let i = 0; i < 5; i++) {
      coins.push({
        x: roadX + Math.floor(Math.random() * laneCount) * laneWidth + laneWidth / 2,
        y: -40 - i * 60,
        radius: 9,
        pulseOffset: Math.random() * 6
      });
    }
    nextMilestone += 5000;
    saveStats();
  }
}

// TUTORIAL (first-time only)
let tutorialDone = false;
try { tutorialDone = localStorage.getItem('neon_racer_tutorial_done') === 'true'; } catch (e) {}
let tutorialActive = false, tutorialStep = 0;
const TUTORIAL_STEPS = [
  { icon: '🎮', title: 'WELCOME', lines: ["Let's learn to play in 20 seconds", '', 'Tap NEXT to continue'] },
  { icon: '👈👉', title: 'STEERING', lines: ['Tap LEFT half of screen = move left', 'Tap RIGHT half = move right'] },
  { icon: '💥', title: 'AUTO-FIRE', lines: ['Your car shoots automatically.', 'Focus on dodging and steering!'] },
  { icon: '🪙', title: 'COLLECT & DESTROY', lines: ['Collect coins 🪙 for upgrades.', 'Destroy red enemy cars for score.'] },
  { icon: '🔥', title: 'NITRO BOOST', lines: ['Tap the 🔥 button (bottom-right) for', 'a 1.5x speed boost!'] },
  { icon: '👹', title: 'BOSSES & MISSIONS', lines: ['Bosses appear every 5,000 score.', 'Complete missions for bonus points!'] },
  { icon: '🏁', title: 'READY TO RACE!', lines: ['Good luck! Set a new high score!'] }
];
function tutorialLayout() {
  const cw = Math.min(screenWidth * 0.9, 340), chh = 320, midX = screenWidth / 2, midY = screenHeight / 2;
  return { cw: cw, chh: chh, midX: midX, cx0: midX - cw / 2, cy0: midY - chh / 2 };
}
function markTutorialDone() {
  tutorialDone = true;
  tutorialActive = false;
  try { localStorage.setItem('neon_racer_tutorial_done', 'true'); } catch (e) {}
  resetSteering();
  if (currentState === STATE_PLAYING) startEngineSound();
}
function tutorialNext() {
  soundCoin();
  if (tutorialStep < TUTORIAL_STEPS.length - 1) tutorialStep++;
  else markTutorialDone();
}
function handleTutorialClick(cx, cy) {
  const L = tutorialLayout();
  const last = tutorialStep >= TUTORIAL_STEPS.length - 1;
  if (!last && Math.abs(cx - (L.cx0 + L.cw - 42)) <= 38 && Math.abs(cy - (L.cy0 + 22)) <= 20) { soundCoin(); markTutorialDone(); return; }
  if (Math.abs(cx - L.midX) <= 95 && Math.abs(cy - (L.cy0 + L.chh - 62)) <= 26) { tutorialNext(); return; }
}
function fitFont(text, maxW, px, weight) {
  let s = px;
  do { ctx.font = weight + ' ' + s + 'px sans-serif'; s -= 0.5; } while (ctx.measureText(text).width > maxW && s > 8);
}

// SETTINGS
const STEER_SPEEDS = { slow: 500, normal: 640, fast: 800 };
let sensitivity = 'normal';
try { const sv = localStorage.getItem('neon_racer_sensitivity'); if (sv && STEER_SPEEDS[sv]) sensitivity = sv; } catch (e) {}

// ============ GYRO (TILT) STEERING STATE ============
let gyroEnabled = false;
try { gyroEnabled = localStorage.getItem('neon_racer_gyro') === 'true'; } catch (e) {}
let gyroBaseGamma = null;
let gyroCurrentGamma = 0;
const GYRO_DEADZONE_DEG = 3;
const GYRO_MAX_TILT_DEG = 25;

// RACING MODES
const MODES = [
  { id: 'classic', name: 'CLASSIC', icon: '🏁', color: '#00ffff', desc: 'Normal gameplay - all features' },
  { id: 'timetrial', name: 'TIME TRIAL', icon: '⏱️', color: '#ffe600', desc: 'Survive 30 seconds - highest score wins' },
  { id: 'elimination', name: 'ELIMINATION', icon: '💀', color: '#ff0055', desc: 'Deadly traffic - 1 hit = death - 2x score' },
  { id: 'drift', name: 'DRIFT', icon: '🌪️', color: '#b026ff', desc: 'No shooting - +5/s steering, +10/s combo' }
];
const TIME_TRIAL_DURATION = 30;
let gameMode = 'classic';
try { const sm = localStorage.getItem('neon_racer_mode'); if (sm && MODES.some(m => m.id === sm)) gameMode = sm; } catch (e) {}
function getMode() { return MODES.find(m => m.id === gameMode) || MODES[0]; }
function capName(n) { return n.charAt(0) + n.slice(1).toLowerCase(); }
let driftScore = 0, driftStreak = 0, driftCombo = false, driftActive = false;

// LANES (replaces the old difficulty system)
const LANE_CONFIGS = {
  3: { lanes: 3, speedMult: 1.0, trafficMult: 0.85, spawnRateMult: 0.9, scoreMult: 1.0, color: '#39ff14', icon: '🟢', desc: 'Normal speed, fewer cars' },
  4: { lanes: 4, speedMult: 1.15, trafficMult: 1.0, spawnRateMult: 1.0, scoreMult: 1.3, color: '#ffe600', icon: '🟡', desc: 'Faster, more cars' },
  5: { lanes: 5, speedMult: 1.3, trafficMult: 1.15, spawnRateMult: 1.2, scoreMult: 1.6, color: '#ff0055', icon: '🔴', desc: 'Fastest, most cars' }
};
const LANE_KEY = { 3: 'easy', 4: 'medium', 5: 'hard' };
const DIFF_STAT = { easy: 'easyModeBestScore', medium: 'mediumModeBestScore', hard: 'hardModeBestScore' };
let laneChoice = 3;
try {
  const sl = parseInt(localStorage.getItem('neon_racer_lanes') || '0', 10);
  if (LANE_CONFIGS[sl]) laneChoice = sl;
  else {
    const sdf = localStorage.getItem('neon_racer_difficulty');
    if (sdf === 'medium') laneChoice = 4; else if (sdf === 'hard') laneChoice = 5;
  }
} catch (e) {}
function getLaneCfg() { return LANE_CONFIGS[laneChoice] || LANE_CONFIGS[3]; }
function diffKey() { return LANE_KEY[laneChoice] || 'easy'; }
let laneCount = getLaneCfg().lanes;
function laneSpeedMult() { return laneCount >= 5 ? 1.2 : (laneCount === 4 ? 1.1 : 1.0); }
function diffScore(v) { return Math.round(v * getLaneCfg().scoreMult); }

// ROAD TYPES
const ROADS = [
  { id: 'highway', name: 'Highway', icon: '🛣️', bg: ['#040614', '#070b1f', '#02040d'], road: '#0b0f20', left: '#00ffff', right: '#ff007f', lane: 'rgba(128, 212, 255, 0.45)', laneGlow: '#80d4ff', star: '180, 220, 255', accent: '#00ffff', noDecor: true },
  { id: 'city', name: 'City', icon: '🏙️', bg: ['#040614', '#070b1f', '#02040d'], road: '#0b0f20', left: '#00ffff', right: '#ff007f', lane: 'rgba(128, 212, 255, 0.45)', laneGlow: '#80d4ff', star: '180, 220, 255', accent: '#00ffff' },
  { id: 'desert', name: 'Desert', icon: '🏜️', bg: ['#1a0d05', '#2a1408', '#0d0502'], road: '#1f1209', left: '#ffb347', right: '#ff5e00', lane: 'rgba(255, 200, 120, 0.45)', laneGlow: '#ffb347', star: '255, 220, 170', accent: '#ffb347' },
  { id: 'forest', name: 'Forest', icon: '🌲', bg: ['#020d06', '#04180b', '#010804'], road: '#0a1a10', left: '#39ff14', right: '#00ffa2', lane: 'rgba(130, 255, 150, 0.4)', laneGlow: '#7dff9a', star: '170, 255, 190', accent: '#39ff14' },
  { id: 'night', name: 'Night', icon: '🌃', bg: ['#01010a', '#03031a', '#000005'], road: '#080818', left: '#9d4edd', right: '#3d8bff', lane: 'rgba(170, 140, 255, 0.4)', laneGlow: '#b9a0ff', star: '200, 190, 255', accent: '#9d4edd' },
  { id: 'void', name: 'Void', icon: '🛸', bg: ['#0a0010', '#14001f', '#05000a'], road: '#0f0518', left: '#ff00ff', right: '#00ffcc', lane: 'rgba(255, 120, 255, 0.4)', laneGlow: '#ff78ff', star: '255, 150, 255', accent: '#ff00ff' }
];
let roadType = 'highway';
try { const sr = localStorage.getItem('neon_racer_road'); if (sr && ROADS.some(r => r.id === sr)) roadType = sr; } catch (e) {}
function getRoad() { return ROADS.find(r => r.id === roadType) || ROADS[0]; }

let roadDecor = [];
let ambientParticles = [];
const DECOR_PER_ROAD = 8;
const AMBIENT_CFG = {
  city:   { count: 6, color: 'rgba(150, 200, 255, 0.30)', size: [1.2, 2.6], vx: [-14, 14], vy: [-55, -20] },
  desert: { count: 10, color: 'rgba(255, 200, 120, 0.32)', size: [1, 2.4], vx: [-70, -25], vy: [-8, 16] },
  forest: { count: 8, color: 'rgba(180, 255, 130, 0.55)', size: [1.4, 2.6], vx: [-16, 16], vy: [-14, 14] },
  night:  { count: 12, color: 'rgba(200, 200, 255, 0.45)', size: [1, 2.2], vx: [-8, 8], vy: [-18, 18] },
  void:   { count: 15, color: 'rgba(255, 140, 255, 0.50)', size: [1.2, 3], vx: [-26, 26], vy: [-40, -10] }
};

function hashRand(seed, i) {
  const x = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function makeDecor(y) {
  if (roadType === 'highway' || !roadType) return null;
  const type = roadType;
  const margin = 4;
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const regionStart = side === 'left' ? margin : (roadX + roadW + margin);
  const regionEnd = side === 'left' ? (roadX - margin) : (screenWidth - margin);
  const regionW = regionEnd - regionStart;
  if (regionW < 8) return null;

  const seed = Math.random() * 1000;
  const d = { type: type, side: side, y: y, seed: seed, kind: 'building', w: 20, h: 40, cx: regionStart + regionW / 2 };

  if (type === 'city' || type === 'night') {
    d.kind = 'building';
    d.w = Math.max(20, Math.min(regionW * (0.6 + Math.random() * 0.35), 120));
    d.h = 80 + Math.random() * 160;
    d.cx = regionStart + Math.random() * Math.max(1, regionW - d.w) + d.w / 2;
  } else if (type === 'desert') {
    if (Math.random() < 0.42) {
      d.kind = 'cactus';
      d.w = Math.max(14, Math.min(regionW * 0.7, 30));
      d.h = 45 + Math.random() * 48;
      d.cx = regionStart + Math.random() * Math.max(1, regionW - d.w) + d.w / 2;
    } else {
      d.kind = 'dune';
      d.w = Math.max(24, regionW);
      d.h = 55 + Math.random() * 75;
      d.cx = regionStart + regionW / 2;
    }
  } else if (type === 'forest') {
    if (Math.random() < 0.74) {
      d.kind = 'tree';
      d.w = Math.max(18, Math.min(regionW * 0.95, 55));
      d.h = 70 + Math.random() * 85;
      d.cx = regionStart + Math.random() * Math.max(1, regionW - d.w) + d.w / 2;
    } else {
      d.kind = 'rock';
      d.w = Math.max(10, Math.min(regionW * 0.8, 26));
      d.h = 16 + Math.random() * 18;
      d.cx = regionStart + Math.random() * Math.max(1, regionW - d.w) + d.w / 2;
    }
  } else {
    d.kind = Math.random() < 0.7 ? 'asteroid' : 'planet';
    d.w = d.h = Math.max(18, Math.min(regionW * 0.9, 55));
    d.cx = regionStart + Math.random() * Math.max(1, regionW - d.w) + d.w / 2;
  }
  d.w = Math.min(d.w, regionW);
  d.cx = Math.max(regionStart + d.w / 2, Math.min(regionEnd - d.w / 2, d.cx));
  return d;
}

function initAmbient() {
  if (roadType === 'highway') { ambientParticles = []; return; }
  ambientParticles = [];
  const cfg = AMBIENT_CFG[roadType] || AMBIENT_CFG.city;
  for (let i = 0; i < cfg.count; i++) {
    ambientParticles.push({
      x: Math.random() * screenWidth,
      y: Math.random() * screenHeight,
      vx: cfg.vx[0] + Math.random() * (cfg.vx[1] - cfg.vx[0]),
      vy: cfg.vy[0] + Math.random() * (cfg.vy[1] - cfg.vy[0]),
      size: cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]),
      phase: Math.random() * Math.PI * 2,
      color: cfg.color
    });
  }
}

function initRoadDecor() {
  if (roadType === 'highway') { roadDecor = []; ambientParticles = []; return; }
  roadDecor = [];
  if (!screenWidth || !roadW) return;
  let attempts = 0;
  while (roadDecor.length < DECOR_PER_ROAD && attempts < DECOR_PER_ROAD * 5) {
    attempts++;
    const d = makeDecor(-Math.random() * (screenHeight + 220));
    if (d) roadDecor.push(d);
  }
  initAmbient();
}

function updateAmbient(dt) {
  for (let i = 0; i < ambientParticles.length; i++) {
    const p = ambientParticles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > screenHeight + 24) { p.y = -20; p.x = Math.random() * screenWidth; }
    if (p.y < -30) { p.y = screenHeight + 12; p.x = Math.random() * screenWidth; }
    if (p.x < -24) p.x = screenWidth + 12;
    if (p.x > screenWidth + 24) p.x = -12;
  }
}

function updateRoadDecor(dt, speed) {
  for (let i = roadDecor.length - 1; i >= 0; i--) {
    const d = roadDecor[i];
    d.y += speed * dt;
    if (d.y > screenHeight + 160) {
      const nd = makeDecor(-d.h - 60 - Math.random() * 240);
      if (nd) roadDecor[i] = nd; else roadDecor.splice(i, 1);
    }
  }
  updateAmbient(dt);
}

function drawDecorBuilding(d) {
  const x = d.cx - d.w / 2, y = d.y;
  const night = (d.type === 'night');
  const g = ctx.createLinearGradient(x, y, x + d.w, y + d.h);
  if (night) { g.addColorStop(0, '#0b0a1c'); g.addColorStop(1, '#04030d'); }
  else { g.addColorStop(0, '#141c38'); g.addColorStop(1, '#080c1c'); }
  ctx.fillStyle = g;
  ctx.fillRect(x, y, d.w, d.h);
  ctx.strokeStyle = night ? 'rgba(160,120,255,0.35)' : 'rgba(0,229,255,0.28)';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(x + 0.5, y + 0.5, d.w - 1, d.h - 1);
  if (hashRand(d.seed, 1) > 0.55) {
    ctx.fillStyle = night ? 'rgba(160,120,255,0.45)' : 'rgba(0,229,255,0.4)';
    ctx.fillRect(d.cx - 1, y - 10, 2, 10);
  }
  const cols = Math.max(2, Math.floor(d.w / 14));
  const rows = Math.max(2, Math.floor(d.h / 18));
  const padX = d.w * 0.12, padY = 9;
  const cw = (d.w - padX * 2) / cols, chh = (d.h - padY - 8) / rows;
  const wc = night ? ['#a06bff', '#00e5ff', '#ff66c4'] : ['#ffe600', '#00e5ff', '#39ff14'];
  const prevA = ctx.globalAlpha;
  ctx.globalAlpha = 0.7;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const hv = hashRand(d.seed, r * 17 + c * 5);
      if (hv < 0.42) continue;
      const wx = x + padX + c * cw + cw * 0.2;
      const wy = y + padY + r * chh + chh * 0.2;
      ctx.fillStyle = wc[Math.floor(hashRand(d.seed + 7, r * 3 + c) * wc.length) % wc.length];
      ctx.fillRect(wx, wy, cw * 0.6, chh * 0.55);
    }
  }
  ctx.globalAlpha = prevA;
}

function drawDecorTree(d) {
  const x = d.cx, y = d.y, w = d.w, h = d.h;
  ctx.save();
  ctx.fillStyle = '#3a2412';
  ctx.fillRect(x - w * 0.09, y + h * 0.70, w * 0.18, h * 0.30);
  for (let i = 0; i < 3; i++) {
    const topY = y + h * 0.58 * (i / 3);
    const baseY = topY + h * 0.46;
    const tw = w * (0.62 + i * 0.19);
    const g = ctx.createLinearGradient(x - tw / 2, topY, x + tw / 2, baseY);
    g.addColorStop(0, i === 0 ? '#12702f' : '#0d5a24');
    g.addColorStop(1, '#042d14');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, topY);
    ctx.lineTo(x - tw / 2, baseY);
    ctx.lineTo(x + tw / 2, baseY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawDecorDune(d) {
  const x0 = d.cx - d.w / 2, y = d.y, w = d.w, h = d.h;
  ctx.save();
  const g = ctx.createLinearGradient(x0, y, x0, y + h);
  g.addColorStop(0, 'rgba(122, 76, 34, 0.9)');
  g.addColorStop(1, 'rgba(58, 32, 12, 0.92)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0, y + h);
  ctx.quadraticCurveTo(x0 + w * 0.5, y - h * 0.35, x0 + w, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 179, 71, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x0, y + h);
  ctx.quadraticCurveTo(x0 + w * 0.5, y - h * 0.35, x0 + w, y + h);
  ctx.stroke();
  ctx.restore();
}

function drawDecorCactus(d) {
  const x = d.cx, y = d.y, w = d.w, h = d.h;
  ctx.save();
  ctx.fillStyle = '#1f6b34';
  ctx.strokeStyle = 'rgba(57,255,20,0.4)';
  ctx.lineWidth = 1;
  const stemW = w * 0.30, armW = w * 0.20;
  ctx.beginPath(); ctx.roundRect(x - stemW / 2, y, stemW, h, stemW / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x - w * 0.5, y + h * 0.22, armW, h * 0.44, armW / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x - w * 0.5, y + h * 0.22 + h * 0.44 - armW, w * 0.5, armW, armW / 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x + w * 0.5 - armW, y + h * 0.36, armW, h * 0.36, armW / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x, y + h * 0.36 + h * 0.36 - armW, w * 0.5, armW, armW / 2); ctx.fill();
  ctx.restore();
}

function drawDecorRock(d) {
  const x = d.cx, y = d.y + d.h / 2, rx = d.w / 2, ry = d.h / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(62, 58, 78, 0.9)';
  ctx.strokeStyle = 'rgba(140, 130, 170, 0.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  const n = 6;
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const rr = 0.75 + hashRand(d.seed, i) * 0.5;
    const px = x + Math.cos(ang) * rx * rr;
    const py = y + Math.sin(ang) * ry * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawDecorAsteroid(d) {
  const x = d.cx, cy = d.y + d.h / 2, r = d.w / 2;
  ctx.save();
  const g = ctx.createRadialGradient(x - r * 0.3, cy - r * 0.3, r * 0.15, x, cy, r);
  g.addColorStop(0, '#5b2a8a');
  g.addColorStop(1, '#1b0730');
  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(255, 120, 255, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const n = 9;
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const rr = 0.78 + hashRand(d.seed, i) * 0.42;
    const px = x + Math.cos(ang) * r * rr;
    const py = cy + Math.sin(ang) * r * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255, 160, 255, 0.18)';
  for (let i = 0; i < 3; i++) {
    const ang = hashRand(d.seed + 3, i) * Math.PI * 2;
    const rr = hashRand(d.seed + 9, i) * r * 0.5;
    ctx.beginPath();
    ctx.arc(x + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawDecorPlanet(d) {
  const x = d.cx, cy = d.y + d.h / 2, r = d.w / 2;
  ctx.save();
  const g = ctx.createRadialGradient(x - r * 0.35, cy - r * 0.35, r * 0.1, x, cy, r);
  g.addColorStop(0, '#ff9cf5');
  g.addColorStop(0.5, '#a03ce0');
  g.addColorStop(1, '#2a0a45');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, cy, r * 1.7, r * 0.42, -0.35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawAmbient() {
  if (!ambientParticles.length) return;
  ctx.save();
  ambientParticles.forEach(p => {
    ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(gameTime * 1.6 + p.phase));
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawRoadDecor() {
  ctx.save();
  for (let i = 0; i < roadDecor.length; i++) {
    const d = roadDecor[i];
    if (d.y > screenHeight + 170 || d.y + d.h < -170) continue;
    if (d.kind === 'building') drawDecorBuilding(d);
    else if (d.kind === 'tree') drawDecorTree(d);
    else if (d.kind === 'dune') drawDecorDune(d);
    else if (d.kind === 'cactus') drawDecorCactus(d);
    else if (d.kind === 'rock') drawDecorRock(d);
    else if (d.kind === 'asteroid') drawDecorAsteroid(d);
    else if (d.kind === 'planet') drawDecorPlanet(d);
  }
  ctx.restore();
  drawAmbient();
}

let upgrades = { speed: 0, fireRate: 0, hp: 0, shield: 0, engine: 0, tires: 0, nitrous: 0 };
try { const su = localStorage.getItem('neon_racer_upgrades'); if (su) upgrades = Object.assign(upgrades, JSON.parse(su)); } catch (e) {}
function saveUpgrades() { try { localStorage.setItem('neon_racer_upgrades', JSON.stringify(upgrades)); } catch (e) {} }
function upgradesMaxedCount() { return UPGRADE_KEYS.filter(k => (upgrades[k] || 0) >= UPGRADE_DEFS[k].max).length; }
function getMaxHP() { return 3 + (upgrades.hp || 0); }
function getRunMaxHP() { return gameMode === 'elimination' ? 1 : getMaxHP(); }
function getSpeedMult() { return 1 + (upgrades.speed || 0) * 0.08 + (upgrades.engine || 0) * 0.10; }
function getSteerSpeed() { return STEER_SPEEDS[sensitivity] * (1 + (upgrades.tires || 0) * 0.05) * laneSpeedMult(); }

// SCROLLABLE SCREENS (Garage & Upgrades, Mode, Achievements)
const UPG_STEP = 74;
const UPG_HEADER = 110;
const CONTENT_TOP = 158;
const ACH_TOP = 124, ACH_CARD_H = 54, ACH_STEP = 62;
const TAB_Y = 108, TAB_H = 40, TAB_GAP = 6;

let garScroll = 0, achScroll = 0, modScroll = 0, scrollTouch = null;
let garTab = 'skins', modeTab = 'mode';
const GAR_TABS = [{ id: 'skins', label: '🎨 CAR SKINS' }, { id: 'upgrades', label: '⚡ UPGRADES' }];
const MODE_TABS = [{ id: 'mode', label: '🎮 MODE' }, { id: 'lanes', label: '🛣️ LANES' }, { id: 'road', label: '🌍 ROAD' }];

function tabRects(n) {
  const totalW = screenWidth - 40;
  const w = (totalW - (n - 1) * TAB_GAP) / n;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: 20 + i * (w + TAB_GAP), y: TAB_Y, w: w, h: TAB_H });
  return out;
}

function isScrollState(s) { return s === STATE_GARAGE || s === STATE_ACHIEVEMENTS || s === STATE_MODE; }
function achLayout() {
  const dailyHeadY = ACH_TOP, dailyStart = ACH_TOP + 18;
  const permHeadY = dailyStart + 3 * ACH_STEP + 14, permStart = permHeadY + 18;
  return { dailyHeadY: dailyHeadY, dailyStart: dailyStart, permHeadY: permHeadY, permStart: permStart, bottom: permStart + ACHIEVEMENTS.length * ACH_STEP };
}
function garLayout() {
  const contentTop = CONTENT_TOP;
  const skinStep = 98, skinH = 82;
  const upgStep = 74, upgH = 64;
  const bottom = garTab === 'skins'
    ? contentTop + SKINS.length * skinStep + 12
    : contentTop + UPGRADE_KEYS.length * upgStep + 12;
  return { contentTop: contentTop, skinStep: skinStep, skinH: skinH, upgStep: upgStep, upgH: upgH, bottom: bottom };
}
function modeLayout() {
  const cardW = Math.min(screenWidth * 0.88, 380), x0 = screenWidth / 2 - cardW / 2;
  const contentTop = CONTENT_TOP;
  const modeStep = 90, modeH = 78;
  const laneH = 100, gap = 8, tw = (cardW - gap * 2) / 3;
  const roadH = 64, roadStep = 72;
  let bottom;
  if (modeTab === 'mode') bottom = contentTop + MODES.length * modeStep + 12;
  else if (modeTab === 'lanes') bottom = contentTop + laneH + 12;
  else bottom = contentTop + 2 * roadStep + roadH + 12;
  return { cardW: cardW, x0: x0, contentTop: contentTop, modeStep: modeStep, modeH: modeH,
    laneH: laneH, gap: gap, tw: tw, roadH: roadH, roadStep: roadStep, bottom: bottom };
}
function laneCardRect(i) {
  const M = modeLayout();
  return { x: M.x0 + i * (M.tw + M.gap), y: M.contentTop + modScroll, w: M.tw, h: M.laneH };
}
function roadCardRect(i) {
  const M = modeLayout();
  const row = i < 3 ? 0 : 1;
  const col = i < 3 ? i : i - 3;
  const inRow = 3;
  const rowW = inRow * M.tw + (inRow - 1) * M.gap;
  const rx = M.x0 + (M.cardW - rowW) / 2;
  return {
    x: rx + col * (M.tw + M.gap),
    y: M.contentTop + row * M.roadStep + modScroll,
    w: M.tw,
    h: M.roadH
  };
}
function scrollBottom(s) {
  if (s === STATE_GARAGE) return garLayout().bottom;
  if (s === STATE_ACHIEVEMENTS) return achLayout().bottom;
  if (s === STATE_MODE) return modeLayout().bottom;
  return 0;
}
function clampScroll(s, v) {
  const minS = Math.min(0, screenHeight - scrollBottom(s) - 12);
  return Math.max(minS, Math.min(0, v));
}
function getScroll(s) { return s === STATE_ACHIEVEMENTS ? achScroll : (s === STATE_MODE ? modScroll : garScroll); }
function setScroll(s, v) {
  v = clampScroll(s, v);

function updateWeather(dt, slowMotionFactor) {

// ROAD / LANE LAYOUT (depends on lane choice)
function applyLaneLayout() {
  const d = getLaneCfg();
  laneCount = d.lanes;

  const sideReserve = Math.min(Math.max(screenWidth * 0.14, 50), 150);
  const maxRoadW = screenWidth - sideReserve * 2;

  let desiredW;
  if (laneCount >= 5) desiredW = screenWidth * 0.94;
  else if (laneCount === 4) desiredW = screenWidth * 0.90;
  else desiredW = screenWidth * 0.85;

  roadW = Math.min(desiredW, maxRoadW);
  roadW = Math.max(roadW, Math.min(laneCount * 46, maxRoadW));

  roadX = (screenWidth - roadW) / 2;
  laneWidth = roadW / laneCount;
  
  player.width = Math.min(Math.max(laneWidth * 0.42, 34), 52);
  player.width = Math.min(player.width, laneWidth * 0.7);
  player.height = player.width * 1.85;
}
function clampPlayerToRoad() {
  const minX = roadX + player.width / 2 + 6, maxX = roadX + roadW - player.width / 2 - 6;
  if (player.x < minX) player.x = minX; else if (player.x > maxX) player.x = maxX;
}

function handleActionInput(cx, cy) {
  const midX = screenWidth / 2, midY = screenHeight / 2;
  if (tutorialActive) { handleTutorialClick(cx, cy); return; }
  if (rewardPopup && currentState === STATE_MENU) {
    if (Math.abs(cx - midX) <= 100 && Math.abs(cy - (midY + 105)) <= 26) claimDailyReward();
    return;
  }
  if (currentState === STATE_MENU) {
    const my = midY + menuShift();
    if (cx >= screenWidth - 62 && cy <= 62) { toggleSound(); return; }
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (my - 50)) <= 24) { startGame(); return; }
    if (Math.abs(cx - midX) <= menuBtnW(260) / 2 && Math.abs(cy - (my - 4)) <= 20) { currentState = STATE_GARAGE; garScroll = 0; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= menuBtnW(240) / 2 && Math.abs(cy - (my + 100)) <= 17) { currentState = STATE_MODE; modScroll = 0; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= menuBtnW(240) / 2 && Math.abs(cy - (my + 142)) <= 17) { initDailyAchievements(); currentState = STATE_ACHIEVEMENTS; achScroll = 0; soundPowerup(); return; }
    if (Math.abs(cx - midX) <= menuBtnW(240) / 2 && Math.abs(cy - (my + 184)) <= 17) { currentState = STATE_SETTINGS; soundPowerup(); return; }
  } else if (currentState === STATE_SETTINGS) {
    if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
    const sensKeys = ['slow', 'normal', 'fast'];
    sensKeys.forEach((k, i) => {
      const bx = midX + (i - 1) * 100;
      if (Math.abs(cx - bx) <= 46 && Math.abs(cy - 220) <= 19) { // FIXED: 160 -> 220
        sensitivity = k; try { localStorage.setItem('neon_racer_sensitivity', k); } catch (e) {} soundCoin();
      }
    });
    [[332, 'music'], [442, 'sfx']].forEach(row => { // FIXED: 272 -> 332, 382 -> 442
      const ry = row[0];
      if (Math.abs(cy - ry) <= 22) {
        let d = 0;
        if (Math.abs(cx - (midX - 90)) <= 26) d = -10; else if (Math.abs(cx - (midX + 90)) <= 26) d = 10;
        if (d !== 0) {
          if (row[1] === 'music') { musicVolPct = Math.min(100, Math.max(0, musicVolPct + d)); try { localStorage.setItem('neon_racer_music_vol', String(musicVolPct)); } catch (e) {} }
          else { sfxVolPct = Math.min(100, Math.max(0, sfxVolPct + d)); try { localStorage.setItem('neon_racer_sfx_vol', String(sfxVolPct)); } catch (e) {} soundCoin(); }
        }
      }
    });
    // GYRO TOGGLE
    if (Math.abs(cx - midX) <= 120 && Math.abs(cy - 448) <= 22) {
      toggleGyro();
      return;
    }
    if (Math.abs(cx - midX) <= 105 && Math.abs(cy - 510) <= 19) { // FIXED: 500 -> 510
      tutorialDone = false;
      try { localStorage.removeItem('neon_racer_tutorial_done'); } catch (e) {}
      soundCoin();
      showToast('Tutorial will show next game', '#00ffff');
      return;
    }
  } else if (currentState === STATE_MODE) {
    const tabs = tabRects(MODE_TABS.length);
    for (let i = 0; i < MODE_TABS.length; i++) {
      const r = tabs[i];
      if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
        if (modeTab !== MODE_TABS[i].id) { modeTab = MODE_TABS[i].id; modScroll = 0; soundCoin(); }
        return;
      }

    if (Math.abs(cx - midX) <= 58 && Math.abs(cy - 86) <= 17) { currentState = STATE_MENU; soundCoin(); return; }
    if (cy < CONTENT_TOP) return;
    const M = modeLayout();
    if (modeTab === 'mode') {

        const cardY = M.contentTop + idx * M.modeStep + modScroll;
        if (cx >= M.x0 && cx <= M.x0 + M.cardW && cy >= cardY && cy <= cardY + M.modeH) {
          gameMode = m.id; try { localStorage.setItem('neon_racer_mode', gameMode); } catch (e) {} soundCoin();
        }
      });
    } else if (modeTab === 'lanes') {
      [3, 4, 5].forEach((n, i) => {
        const r = laneCardRect(i);
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) setLanes(n);
      });
    } else {
      ROADS.forEach((rd, i) => {
        const r = roadCardRect(i);
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) setRoad(rd.id);
      });
    }
  } else if (currentState === STATE_PAUSED) {
    const btnW = 200, btnH = 46, resY = midY - 15, rstY = resY + 62, quitY = rstY + 62;
    if (Math.abs(cx - midX) <= btnW / 2) {
      if (Math.abs(cy - resY) <= btnH / 2) { resumeGame(); return; }
      if (Math.abs(cy - rstY) <= btnH / 2) { startGame(); return; }
      if (Math.abs(cy - quitY) <= btnH / 2) { returnToMainMenu(); return; }

    const G = garLayout();

        const cardY = G.contentTop + idx * G.skinStep + garScroll, cardX = midX - skinW / 2;
        if (cx >= cardX && cx <= cardX + skinW && cy >= cardY && cy <= cardY + G.skinH) {

          else soundPlayerHit();

    } else {
      const upgW = Math.min(screenWidth * 0.90, 390);
      UPGRADE_KEYS.forEach((key, idx) => {
        const def = UPGRADE_DEFS[key], cardY = G.contentTop + idx * G.upgStep + garScroll, cardX = midX - upgW / 2, cur = upgrades[key] || 0;
        const btnW = 92, btnH = 36, bx = cardX + upgW - btnW - 12, by = cardY + (G.upgH - btnH) / 2;
        if (cx >= bx && cx <= bx + btnW && cy >= by && cy <= by + btnH) {

  } else if (currentState === STATE_ACHIEVEMENTS) {
    if (Math.abs(cx - midX) <= 58 && Math.abs(cy - 86) <= 17) { returnToMainMenu(); return; }
  } else if (currentState === STATE_GAMEOVER) {
    if (performance.now() - gameOverTimestamp >= 400) {
      if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (midY + 174)) <= 26) { returnToMainMenu(); return; }
      if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (midY + 116)) <= 26) { startGame(); return; }

    }
  }
}

function triggerGameOver() {
  flushCoins();
  const timeUp = gameOverReason === 'time';
  currentState = STATE_GAMEOVER; gameOverTimestamp = performance.now(); resetSteering();
  stopEngineSound();
  if (timeUp) soundMissionComplete(); else soundCrash();

  trackRunStats();
  if (timeUp && gameMode === 'timetrial') dailyMax('tt', score);

  const prevBest = bestDiffBeforeRun;
  const diff = prevBest - score;
  if (prevBest === 0) {
    gameOverHookMain = '🏁 FIRST RUN! Set a new record!';
  } else if (score > prevBest) {
    if (score - prevBest < 100) {

    } else {
      gameOverHookMain = '🎉 NEW HIGH SCORE!';
    }
  } else if (diff <= 100) {

    gameOverHookMain = '💪 You were ' + diff + ' points from your best!';
  } else if (diff <= 2000) {
