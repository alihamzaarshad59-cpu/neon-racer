<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Racer</title>
  <meta name="theme-color" content="#00ffff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050714; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
    #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #050714; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
  'use strict';
  (function () {
    // AUDIO SYNTHESIZER
    let audioCtx = null, soundEnabled = true;
    try { const s = localStorage.getItem('neon_racer_sound'); if (s !== null) soundEnabled = (s === 'true'); } catch (e) {}

    // AUDIO VOLUMES (0-100, default 100)
    function loadPct(key, def) {
      try { const v = localStorage.getItem(key); if (v !== null) { const n = parseInt(v, 10); if (!isNaN(n)) return Math.min(100, Math.max(0, n)); } } catch (e) {}
      return def;
    }
    let musicVolPct = loadPct('neon_racer_music_vol', 100), sfxVolPct = loadPct('neon_racer_sfx_vol', 100);
    function sfxVol() { return sfxVolPct / 100; }
    function musicVol() { return musicVolPct / 100; }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem('neon_racer_sound', soundEnabled ? 'true' : 'false'); } catch (e) {}
      if (soundEnabled) soundCoin();
    }
    function initAudio() {
      if (!soundEnabled) return;
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, dur, gStart, gEnd, endFreq) {
      if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
      try {
        const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain(), v = sfxVol();
        osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, now);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), now + dur);
        g.gain.setValueAtTime(Math.max((gStart !== undefined ? gStart : 0.15) * v, 0.0002), now);
        g.gain.exponentialRampToValueAtTime(Math.max((gEnd !== undefined ? gEnd : 0.001) * v, 0.0001), now + dur);
        osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
      } catch (e) {}
    }
    // BACKGROUND MUSIC (simple synth bass + arp loop, scaled by music volume)
    const MUSIC_BASS = [55, 55, 82.41, 55, 65.41, 65.41, 98, 65.41];
    let musicTimer = 0, musicStep = 0;
    function musicNote(freq, type, dur, gain) {
      try {
        const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(Math.max(gain * musicVol(), 0.0002), now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now + dur);
      } catch (e) {}
    }
    function updateMusic(dt) {
      if (!soundEnabled || !audioCtx || musicVol() <= 0) return;
      musicTimer -= dt;
      if (musicTimer > 0) return;
      musicTimer = 0.24;
      const f = MUSIC_BASS[musicStep % 8];
      musicNote(f * 2, 'triangle', 0.22, 0.09);
      if (musicStep % 2 === 1) musicNote(f * 8, 'square', 0.12, 0.022);
      musicStep++;
    }
    function soundPlayerShoot() { playTone(880, 'square', 0.08, 0.08, 0.001, 220); }
    function soundEnemyShoot() { playTone(320, 'sawtooth', 0.1, 0.06, 0.001, 110); }
    function soundBossShoot() { playTone(260, 'sawtooth', 0.18, 0.12, 0.001, 70); }
    function soundLightning() { playTone(650, 'sawtooth', 0.28, 0.28, 0.001, 80); }
    function soundEnemyExplosion() { playTone(240, 'triangle', 0.15, 0.2, 0.001, 40); }
    function soundBossExplosion() { playTone(180, 'sawtooth', 0.85, 0.4, 0.001, 20); }
    function soundFreeze() { playTone(950, 'sine', 0.18, 0.18, 0.01, 1300); }
    function soundNitro() { playTone(200, 'sawtooth', 0.5, 0.25, 0.001, 900); }
    function soundPlayerHit() {
      try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
      playTone(140, 'sawtooth', 0.2, 0.25, 0.001, 45);
    }
    function soundPowerup() {
      if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
      const now = audioCtx.currentTime, v = sfxVol();
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        try {
          const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.05);
          g.gain.setValueAtTime(Math.max(0.12 * v, 0.0002), now + i * 0.05); g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.12);
          osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.12);
        } catch (e) {}
      });
    }
    function soundMissionComplete() {
      if (!soundEnabled || !audioCtx || sfxVol() <= 0) return;
      const now = audioCtx.currentTime, v = sfxVol();
      [440, 554.37, 659.25, 880].forEach((f, i) => {
        try {
          const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.08);
          g.gain.setValueAtTime(Math.max(0.15 * v, 0.0002), now + i * 0.08); g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.2);
          osc.connect(g); g.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.2);
        } catch (e) {}
      });
    }
    function soundCoin() {
      playTone(987.77, 'square', 0.08, 0.12, 0.001);
      setTimeout(() => playTone(1318.51, 'square', 0.14, 0.15, 0.001), 70);
    }
    function soundCrash() {
      try { if (navigator.vibrate) navigator.vibrate([120, 50, 250]); } catch (e) {}
      playTone(160, 'sawtooth', 0.5, 0.35, 0.001, 25);
    }
    function soundStart() { playTone(523.25, 'triangle', 0.12, 0.15, 0.001); setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.18, 0.001), 90); }

    // STATES
    const STATE_MENU = 0, STATE_PLAYING = 1, STATE_GAMEOVER = 2, STATE_GARAGE = 3, STATE_UPGRADES = 4, STATE_PAUSED = 5, STATE_ACHIEVEMENTS = 6, STATE_SETTINGS = 7, STATE_MODE = 8;
    let currentState = STATE_MENU, gameOverTimestamp = 0, gameOverReason = 'crash';

    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let screenWidth = 0, screenHeight = 0, dpr = 1, roadX = 0, roadW = 0, laneWidth = 0, roadScrollOffset = 0;
    let currentSpeed = 420, distanceTraveled = 0, score = 0, bestScore = 0, coinsCollected = 0, gameTime = 0;

    // TOAST (feedback on menu screens)
    let toastText = '', toastColor = '#39ff14', toastTimer = 0;
    function showToast(text, color) { toastText = text; toastColor = color || '#39ff14'; toastTimer = 2.2; }

    // SETTINGS: STEERING SENSITIVITY
    const STEER_SPEEDS = { slow: 500, normal: 640, fast: 800 };
    let sensitivity = 'normal';
    try { const sv = localStorage.getItem('neon_racer_sensitivity'); if (sv && STEER_SPEEDS[sv]) sensitivity = sv; } catch (e) {}

    // RACING MODES
    const MODES = [
      { id: 'classic', name: 'CLASSIC', icon: '🏁', color: '#00ffff', desc: 'Normal gameplay - all features' },
      { id: 'timetrial', name: 'TIME TRIAL', icon: '⏱️', color: '#ffe600', desc: 'Survive 30 seconds - highest score wins' },
      { id: 'elimination', name: 'ELIMINATION', icon: '💀', color: '#ff0055', desc: 'Deadly traffic - 1 hit = death - 2x score' },
      { id: 'drift', name: 'DRIFT', icon: '🌪️', color: '#b026ff', desc: 'No shooting - +5/s steering, +10/s combo' }
    ];
    const TIME_TRIAL_DURATION = 30;
    let gameMode = 'classic';
    try { const sm = localStorage.getItem('neon_racer_mode'); if (sm && MODES.some(m => m.id === sm)) gameMode = sm; } catch (e) {}
    function getMode() { return MODES.find(m => m.id === gameMode) || MODES[0]; }
    let driftScore = 0, driftStreak = 0, driftCombo = false, driftActive = false;

    // CURRENCY & UPGRADES
    let totalCoins = 0;
    try { totalCoins = parseInt(localStorage.getItem('neon_racer_coins') || '0', 10) || 0; } catch (e) {}
    function saveCoins() { try { localStorage.setItem('neon_racer_coins', totalCoins.toString()); } catch (e) {} }

    const UPGRADE_DEFS = {
      speed: { id: 'speed', name: 'TOP SPEED', icon: '⚡', max: 5, costs: [100, 250, 500, 1000, 2000], desc: '+8% Base Speed per level' },
      fireRate: { id: 'fireRate', name: 'FIRE RATE', icon: '🔫', max: 5, costs: [100, 250, 500, 1000, 2000], desc: '-5% Fire Interval per level' },
      hp: { id: 'hp', name: 'MAX HEALTH', icon: '❤️', max: 3, costs: [500, 1500, 3000], desc: '+1 Heart per level (Max 6)' },
      shield: { id: 'shield', name: 'SHIELD DURATION', icon: '🛡️', max: 3, costs: [300, 800, 1500], desc: '+2 Sec duration per level' },
      engine: { id: 'engine', name: 'ENGINE', icon: '🏎️', max: 5, costs: [200, 500, 1000, 2000, 4000], desc: '+10% Top Speed per level' },
      tires: { id: 'tires', name: 'TIRES', icon: '🌀', max: 5, costs: [150, 400, 800, 1500, 3000], desc: '+5% Steering per level' },
      nitrous: { id: 'nitrous', name: 'NITROUS', icon: '🔥', max: 3, costs: [500, 1500, 3000], desc: '+2s Nitro Boost per level' }
    };
    const UPGRADE_KEYS = ['speed', 'fireRate', 'hp', 'shield', 'engine', 'tires', 'nitrous'];
    let upgrades = { speed: 0, fireRate: 0, hp: 0, shield: 0, engine: 0, tires: 0, nitrous: 0 };
    try { const su = localStorage.getItem('neon_racer_upgrades'); if (su) upgrades = Object.assign(upgrades, JSON.parse(su)); } catch (e) {}
    function saveUpgrades() { try { localStorage.setItem('neon_racer_upgrades', JSON.stringify(upgrades)); } catch (e) {} }
    function getMaxHP() { return 3 + (upgrades.hp || 0); }
    function getRunMaxHP() { return gameMode === 'elimination' ? 1 : getMaxHP(); }
    function getSpeedMult() { return 1 + (upgrades.speed || 0) * 0.08 + (upgrades.engine || 0) * 0.10; }
    function getSteerSpeed() { return STEER_SPEEDS[sensitivity] * (1 + (upgrades.tires || 0) * 0.05); }

    // UPGRADES SCREEN SCROLLING
    const UPG_STEP = 74, UPG_START = 98, UPG_HEADER = 84;
    let upgScroll = 0, scrollTouch = null;
    function clampUpgScroll(v) {
      const contentBottom = UPG_START + UPGRADE_KEYS.length * UPG_STEP, minS = Math.min(0, screenHeight - contentBottom - 12);
      return Math.max(minS, Math.min(0, v));
    }

    // NITROUS BOOST
    let nitroTimer = 0, nitroCooldown = 0, nitroDuration = 3;
    function nitroBtn() { return { x: screenWidth - 50, y: screenHeight - 66, r: 34 }; }
    function inNitroBtn(x, y) { const b = nitroBtn(); return Math.hypot(x - b.x, y - b.y) <= b.r + 6; }
    function activateNitro() {
      if (currentState !== STATE_PLAYING || nitroTimer > 0 || nitroCooldown > 0) return;
      nitroDuration = 3 + (upgrades.nitrous || 0) * 2; nitroTimer = nitroDuration;
      soundNitro();
      floatingTexts.push({ text: '🔥 NITRO BOOST!', x: player.x, y: player.y - 50, vy: 50, alpha: 1, decay: 1.8, color: '#00ffff' });
    }

    // COMBO
    let comboKills = 0, lastComboTier = 1;
    function getComboMultiplier() {
      if (comboKills >= 50) return 10;
      if (comboKills >= 30) return 5;
      if (comboKills >= 20) return 3;
      if (comboKills >= 10) return 2;
      return 1;
    }
    function getComboColor(tier) {
      if (tier >= 10) return getRainbowColor();
      if (tier >= 5) return '#ff0055';
      if (tier >= 3) return '#ff7700';
      if (tier >= 2) return '#ffd700';
      return '#00ffff';
    }
    function checkComboTierUp() {
      const mult = getComboMultiplier();
      if (mult > (lifetimeStats.highestCombo || 0)) { lifetimeStats.highestCombo = mult; saveStats(); }
      if (mult > lastComboTier) {
        soundPowerup();
        floatingTexts.push({ text: 'COMBO x' + mult + '!', x: screenWidth / 2, y: screenHeight * 0.24, vy: 45, alpha: 1, decay: 2.0, color: getComboColor(mult) });
      }
      lastComboTier = mult;
      checkAchievements();
    }

    // GHOST RACING
    let ghostEnabled = true;
    try { const sge = localStorage.getItem('neon_racer_ghost_enabled'); if (sge !== null) ghostEnabled = (sge === 'true'); } catch (e) {}
    let currentGhost = null, recordedGhostPositions = [], nextGhostSampleTimer = 0;
    try { const gd = localStorage.getItem('neon_racer_ghost'); if (gd) currentGhost = JSON.parse(gd); } catch (e) {}

    function getGhostStateAtTime(t) {
      if (!currentGhost || !currentGhost.positions || !currentGhost.positions.length || t > currentGhost.duration) return null;
      const pts = currentGhost.positions;
      if (t <= pts[0].time) return pts[0];
      if (t >= pts[pts.length - 1].time) return pts[pts.length - 1];
      let low = 0, high = pts.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (pts[mid].time < t) low = mid + 1; else high = mid - 1;
      }
      const i = Math.max(1, low), p0 = pts[i - 1], p1 = pts[i] || p0, span = p1.time - p0.time;
      const r = span > 0 ? (t - p0.time) / span : 0;
      return { x: p0.x + (p1.x - p0.x) * r, y: p0.y + (p1.y - p0.y) * r, score: Math.floor(p0.score + ((p1.score || p0.score) - p0.score) * r) };
    }

    // STATS & ACHIEVEMENTS
    let lifetimeStats = { totalGames: 0, totalEnemies: 0, totalCoins: 0, bestScore: 0, bossesDefeated: 0, highestCombo: 0 };
    try {
      const ss = localStorage.getItem('neon_racer_stats');
      if (ss) lifetimeStats = Object.assign(lifetimeStats, JSON.parse(ss));
      bestScore = lifetimeStats.bestScore || 0;
    } catch (e) {}
    function saveStats() {
      try {
        if (score > lifetimeStats.bestScore) lifetimeStats.bestScore = score;
        bestScore = lifetimeStats.bestScore;
        localStorage.setItem('neon_racer_stats', JSON.stringify(lifetimeStats));
        localStorage.setItem('neon_racer_high_score', bestScore.toString());
      } catch (e) {}
    }

    // ACHIEVEMENTS
    const ACHIEVEMENTS = [
      { id: 'first_run', name: 'First Run', desc: 'Play your first game' },
      { id: 'score_1000', name: 'Neon Rookie', desc: 'Reach 1,000 score' },
      { id: 'score_5000', name: 'Cyber Cruiser', desc: 'Reach 5,000 score' },
      { id: 'score_10000', name: 'Highway Legend', desc: 'Reach 10,000 score' },
      { id: 'kill_100', name: 'Bounty Hunter', desc: 'Destroy 100 enemies (lifetime)' },
      { id: 'kill_500', name: 'Road Annihilator', desc: 'Destroy 500 enemies (lifetime)' },
      { id: 'boss_slayer', name: 'Boss Slayer', desc: 'Defeat 5 bosses (lifetime)' },
      { id: 'coin_100', name: 'Pocket Change', desc: 'Collect 100 coins (lifetime)' },
      { id: 'coin_500', name: 'Crypto Baron', desc: 'Collect 500 coins (lifetime)' },
      { id: 'combo_5x', name: 'Combo Master', desc: 'Reach 5x combo in one run' },
      { id: 'combo_10x', name: 'Ultra Combo', desc: 'Reach 10x combo in one run' },
      { id: 'skin_all', name: 'Full Collection', desc: 'Unlock all 4 car skins' }
    ];
    let unlockedAchievements = {};
    try {
      const sa = localStorage.getItem('neon_racer_achievements');
      if (sa) {
        const p = JSON.parse(sa);
        if (Array.isArray(p)) p.forEach(k => unlockedAchievements[k] = 'Unlocked');
        else if (typeof p === 'object') unlockedAchievements = p;
      }
    } catch (e) {}

    function unlockAchievement(id) {
      if (unlockedAchievements[id]) return;
      const ach = ACHIEVEMENTS.find(a => a.id === id);
      if (!ach) return;
      const d = new Date(), ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      unlockedAchievements[id] = ds;
      try { localStorage.setItem('neon_racer_achievements', JSON.stringify(unlockedAchievements)); } catch (e) {}
      totalCoins += 100;
      saveCoins();
      soundMissionComplete();
      floatingTexts.push({ text: `🏆 ACHIEVEMENT: ${ach.name.toUpperCase()}! (+100🪙)`, x: screenWidth / 2, y: screenHeight * 0.28, vy: 50, alpha: 1, decay: 2.5, color: '#ffd700' });
      for (let p = 0; p < 25; p++) {
        const ang = Math.random() * Math.PI * 2, spd = Math.random() * 200 + 40;
        particles.push({ x: screenWidth / 2, y: screenHeight * 0.28, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: 3.5, color: '#ffd700', alpha: 1, decay: 2 });
      }
    }

    function checkAchievements() {
      const eff = Math.max(score, bestScore);
      if (lifetimeStats.totalGames >= 1) unlockAchievement('first_run');
      if (eff >= 1000) unlockAchievement('score_1000');
      if (eff >= 5000) unlockAchievement('score_5000');
      if (eff >= 10000) unlockAchievement('score_10000');
      if ((lifetimeStats.totalEnemies || 0) >= 100) unlockAchievement('kill_100');
      if ((lifetimeStats.totalEnemies || 0) >= 500) unlockAchievement('kill_500');
      if ((lifetimeStats.bossesDefeated || 0) >= 5) unlockAchievement('boss_slayer');
      if ((lifetimeStats.totalCoins || 0) >= 100) unlockAchievement('coin_100');
      if ((lifetimeStats.totalCoins || 0) >= 500) unlockAchievement('coin_500');
      if (getComboMultiplier() >= 5 || (lifetimeStats.highestCombo || 0) >= 5) unlockAchievement('combo_5x');
      if (getComboMultiplier() >= 10 || (lifetimeStats.highestCombo || 0) >= 10) unlockAchievement('combo_10x');
      if (unlockedSkinIds.length >= 4) unlockAchievement('skin_all');
    }

    // DAILY CHALLENGE
    const DAILY_CHALLENGES = [
      { id: 0, text: 'Destroy 30 enemies in one run', target: 30, type: 'enemies' },
      { id: 1, text: 'Survive 90 seconds', target: 90, type: 'time' },
      { id: 2, text: 'Reach 5000 score', target: 5000, type: 'score' },
      { id: 3, text: 'Collect 25 coins in one run', target: 25, type: 'coins' },
      { id: 4, text: 'Defeat a boss', target: 1, type: 'boss' }
    ];
    function getTodayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    let dailyDate = getTodayStr(), dailyProgress = 0, dailyCompleted = false;
    function initDailyChallenge() {
      const today = getTodayStr();
      try {
        const sd = localStorage.getItem('neon_racer_daily_date');
        if (sd !== today) { dailyDate = today; dailyProgress = 0; dailyCompleted = false; saveDailyChallenge(); }
        else {
          dailyDate = sd;
          dailyProgress = parseInt(localStorage.getItem('neon_racer_daily_progress') || '0', 10);
          dailyCompleted = localStorage.getItem('neon_racer_daily_completed') === 'true';
        }
      } catch (e) { dailyDate = today; }
    }
    function saveDailyChallenge() {
      try {
        localStorage.setItem('neon_racer_daily_date', dailyDate);
        localStorage.setItem('neon_racer_daily_progress', dailyProgress.toString());
        localStorage.setItem('neon_racer_daily_completed', dailyCompleted ? 'true' : 'false');
      } catch (e) {}
    }
    function getCurrentDailyChallenge() {
      const d = new Date(dailyDate || getTodayStr()), idx = Math.abs(Math.floor(d.getTime() / 86400000)) % DAILY_CHALLENGES.length;
      return DAILY_CHALLENGES[idx];
    }
    function checkDailyProgress(runE, runT, runS, runC, bossKilled) {
      if (dailyCompleted) return;
      const ch = getCurrentDailyChallenge();
      let v = dailyProgress;
      if (ch.type === 'enemies') v = Math.max(v, runE);
      else if (ch.type === 'time') v = Math.max(v, Math.floor(runT));
      else if (ch.type === 'score') v = Math.max(v, runS);
      else if (ch.type === 'coins') v = Math.max(v, runC);
      else if (ch.type === 'boss' && bossKilled) v = 1;
      if (v !== dailyProgress) { dailyProgress = v; saveDailyChallenge(); }
      if (dailyProgress >= ch.target && !dailyCompleted) {
        dailyCompleted = true; totalCoins += 500; saveCoins(); saveDailyChallenge();
        soundMissionComplete();
        floatingTexts.push({ text: 'DAILY CHALLENGE COMPLETE! +500 🪙', x: screenWidth / 2, y: screenHeight * 0.32, vy: 55, alpha: 1, decay: 2.2, color: '#39ff14' });
      }
    }
    initDailyChallenge();

    // CAR SKINS
    const SKINS = [
      { id: 'cyan', name: 'Neon Cyan', reqScore: 0, reqDesc: 'Default', bodyTop: '#0a2133', bodyMid: '#05111d', bodyBot: '#02070c', glow: '#00ffff', trail: '#00ffff', accent: '#00e5ff' },
      { id: 'magenta', name: 'Magenta Ghost', reqScore: 3000, reqDesc: 'Reach 3,000 Score', bodyTop: '#300826', bodyMid: '#1a0415', bodyBot: '#0d010b', glow: '#ff007f', trail: '#ff007f', accent: '#ff66c4' },
      { id: 'gold', name: 'Golden Legend', reqScore: 8000, reqDesc: 'Reach 8,000 Score', bodyTop: '#3b2f0a', bodyMid: '#241b05', bodyBot: '#120d02', glow: '#ffd700', trail: '#ffe600', accent: '#fff380' },
      { id: 'rainbow', name: 'Rainbow Prism', reqScore: 20000, reqDesc: 'Reach 20,000 Score', bodyTop: '#101030', bodyMid: '#0a0a20', bodyBot: '#050512', glow: 'rainbow', trail: 'rainbow', accent: '#ffffff' }
    ];
    let unlockedSkinIds = ['cyan'], selectedSkinId = 'cyan';
    try {
      const su = localStorage.getItem('neon_racer_unlocked_skins');
      if (su) { unlockedSkinIds = JSON.parse(su); if (!unlockedSkinIds.includes('cyan')) unlockedSkinIds.push('cyan'); }
      const ss = localStorage.getItem('neon_racer_selected_skin');
      if (ss) selectedSkinId = ss;
    } catch (e) {}

    function checkSkinUnlocks() {
      let nu = false, eff = Math.max(bestScore, score);
      SKINS.forEach(sk => {
        if (!unlockedSkinIds.includes(sk.id) && eff >= sk.reqScore) {
          unlockedSkinIds.push(sk.id); nu = true;

    // COMBAT & ENTITIES
    let playerHP = 3, playerShootTimer = 0, rapidFireTimer = 0, shieldTimer = 0, screenDamageFlash = 0, screenDamageFlashColor = 'rgba(255, 0, 50, 0.4)';

    function resize() {

    function resetSteering() { keyLeft = false; keyRight = false; activeTouches.clear(); }

    window.addEventListener('keydown', e => {

    function handleActionInput(cx, cy) {
      const midX = screenWidth / 2, midY = screenHeight / 2;

      if (rewardPopup && currentState === STATE_MENU) {
        if (Math.abs(cx - midX) <= 100 && Math.abs(cy - (midY + 105)) <= 26) claimDailyReward();

        if (cx >= screenWidth - 62 && cy <= 62) { toggleSound(); return; }

        if (Math.abs(cx - midX) <= 110 && Math.abs(cy - (midY + 170)) <= 18) { currentState = STATE_ACHIEVEMENTS; soundPowerup(); return; }

        const grY = midY + 246;
        if (cy >= grY - 16 && cy <= grY + 16) {
          if (cx >= midX - 105 && cx <= midX - 10) { ghostEnabled = !ghostEnabled; try { localStorage.setItem('neon_racer_ghost_enabled', ghostEnabled ? 'true' : 'false'); } catch (e) {} soundCoin(); return; }
          if (cx >= midX + 10 && cx <= midX + 105) { currentGhost = null; try { localStorage.removeItem('neon_racer_ghost'); } catch (e) {} soundEnemyExplosion(); showToast('GHOST CLEARED', '#ff0055'); return; }
        }
      } else if (currentState === STATE_SETTINGS) {
        if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
        const sensKeys = ['slow', 'normal', 'fast'];
        sensKeys.forEach((k, i) => {
          const bx = midX + (i - 1) * 100;
          if (Math.abs(cx - bx) <= 46 && Math.abs(cy - 160) <= 19) {
            sensitivity = k; try { localStorage.setItem('neon_racer_sensitivity', k); } catch (e) {} soundCoin();
          }
        });
        [[272, 'music'], [382, 'sfx']].forEach(row => {
          const ry = row[0];
          if (Math.abs(cy - ry) <= 22) {
            let d = 0;
            if (Math.abs(cx - (midX - 90)) <= 26) d = -10; else if (Math.abs(cx - (midX + 90)) <= 26) d = 10;
            if (d !== 0) {
              if (row[1] === 'music') { musicVolPct = Math.min(100, Math.max(0, musicVolPct + d)); try { localStorage.setItem('neon_racer_music_vol', String(musicVolPct)); } catch (e) {} }
              else { sfxVolPct = Math.min(100, Math.max(0, sfxVolPct + d)); try { localStorage.setItem('neon_racer_sfx_vol', String(sfxVolPct)); } catch (e) {} soundCoin(); }
            }
          }
        });
      } else if (currentState === STATE_MODE) {
        if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
        const cardW = Math.min(screenWidth * 0.88, 380), cardH = 78, startY = 100;
        MODES.forEach((m, idx) => {
          const cardY = startY + idx * 90, cardX = midX - cardW / 2;

          }
        });
      } else if (currentState === STATE_PAUSED) {
        const btnW = 200, btnH = 46, resY = midY - 15, rstY = resY + 62, quitY = rstY + 62;
        if (Math.abs(cx - midX) <= btnW / 2) {
          if (Math.abs(cy - resY) <= btnH / 2) { resumeGame(); return; }
          if (Math.abs(cy - rstY) <= btnH / 2) { startGame(); return; }
          if (Math.abs(cy - quitY) <= btnH / 2) { returnToMainMenu(); return; }
        }
      } else if (currentState === STATE_GARAGE) {
        if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
        const cardW = Math.min(screenWidth * 0.88, 380), cardH = 82, startY = 95;
        SKINS.forEach((skin, idx) => {
          const cardY = startY + idx * 98, cardX = midX - cardW / 2;
          if (cx >= cardX && cx <= cardX + cardW && cy >= cardY && cy <= cardY + cardH) {
            if (unlockedSkinIds.includes(skin.id)) { selectedSkinId = skin.id; try { localStorage.setItem('neon_racer_selected_skin', selectedSkinId); } catch (e) {} soundCoin(); }

      } else if (currentState === STATE_UPGRADES) {
        if (cx >= 16 && cx <= 110 && cy >= 20 && cy <= 68) { currentState = STATE_MENU; soundCoin(); return; }
        if (cy < UPG_HEADER) return;
        const cardW = Math.min(screenWidth * 0.90, 390), cardH = 64;
        UPGRADE_KEYS.forEach((key, idx) => {
          const def = UPGRADE_DEFS[key], cardY = UPG_START + idx * UPG_STEP + upgScroll, cardX = midX - cardW / 2, cur = upgrades[key] || 0;
          const btnW = 92, btnH = 36, bx = cardX + cardW - btnW - 12, by = cardY + (cardH - btnH) / 2;
          if (cx >= bx && cx <= bx + btnW && cy >= by && cy <= by + btnH) {
            if (cur < def.max) {

              if (totalCoins >= cost) {

                showToast('+ ' + def.name + ' LV ' + upgrades[key], '#39ff14');
              } else { soundPlayerHit(); showToast('NEED ' + (cost - totalCoins) + ' MORE COINS!', '#ff0055'); }
            }

          if (Math.abs(cx - midX) <= 105 && Math.abs(cy - (midY + 108)) <= 26) { startGame(); return; }

    }

    function startGame() {
      initDailyChallenge(); currentState = STATE_PLAYING;
      score = 0; distanceTraveled = 0; coinsCollected = 0; gameTime = 0; gameOverReason = 'crash';
      currentSpeed = 420 * getSpeedMult();
      playerHP = getRunMaxHP(); rapidFireTimer = 0; shieldTimer = 0; screenDamageFlash = 0; playerShootTimer = 0; playerFrozenTimer = 0;
      nitroTimer = 0; nitroCooldown = 0; driftScore = 0; driftStreak = 0; driftCombo = false; driftActive = false; musicTimer = 0;
      comboKills = 0; lastComboTier = 1; recordedGhostPositions = []; nextGhostSampleTimer = 0;
      lastBossThreshold = 0; boss = null; totalBossesDefeated = 0;
      trafficCars = []; playerBullets = []; enemyBullets = []; coins = []; powerups = []; particles = []; floatingTexts = [];
      nextCarSpawnTimer = 0.8; nextCoinSpawnTimer = 1.6; nextPowerupSpawnTimer = 7.0;
      player.x = roadX + roadW / 2; player.vx = 0; player.tilt = 0; player.y = screenHeight - player.height - 40;
      lifetimeStats.totalGames += 1; saveStats(); initWeather(); checkAchievements(); assignRandomMission(); soundStart();
    }

    function triggerGameOver() {
      const timeUp = gameOverReason === 'time';
      currentState = STATE_GAMEOVER; gameOverTimestamp = performance.now(); resetSteering();
      if (timeUp) soundMissionComplete(); else soundCrash();
      if (gameMode === 'classic' && score > (lifetimeStats.bestScore || 0) && recordedGhostPositions.length > 5) {
        currentGhost = { score: score, positions: recordedGhostPositions, duration: gameTime };
        try { localStorage.setItem('neon_racer_ghost', JSON.stringify(currentGhost)); } catch (e) {}
      }
      saveStats(); checkSkinUnlocks(); checkAchievements();
      for (let i = 0; i < 45; i++) {
        const a = Math.random() * Math.PI * 2, s = Math.random() * 260 + 40;
        particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: 4, color: timeUp ? (Math.random() > 0.4 ? '#39ff14' : '#00ffff') : (Math.random() > 0.4 ? '#ff0055' : '#00ffff'), alpha: 1, decay: 1.8 });
      }
    }

    function spawnTrafficCar() {
      if (boss !== null) return;
      const occupied = [];
      trafficCars.forEach(c => { if (c.y < 240) { const idx = Math.floor((c.x - roadX) / laneWidth); if (idx >= 0 && idx < 3 && !occupied.includes(idx)) occupied.push(idx); } });
      if (occupied.length >= 2) return;
      const avail = [0, 1, 2].filter(l => !occupied.includes(l));
      if (!avail.length) return;
      const lane = avail[Math.floor(Math.random() * avail.length)];
      const ws = WEATHER_DEFS[currentWeather].enemySlow || 1.0;
      const elim = gameMode === 'elimination';
      const isE = Math.random() < (elim ? 0.6 : 0.38);
      trafficCars.push({
        x: roadX + lane * laneWidth + laneWidth / 2, y: -100, width: player.width * 0.94, height: player.height * 0.94,
        speed: currentSpeed * (0.35 + Math.random() * 0.35) * ws, isEnemy: isE, hp: 1, shootCooldown: elim ? 0.4 + Math.random() * 0.5 : 1.0 + Math.random(),
        colorPalette: isE ? { body: '#ff0033', glow: '#ff0033', light: '#ff4d6d' } : TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)]
      });
    }

    function applyPowerup(type) {
      if (type === 'shield') {
        shieldTimer = 8.0 + (upgrades.shield || 0) * 2;
        floatingTexts.push({ text: `SHIELD ACTIVE (${shieldTimer.toFixed(0)}s)!`, x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00e5ff' });
      } else if (type === 'rapid') {
        rapidFireTimer = 7.0;
        floatingTexts.push({ text: 'RAPID FIRE!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#ffe600' });
      } else if (type === 'health') {
        playerHP = Math.min(playerHP + 1, getRunMaxHP());

      }
    }

    // UPDATE
    function update(dt) {
      if (currentState === STATE_PAUSED) return;
      if (toastTimer > 0) toastTimer -= dt;
      gameTime += dt;
      stars.forEach(s => { s.y += (s.speed + (currentState === STATE_PLAYING ? (currentSpeed - 420) * 0.1 : 0)) * dt; if (s.y > screenHeight) { s.y = 0; s.x = Math.random() * screenWidth; } });
      if (currentState !== STATE_PLAYING) {
        player.x = roadX + roadW / 2 + Math.sin(gameTime * 1.5) * 12;
        player.tilt = Math.sin(gameTime * 1.5) * 0.05;
        roadScrollOffset = (roadScrollOffset + 180 * dt) % 60;
        return;
      }
      updateWeather(dt);
      updateMusic(dt);
      if (playerFrozenTimer > 0) playerFrozenTimer = Math.max(0, playerFrozenTimer - dt);

      // NITRO TIMERS
      if (nitroTimer > 0) { nitroTimer -= dt; if (nitroTimer <= 0) { nitroTimer = 0; nitroCooldown = 5; } }
      else if (nitroCooldown > 0) nitroCooldown = Math.max(0, nitroCooldown - dt);

      if (gameMode === 'classic') {
        nextGhostSampleTimer -= dt;
        if (nextGhostSampleTimer <= 0) { nextGhostSampleTimer = 0.1; recordedGhostPositions.push({ time: gameTime, x: player.x, y: player.y, score: score }); }
      }

      checkBossSpawn(); updateBoss(dt); checkSkinUnlocks(); updateMissionProgress();
      checkDailyProgress(missionEnemiesKilled, gameTime, score, coinsCollected, false); checkAchievements();

      if (screenDamageFlash > 0) screenDamageFlash = Math.max(0, screenDamageFlash - dt * 2.2);
      if (rapidFireTimer > 0) rapidFireTimer = Math.max(0, rapidFireTimer - dt);
      if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - dt);

      // SHOOTING (disabled in DRIFT mode)
      playerShootTimer += dt;
      const fireInterval = (rapidFireTimer > 0 ? 0.14 : 0.3) * (1 - (upgrades.fireRate || 0) * 0.05);
      if (playerShootTimer >= fireInterval) {
        playerShootTimer = 0;
        if (gameMode !== 'drift') {
          const sk = getSelectedSkin(), bCol = sk.glow === 'rainbow' ? getRainbowColor() : sk.glow;
          playerBullets.push({ x: player.x - 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
          playerBullets.push({ x: player.x + 10, y: player.y - player.height / 2 + 2, vy: -820, width: 5, height: 16, color: bCol });
          soundPlayerShoot();
        }
      }

      const freezeFactor = playerFrozenTimer > 0 ? 0.5 : 1.0;
      let moveDir = 0;
      if (isSteeringLeft()) moveDir -= 1;
      if (isSteeringRight()) moveDir += 1;

      // DRIFT SCORING: +5/sec while steering, +10/sec once steering streak >= 3s (combo)
      driftActive = moveDir !== 0;
      if (driftActive) { driftStreak += dt; driftCombo = driftStreak >= 3; driftScore += (driftCombo ? 10 : 5) * dt; }
      else { driftStreak = 0; driftCombo = false; }

      let spd = Math.min((420 * getSpeedMult() + distanceTraveled * 0.028) * (1.0 + (WEATHER_DEFS[currentWeather].speedBoost || 0)) * freezeFactor, 950);
      if (nitroTimer > 0) spd *= 1.5;
      currentSpeed = spd;
      const roadTravel = currentSpeed * dt;
      distanceTraveled += roadTravel;
      if (gameMode === 'drift') score = Math.floor(driftScore) + coinsCollected * 5;
      else score = (Math.floor((distanceTraveled / 30) * getWeatherScoreMultiplier()) + coinsCollected * 5) * (gameMode === 'elimination' ? 2 : 1);
      if (score > bestScore) bestScore = score;
      roadScrollOffset = (roadScrollOffset + roadTravel) % 60;

      // TIME TRIAL: auto-end at 30s
      if (gameMode === 'timetrial' && gameTime >= TIME_TRIAL_DURATION) {
        score += 250; gameOverReason = 'time';
        floatingTexts.push({ text: "TIME'S UP! +250", x: screenWidth / 2, y: screenHeight * 0.4, vy: 40, alpha: 1, decay: 1.5, color: '#39ff14' });
        triggerGameOver(); return;
      }

      player.vx = moveDir * getSteerSpeed() * freezeFactor;
      player.x += player.vx * dt;
      player.tilt += (moveDir * 0.14 - player.tilt) * Math.min(dt * 15, 1);
      const minX = roadX + player.width / 2 + 6, maxX = roadX + roadW - player.width / 2 - 6;
      if (player.x < minX) { player.x = minX; player.vx = 0; } else if (player.x > maxX) { player.x = maxX; player.vx = 0; }

      const curSkin = getSelectedSkin(), trCol = curSkin.trail === 'rainbow' ? getRainbowColor(180) : curSkin.trail;
      [-8, 8].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 - 2, vx: (Math.random() - 0.5) * 20, vy: 140, size: 3, color: trCol, alpha: 0.75, decay: 3.5 }));
      if (nitroTimer > 0) {
        [-9, 0, 9].forEach(ox => particles.push({ x: player.x + ox, y: player.y + player.height / 2 + 4, vx: (Math.random() - 0.5) * 40, vy: 280 + Math.random() * 120, size: 3 + Math.random() * 3, color: Math.random() > 0.5 ? '#00ffff' : '#80f2ff', alpha: 0.9, decay: 3.2 }));
      }

      for (let i = playerBullets.length - 1; i >= 0; i--) { const b = playerBullets[i]; b.y += b.vy * dt; if (b.y < -30) playerBullets.splice(i, 1); }
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i]; b.y += (b.vy || 500) * dt; if (b.vx) b.x += b.vx * dt;
        if (Math.abs(b.x - player.x) <= player.width * 0.42 && Math.abs(b.y - player.y) <= player.height * 0.44) {
          const isIce = b.type === 'ice';
          enemyBullets.splice(i, 1); comboKills = 0; lastComboTier = 1;
          if (shieldTimer > 0) {
            shieldTimer = 0; soundPowerup();
            floatingTexts.push({ text: 'SHIELD ABSORBED!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
          } else {
            playerHP -= 1; screenDamageFlash = 0.45; screenDamageFlashColor = isIce ? 'rgba(0, 229, 255, 0.45)' : 'rgba(255, 0, 50, 0.45)';
            if (isIce) { playerFrozenTimer = 1.0; soundFreeze(); floatingTexts.push({ text: '❄️ FROZEN! 50% SPEED', x: player.x, y: player.y - 45, vy: 40, alpha: 1, decay: 1.8, color: '#00e5ff' }); }
            else soundPlayerHit();
            for (let p = 0; p < 15; p++) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180, size: 3, color: isIce ? '#00e5ff' : '#ff0055', alpha: 1, decay: 2.5 });
            if (playerHP <= 0) { triggerGameOver(); return; }
          }
          continue;
        }
        if (b.y > screenHeight + 40 || b.x < -30 || b.x > screenWidth + 30) enemyBullets.splice(i, 1);
      }

      if (boss === null) {
        if ((nextCarSpawnTimer -= dt) <= 0) { spawnTrafficCar(); nextCarSpawnTimer = (Math.max(1.0 - (currentSpeed - 420) * 0.0012, 0.45) + Math.random() * 0.4) * (gameMode === 'elimination' ? 0.7 : 1); }
        if ((nextCoinSpawnTimer -= dt) <= 0) { coins.push({ x: roadX + Math.floor(Math.random() * 3) * laneWidth + laneWidth / 2, y: -40, radius: 13, pulseOffset: Math.random() * 6 }); nextCoinSpawnTimer = 1.4 + Math.random() * 1.8; }
        if ((nextPowerupSpawnTimer -= dt) <= 0) {
          const ptypes = gameMode === 'elimination' ? ['shield', 'rapid'] : ['shield', 'rapid', 'health'];
          powerups.push({ type: ptypes[Math.floor(Math.random() * ptypes.length)], x: roadX + Math.floor(Math.random() * 3) * laneWidth + laneWidth / 2, y: -50, radius: 17, pulseOffset: Math.random() * 6 }); nextPowerupSpawnTimer = 10.0 + Math.random() * 6;
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i]; p.y += currentSpeed * dt;
        if (Math.hypot(player.x - p.x, player.y - p.y) < player.width / 2 + p.radius) { applyPowerup(p.type); soundPowerup(); powerups.splice(i, 1); continue; }
        if (p.y > screenHeight + 60) powerups.splice(i, 1);
      }

      for (let i = trafficCars.length - 1; i >= 0; i--) {
        const car = trafficCars[i]; car.y += (currentSpeed - car.speed) * dt;
        if (car.isEnemy && (car.shootCooldown -= dt) <= 0 && car.y > 20 && car.y < screenHeight - 120) {
          const elim = gameMode === 'elimination';
          car.shootCooldown = elim ? 0.75 : 1.5; enemyBullets.push({ x: car.x, y: car.y + car.height / 2 + 6, vy: elim ? 620 : 500, width: 5, height: 14 }); soundEnemyShoot();
        }
        let destroyed = false;
        for (let j = playerBullets.length - 1; j >= 0; j--) {
          const b = playerBullets[j];
          if (Math.abs(b.x - car.x) <= car.width / 2 && Math.abs(b.y - car.y) <= car.height / 2) {
            playerBullets.splice(j, 1);
            if ((car.hp -= 1) <= 0) {
              destroyed = true; comboKills += 1; const mult = getComboMultiplier(); checkComboTierUp();
              const pts = 10 * mult; score += pts; distanceTraveled += 300; missionEnemiesKilled += 1; lifetimeStats.totalEnemies += 1;
              soundEnemyExplosion(); floatingTexts.push({ text: `+${pts}${mult > 1 ? ` (x${mult})` : ''}`, x: car.x, y: car.y, vy: 55, alpha: 1, decay: 1.8, color: getComboColor(mult) });
              for (let p = 0; p < 20; p++) particles.push({ x: car.x, y: car.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, size: 3.5, color: car.colorPalette.glow, alpha: 1, decay: 1.8 });
              break;
            }
          }
        }
        if (destroyed) { trafficCars.splice(i, 1); continue; }
        if (Math.abs(player.x - car.x) < player.width * 0.7 && Math.abs(player.y - car.y) < player.height * 0.75) {
          comboKills = 0; lastComboTier = 1;
          if (shieldTimer > 0) {
            shieldTimer = 0; trafficCars.splice(i, 1); soundEnemyExplosion();
            floatingTexts.push({ text: 'SHIELD RAM!', x: player.x, y: player.y - 40, vy: 50, alpha: 1, decay: 2, color: '#00ffff' });
          } else { triggerGameOver(); return; }
        }
        if (car.y > screenHeight + 120) trafficCars.splice(i, 1);
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i]; c.y += currentSpeed * dt;
        if (Math.hypot(player.x - c.x, player.y - c.y) < player.width / 2 + c.radius) {
          coinsCollected += 1; totalCoins += 1; saveCoins(); score += 5; missionCoinsGathered += 1; lifetimeStats.totalCoins += 1;
          soundCoin(); floatingTexts.push({ text: '+5 (🪙+1)', x: c.x, y: c.y, vy: 60, alpha: 1, decay: 2, color: '#ffd700' });
          for (let p = 0; p < 8; p++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120, size: 2.5, color: '#ffd700', alpha: 1, decay: 2 });
          coins.splice(i, 1); continue;
        }
        if (c.y > screenHeight + 40) coins.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; if ((p.alpha -= p.decay * dt) <= 0) particles.splice(i, 1); }
      for (let i = floatingTexts.length - 1; i >= 0; i--) { const ft = floatingTexts[i]; ft.y -= ft.vy * dt; if ((ft.alpha -= ft.decay * dt) <= 0) floatingTexts.splice(i, 1); }
    }

    // DRAWING
    function drawBtn(x, y, w, h, col, bg, txt, sz) {
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.fillStyle = bg; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col; ctx.font = `bold ${sz || 14}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y);
      ctx.restore();
    }

    function drawGhostCar() {
      if (!ghostEnabled || gameMode !== 'classic' || !currentGhost || (currentState !== STATE_PLAYING && currentState !== STATE_PAUSED)) return;
      const g = getGhostStateAtTime(gameTime);
      if (!g) return;
      ctx.save(); ctx.globalAlpha = 0.4; ctx.translate(g.x, g.y);
      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 8); ctx.stroke();
      ctx.font = 'bold 9px sans-serif'; ctx.fillStyle = '#00ffff'; ctx.textAlign = 'center'; ctx.fillText('👻 GHOST', 0, -player.height / 2 - 6);
      ctx.restore();
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, screenHeight);
      grad.addColorStop(0, currentWeather === 'night' ? '#02030a' : '#040614');
      grad.addColorStop(0.5, currentWeather === 'night' ? '#030512' : '#070b1f');
      grad.addColorStop(1, '#02040d');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, screenWidth, screenHeight);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(180, 220, 255, ${s.alpha * (0.7 + 0.3 * Math.sin(gameTime * s.pulseSpeed + s.pulseOffset))})`;
        ctx.fillRect(s.x, s.y, s.radius, s.radius);
      });
    }

    function drawRoad() {
      ctx.save();
      ctx.fillStyle = '#0b0f20'; ctx.fillRect(roadX, 0, roadW, screenHeight);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)'; ctx.lineWidth = 1;
      for (let y = roadScrollOffset - 60; y < screenHeight + 60; y += 40) { ctx.beginPath(); ctx.moveTo(roadX, y); ctx.lineTo(roadX + roadW, y); ctx.stroke(); }
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 18; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(roadX, 0); ctx.lineTo(roadX, screenHeight); ctx.stroke();
      ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 18; ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(roadX + roadW, 0); ctx.lineTo(roadX + roadW, screenHeight); ctx.stroke();
      ctx.shadowColor = '#80d4ff'; ctx.shadowBlur = 8; ctx.strokeStyle = 'rgba(128, 212, 255, 0.45)';
      ctx.lineWidth = 2.5; ctx.setLineDash([32, 28]); ctx.lineDashOffset = -roadScrollOffset;
      for (let i = 1; i <= 2; i++) { const lx = roadX + i * laneWidth; ctx.beginPath(); ctx.moveTo(lx, -60); ctx.lineTo(lx, screenHeight + 60); ctx.stroke(); }
      ctx.restore();
    }

    // NITRO SPEED LINES
    function drawSpeedLines() {
      if (nitroTimer <= 0 || (currentState !== STATE_PLAYING && currentState !== STATE_PAUSED)) return;
      ctx.save(); ctx.strokeStyle = 'rgba(0, 255, 255, 0.45)'; ctx.lineWidth = 2; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 8;
      for (let i = 0; i < 18; i++) {

        if (un) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8; }
        ctx.beginPath(); ctx.roundRect(x, y, cardW, cardH, 8); ctx.fill(); ctx.stroke();

        ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(un ? '✅' : '🔒', x + 24, y + cardH / 2);

        ctx.textAlign = 'left'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = un ? '#ffffff' : '#777777';
        ctx.fillText(ach.name, x + 46, y + 15);
        ctx.font = '10.5px sans-serif'; ctx.fillStyle = un ? '#8e9bbb' : '#555555';
        ctx.fillText(ach.desc, x + 46, y + 32);

        if (un) {
          ctx.textAlign = 'right'; ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#39ff14';
          ctx.fillText(unlockedAchievements[ach.id] || 'DONE', x + cardW - 12, y + cardH / 2);
        }
        ctx.restore();
      });
    }

    // SETTINGS SCREEN
    function drawSettings() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2;
      drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#b0b8d0'; ctx.shadowBlur = 14; ctx.fillStyle = '#e0e6ff';
      ctx.font = '900 22px sans-serif'; ctx.fillText('⚙️ SETTINGS', midX + 20, 43);
      ctx.shadowBlur = 0; ctx.fillStyle = '#00ffff'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText('STEERING SENSITIVITY', midX, 122);
      [['slow', 'SLOW'], ['normal', 'NORMAL'], ['fast', 'FAST']].forEach((s, i) => {
        const sel = sensitivity === s[0], bx = midX + (i - 1) * 100;
        drawBtn(bx, 160, 92, 38, sel ? '#00ffff' : '#4a5570', sel ? '#0a3a4a' : '#0a0d1e', s[1], 13);
        ctx.fillStyle = sel ? '#8afcff' : '#667'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(STEER_SPEEDS[s[0]] + '', bx, 190);
      });
      const volRow = (label, y, pct, col) => {
        ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = col; ctx.font = 'bold 13px sans-serif'; ctx.fillText(label, midX, y - 40);
        drawBtn(midX - 90, y, 48, 40, col, '#0a0d1e', '−', 22);
        drawBtn(midX + 90, y, 48, 40, col, '#0a0d1e', '+', 22);
        ctx.fillStyle = '#fff'; ctx.font = '900 24px sans-serif'; ctx.fillText(pct + '%', midX, y - 3);
        ctx.fillStyle = '#14182c'; ctx.beginPath(); ctx.roundRect(midX - 40, y + 12, 80, 6, 3); ctx.fill();
        ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(midX - 40, y + 12, Math.max(0, 80 * pct / 100), 6, 3); ctx.fill();
        ctx.restore();
      };
      volRow('🎵 MUSIC VOLUME', 272, musicVolPct, '#ff66c4');
      volRow('🔊 SFX VOLUME', 382, sfxVolPct, '#39ff14');
      ctx.fillStyle = '#667'; ctx.font = '10.5px sans-serif'; ctx.fillText('Tires upgrade boosts steering on top of this setting', midX, 450);
      ctx.restore();
    }

    // MODE SELECT SCREEN
    function drawModeSelect() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2;
      drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 14; ctx.fillStyle = '#00ffff';
      ctx.font = '900 22px sans-serif'; ctx.fillText('🎮 RACING MODE', midX + 20, 43); ctx.restore();
      const cardW = Math.min(screenWidth * 0.88, 380), cardH = 78, startY = 100;
      MODES.forEach((m, idx) => {
        const cardY = startY + idx * 90, cardX = midX - cardW / 2, sel = gameMode === m.id;
        ctx.save();
        if (sel) { ctx.shadowColor = m.color; ctx.shadowBlur = 16; }
        ctx.fillStyle = sel ? '#12233f' : '#0a0d1e'; ctx.strokeStyle = sel ? m.color : 'rgba(255,255,255,0.15)'; ctx.lineWidth = sel ? 2.5 : 1.5;
        ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0; ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(m.icon, cardX + 32, cardY + cardH / 2);
        ctx.textAlign = 'left'; ctx.fillStyle = sel ? m.color : '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(m.name, cardX + 62, cardY + 26);
        ctx.fillStyle = '#8e9bbb'; ctx.font = '10.5px sans-serif'; ctx.fillText(m.desc, cardX + 62, cardY + 50);
        if (sel) { ctx.textAlign = 'right'; ctx.fillStyle = m.color; ctx.font = 'bold 11px sans-serif'; ctx.fillText('SELECTED ★', cardX + cardW - 12, cardY + 26); }
        ctx.restore();
      });
    }

    function drawGarage() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2;
      drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
      ctx.textAlign = 'center'; ctx.font = '900 22px sans-serif'; ctx.fillStyle = '#ff007f'; ctx.fillText('CYBER GARAGE', midX + 20, 43);

      const cardW = Math.min(screenWidth * 0.88, 380), cardH = 82, startY = 95;
      SKINS.forEach((skin, idx) => {
        const cardY = startY + idx * 98, cardX = midX - cardW / 2;
        const un = unlockedSkinIds.includes(skin.id), sel = selectedSkinId === skin.id;
        const col = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;
        ctx.save();
        ctx.fillStyle = sel ? '#12233f' : '#0a0d1e'; ctx.strokeStyle = sel ? col : (un ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.12)');
        ctx.lineWidth = sel ? 2.5 : 1.5; ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();
        ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = un ? '#fff' : '#777'; ctx.fillText(skin.name, cardX + 24, cardY + 28);
        ctx.font = '11.5px sans-serif'; ctx.fillStyle = un ? '#39ff14' : '#ff6688'; ctx.fillText(un ? 'UNLOCKED' : `🔒 ${skin.reqDesc}`, cardX + 24, cardY + 54);
        ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = sel ? col : (un ? '#8e9bbb' : '#555');
        ctx.fillText(sel ? 'SELECTED ★' : (un ? 'EQUIP ▶' : '🔒'), cardX + cardW - 16, cardY + cardH / 2);
        ctx.restore();
      });
    }

    function drawUpgrades() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2, cardW = Math.min(screenWidth * 0.90, 390), cardH = 64;
      // scrollable cards (clipped below header)
      ctx.save();
      ctx.beginPath(); ctx.rect(0, UPG_HEADER, screenWidth, screenHeight - UPG_HEADER); ctx.clip();
      UPGRADE_KEYS.forEach((key, idx) => {
        const def = UPGRADE_DEFS[key], cardY = UPG_START + idx * UPG_STEP + upgScroll, cardX = midX - cardW / 2;
        if (cardY + cardH < UPG_HEADER || cardY > screenHeight) return;
        const cur = upgrades[key] || 0, isMax = cur >= def.max, cost = isMax ? 0 : def.costs[cur], can = !isMax && totalCoins >= cost;
        ctx.save();
        ctx.fillStyle = '#0a0e20'; ctx.strokeStyle = can ? 'rgba(255,230,0,0.45)' : 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();
        ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(def.icon, cardX + 30, cardY + cardH / 2);
        ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(def.name, cardX + 58, cardY + 16);
        ctx.fillStyle = '#8e9bbb'; ctx.font = '10px sans-serif'; ctx.fillText(def.desc, cardX + 58, cardY + 34);
        ctx.fillStyle = '#39ff14'; ctx.font = 'bold 10.5px sans-serif'; ctx.fillText(`Lv ${cur}/${def.max}`, cardX + 58, cardY + 50);
        drawBtn(cardX + cardW - 58, cardY + cardH / 2, 92, 36, isMax ? '#778899' : (can ? '#39ff14' : '#ff7799'), isMax ? '#1a1f2e' : (can ? '#1f2b09' : '#22141a'), isMax ? 'MAXED' : `🪙 ${cost}`, 12);
        ctx.restore();
      });
      ctx.restore();
      // fixed header
      ctx.fillStyle = 'rgba(4, 6, 20, 0.98)'; ctx.fillRect(0, 0, screenWidth, UPG_HEADER);
      drawBtn(62, 43, 88, 38, '#00ffff', '#0a1d30', '◀ BACK', 14);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '900 22px sans-serif'; ctx.fillStyle = '#ffe600'; ctx.fillText('PERFORMANCE SHOP', midX + 20, 36);
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText('BALANCE: 🪙 ' + totalCoins, midX + 20, 56);
      if (clampUpgScroll(-99999) < 0) {
        ctx.font = '10px sans-serif'; ctx.fillStyle = '#667'; ctx.fillText(upgScroll > clampUpgScroll(-99999) + 2 ? '▼ scroll for more' : '▲ scroll up', midX + 20, 74);
      }
    }

    function drawPause() {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2, midY = screenHeight / 2;
      ctx.textAlign = 'center'; ctx.font = '900 46px sans-serif'; ctx.fillStyle = '#00ffff'; ctx.fillText('PAUSED', midX, midY - 90);
      drawBtn(midX, midY - 15, 200, 46, '#00ffff', '#051829', '▶ RESUME', 18);
      drawBtn(midX, midY + 47, 200, 46, '#ff66c4', '#2a0a20', '🔄 RESTART', 18);
      drawBtn(midX, midY + 109, 200, 46, '#ff4d6d', '#220810', '🏠 QUIT', 18);
      ctx.restore();
    }

    function drawGameOver() {
      ctx.save(); ctx.fillStyle = 'rgba(10,2,12,0.84)'; ctx.fillRect(0, 0, screenWidth, screenHeight);
      const midX = screenWidth / 2, midY = screenHeight / 2, timeUp = gameOverReason === 'time', md = getMode();
      ctx.textAlign = 'center'; ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = md.color; ctx.fillText(`${md.icon} ${md.name} MODE`, midX, midY - 152);
      ctx.font = '900 48px sans-serif'; ctx.fillStyle = timeUp ? '#39ff14' : '#ff0055'; ctx.fillText(timeUp ? "TIME'S UP!" : 'CRASHED!', midX, midY - 105);
      const cw = Math.min(screenWidth * 0.82, 310), cy = midY - 65;
      ctx.fillStyle = 'rgba(14,18,36,0.9)'; ctx.strokeStyle = timeUp ? 'rgba(57,255,20,0.4)' : 'rgba(255,0,127,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(midX - cw / 2, cy, cw, 126, 16); ctx.fill(); ctx.stroke();
      ctx.font = '12px sans-serif'; ctx.fillStyle = '#8e9bbb'; ctx.fillText('FINAL SCORE', midX, cy + 24);
      ctx.font = '900 32px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(score.toString(), midX, cy + 58);
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText(`BEST SCORE: ${lifetimeStats.bestScore || bestScore}`, midX, cy + 86);
      ctx.fillStyle = '#ffe600'; ctx.fillText(`RUN COINS: +${coinsCollected} • TOTAL: 🪙 ${totalCoins}`, midX, cy + 108);

      const rdy = performance.now() - gameOverTimestamp >= 400;
      drawBtn(midX, midY + 108, 190, 50, rdy ? '#ff007f' : '#666', rdy ? '#2a0a20' : '#1a1a24', 'RETRY', 19);
      drawBtn(midX, midY + 166, 190, 50, rdy ? '#00ffff' : '#666', rdy ? '#051829' : '#1a1a24', '🏠 MAIN MENU', 18);
      ctx.restore();
    }

    function drawToast() {
      if (toastTimer <= 0 || currentState === STATE_PLAYING) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, toastTimer * 1.5); ctx.font = '900 14px sans-serif';
      const tw = ctx.measureText(toastText).width + 36, x = screenWidth / 2, y = screenHeight - 50;
      ctx.shadowColor = toastColor; ctx.shadowBlur = 14; ctx.fillStyle = 'rgba(8,12,28,0.95)'; ctx.strokeStyle = toastColor; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - tw / 2, y - 18, tw, 36, 18); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = toastColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toastText, x, y);
      ctx.restore();
    }

    // LOOP
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
      if (currentState !== STATE_PAUSED) update(dt);

      ctx.save(); ctx.scale(dpr, dpr);
      drawBackground(); drawRoad(); drawSpeedLines();
      coins.forEach(c => {
        ctx.save(); ctx.translate(c.x, c.y);
        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(0, 0, c.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      });
      powerups.forEach(p => {
        ctx.save(); ctx.translate(p.x, p.y);
        const col = p.type === 'rapid' ? '#ffe600' : (p.type === 'health' ? '#39ff14' : '#00ffff');
        ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fillStyle = '#091522'; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'rapid' ? '⚡' : (p.type === 'health' ? '💚' : '🛡️'), 0, 1);
        ctx.restore();
      });
      playerBullets.forEach(b => { ctx.fillStyle = b.color || '#00ffff'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
      enemyBullets.forEach(b => { ctx.fillStyle = b.color || '#ff0033'; ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height); });
      drawBoss(); drawGhostCar(); drawPlayerCar(); drawTraffic();
      particles.forEach(p => { ctx.save(); ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
      drawWeatherOverlay();

      if (currentState === STATE_PLAYING) drawHUD();
      else if (currentState === STATE_PAUSED) { drawHUD(); drawPause(); }
      else if (currentState === STATE_MENU) { drawMenu(); if (rewardPopup) drawRewardPopup(); }
      else if (currentState === STATE_GARAGE) drawGarage();
      else if (currentState === STATE_UPGRADES) drawUpgrades();
      else if (currentState === STATE_ACHIEVEMENTS) drawAchievements();
      else if (currentState === STATE_SETTINGS) drawSettings();
      else if (currentState === STATE_MODE) drawModeSelect();
      else if (currentState === STATE_GAMEOVER) drawGameOver();
      drawToast();

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    resize();
    requestAnimationFrame(t => { lastTime = t; gameLoop(t); });
  })();
  </script>
</body>
</html>
