<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Racer</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffff">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050714;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: none;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #050714;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
  'use strict';
  (function () {
    // ==========================================
    // AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, gainStart, gainEnd) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainStart !== undefined ? gainStart : 0.15, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(gainEnd !== undefined ? gainEnd : 0.001, 0.0001), now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    function soundPlayerShoot() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function soundEnemyShoot() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (e) {}
    }

    function soundBossShoot() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {}
    }

    function soundEnemyExplosion() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (e) {}
    }

    function soundBossExplosion() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.8);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.85);
      } catch (e) {}
    }

    function soundPlayerHit() {
      try {
        if (window.AndroidBridge && window.AndroidBridge.vibrate) {
          window.AndroidBridge.vibrate(150);
        } else if (navigator.vibrate) {
          navigator.vibrate(120);
        }
      } catch (e) {}

      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    function soundPowerup() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach(function (f, idx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.05);
          gain.gain.setValueAtTime(0.12, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.12);
        });
      } catch (e) {}
    }

    function soundMissionComplete() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach(function (f, idx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          gain.gain.setValueAtTime(0.15, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.2);
        });
      } catch (e) {}
    }

    function soundCoin() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      try {
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'square';
        osc1.frequency.setValueAtTime(987.77, now);
        gain1.gain.setValueAtTime(0.12, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.08);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(1318.51, now + 0.08);
        gain2.gain.setValueAtTime(0.15, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.22);
      } catch (e) {}
    }

    function soundCrash() {
      try {
        if (window.AndroidBridge && window.AndroidBridge.vibrate) {
          window.AndroidBridge.vibrate(300);
        } else if (navigator.vibrate) {
          navigator.vibrate([120, 50, 250]);
        }
      } catch (e) {}

      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.45);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);

        const bufferSize = audioCtx.sampleRate * 0.35;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.25, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        whiteNoise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        whiteNoise.start(now);
      } catch (e) {}
    }

    function soundStart() {
      playTone(523.25, 'triangle', 0.12, 0.15, 0.001);
      setTimeout(function () {
        playTone(659.25, 'triangle', 0.18, 0.18, 0.001);
      }, 90);
    }

    // ==========================================
    // CONSTANTS & GAME STATE
    // ==========================================
    const STATE_MENU = 0;
    const STATE_PLAYING = 1;
    const STATE_GAMEOVER = 2;
    const STATE_GARAGE = 3;

    let currentState = STATE_MENU;
    let gameOverTimestamp = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth = 0;
    let screenHeight = 0;
    let dpr = 1;

    // Road Layout
    let roadX = 0;
    let roadW = 0;
    let laneWidth = 0;
    let roadScrollOffset = 0;

    // Physics & Progression
    const baseSpeed = 420;
    let currentSpeed = baseSpeed;
    let distanceTraveled = 0;
    let score = 0;
    let bestScore = 0;
    let coinsCollected = 0;
    let gameTime = 0;

    // Lifetime Stats
    let lifetimeStats = {
      totalGames: 0,
      totalEnemies: 0,
      totalCoins: 0,
      bestScore: 0
    };

    try {
      const savedStats = localStorage.getItem('neon_racer_stats');
      if (savedStats) {
        lifetimeStats = Object.assign(lifetimeStats, JSON.parse(savedStats));
      }
      bestScore = lifetimeStats.bestScore || 0;
    } catch (e) {}

    function saveStats() {
      try {
        if (score > lifetimeStats.bestScore) {
          lifetimeStats.bestScore = score;
        }
        bestScore = lifetimeStats.bestScore;
        localStorage.setItem('neon_racer_stats', JSON.stringify(lifetimeStats));
        localStorage.setItem('neon_racer_high_score', bestScore.toString());
      } catch (e) {}
    }

    // ==========================================
    // CAR SKINS SYSTEM
    // ==========================================
    const SKINS = [
      {
        id: 'cyan',
        name: 'Neon Cyan',
        reqScore: 0,
        reqDesc: 'Default',
        bodyTop: '#0a2133',
        bodyMid: '#05111d',
        bodyBot: '#02070c',
        glow: '#00ffff',
        trail: '#00ffff',
        accent: '#00e5ff'
      },
      {
        id: 'magenta',
        name: 'Magenta Ghost',
        reqScore: 3000,
        reqDesc: 'Reach 3,000 Score',
        bodyTop: '#300826',
        bodyMid: '#1a0415',
        bodyBot: '#0d010b',
        glow: '#ff007f',
        trail: '#ff007f',
        accent: '#ff66c4'
      },
      {
        id: 'gold',
        name: 'Golden Legend',
        reqScore: 8000,
        reqDesc: 'Reach 8,000 Score',
        bodyTop: '#3b2f0a',
        bodyMid: '#241b05',
        bodyBot: '#120d02',
        glow: '#ffd700',
        trail: '#ffe600',
        accent: '#fff380'
      },
      {
        id: 'rainbow',
        name: 'Rainbow Prism',
        reqScore: 20000,
        reqDesc: 'Reach 20,000 Score',
        bodyTop: '#101030',
        bodyMid: '#0a0a20',
        bodyBot: '#050512',
        glow: 'rainbow',
        trail: 'rainbow',
        accent: '#ffffff'
      }
    ];

    let unlockedSkinIds = ['cyan'];
    let selectedSkinId = 'cyan';

    try {
      const savedUnlocked = localStorage.getItem('neon_racer_unlocked_skins');
      if (savedUnlocked) {
        unlockedSkinIds = JSON.parse(savedUnlocked);
        if (!unlockedSkinIds.includes('cyan')) unlockedSkinIds.push('cyan');
      }
      const savedSelected = localStorage.getItem('neon_racer_selected_skin');
      if (savedSelected) selectedSkinId = savedSelected;
    } catch (e) {}

    function checkSkinUnlocks() {
      let newlyUnlocked = false;
      const effectiveScore = Math.max(bestScore, score);
      SKINS.forEach(function (sk) {
        if (!unlockedSkinIds.includes(sk.id) && effectiveScore >= sk.reqScore) {
          unlockedSkinIds.push(sk.id);
          newlyUnlocked = true;
          floatingTexts.push({
            text: 'UNLOCKED ' + sk.name.toUpperCase() + '!',
            x: screenWidth / 2,
            y: screenHeight * 0.35,
            vy: 50,
            alpha: 1,
            decay: 1.5,
            color: '#ffd700'
          });
        }
      });
      if (newlyUnlocked) {
        try {
          localStorage.setItem('neon_racer_unlocked_skins', JSON.stringify(unlockedSkinIds));
        } catch (e) {}
      }
    }

    function getSelectedSkin() {
      return SKINS.find(function (s) { return s.id === selectedSkinId; }) || SKINS[0];
    }

    function getRainbowColor(offset) {
      const hue = (gameTime * 120 + (offset || 0)) % 360;
      return 'hsl(' + hue + ', 100%, 55%)';
    }

    // ==========================================
    // MISSIONS SYSTEM
    // ==========================================
    const MISSION_TEMPLATES = [
      { id: 'destroy_enemies', title: 'Destroy 10 enemy cars', target: 10, reward: 100, label: 'Destroy Enemies' },
      { id: 'collect_coins', title: 'Collect 20 coins', target: 20, reward: 150, label: 'Collect Coins' },
      { id: 'survive_time', title: 'Survive for 60 seconds', target: 60, reward: 200, label: 'Survive Time' },
      { id: 'reach_score', title: 'Reach 3,000 score', target: 3000, reward: 250, label: 'Reach Score' }
    ];

    let currentMission = null;
    let missionProgress = 0;
    let missionEnemiesKilled = 0;
    let missionCoinsGathered = 0;

    function assignRandomMission() {
      const template = MISSION_TEMPLATES[Math.floor(Math.random() * MISSION_TEMPLATES.length)];
      currentMission = Object.assign({}, template);
      missionProgress = 0;
      missionEnemiesKilled = 0;
      missionCoinsGathered = 0;
    }

    function updateMissionProgress() {
      if (!currentMission) return;

      if (currentMission.id === 'destroy_enemies') {
        missionProgress = missionEnemiesKilled;
      } else if (currentMission.id === 'collect_coins') {
        missionProgress = missionCoinsGathered;
      } else if (currentMission.id === 'survive_time') {
        missionProgress = Math.floor(gameTime);
      } else if (currentMission.id === 'reach_score') {
        missionProgress = score;
      }

      if (missionProgress >= currentMission.target) {
        completeMission();
      }
    }

    function completeMission() {
      score += currentMission.reward;
      soundMissionComplete();

      floatingTexts.push({
        text: 'MISSION COMPLETE! +' + currentMission.reward,
        x: screenWidth / 2,
        y: screenHeight * 0.38,
        vy: 60,
        alpha: 1,
        decay: 1.8,
        color: '#39ff14'
      });

      // Sparks celebratory particles
      for (let i = 0; i < 35; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 260 + 60;
        particles.push({
          x: screenWidth / 2,
          y: screenHeight * 0.38,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: Math.random() * 5 + 2,
          color: Math.random() > 0.5 ? '#39ff14' : '#ffd700',
          alpha: 1,
          decay: Math.random() * 1.5 + 0.8
        });
      }

      // Next random mission
      const oldId = currentMission.id;
      const candidates = MISSION_TEMPLATES.filter(function (m) { return m.id !== oldId; });
      const nextTemplate = candidates[Math.floor(Math.random() * candidates.length)] || MISSION_TEMPLATES[0];
      currentMission = Object.assign({}, nextTemplate);
      missionProgress = 0;
      missionEnemiesKilled = 0;
      missionCoinsGathered = 0;
    }

    // ==========================================
    // BOSS FIGHT SYSTEM (Every 5,000 pts)
    // ==========================================
    let lastBossThreshold = 0;
    let boss = null;

    function checkBossSpawn() {
      if (boss !== null) return;
      const currentThreshold = Math.floor(score / 5000);
      if (currentThreshold > 0 && currentThreshold > lastBossThreshold) {
        spawnBoss();
      }
    }

    function spawnBoss() {
      lastBossThreshold = Math.floor(score / 5000);
      boss = {
        width: 104,
        height: 140,
        x: screenWidth / 2,
        y: -150,
        targetY: 135,
        hp: 50,
        maxHp: 50,
        sinOffset: 0,
        shootTimer: 0,
        dropCarTimer: 2.5,
        flashTimer: 0
      };

      floatingTexts.push({
        text: '⚠️ BOSS APPROACHING! ⚠️',
        x: screenWidth / 2,
        y: screenHeight * 0.3,
        vy: 40,
        alpha: 1,
        decay: 2.0,
        color: '#ff0055'
      });
    }

    function updateBoss(dt) {
      if (!boss) return;

      // Descend into arena
      if (boss.y < boss.targetY) {
        boss.y += 180 * dt;
        if (boss.y > boss.targetY) boss.y = boss.targetY;
      }

      // Side to side sine wave
      boss.sinOffset += dt * 1.8;
      const roadCenter = roadX + roadW / 2;
      const maxAmplitude = (roadW / 2) - (boss.width / 2) - 16;
      boss.x = roadCenter + Math.sin(boss.sinOffset) * maxAmplitude;

      if (boss.flashTimer > 0) boss.flashTimer -= dt;

      // Spread shooting (3 bullets every 2 seconds)
      boss.shootTimer += dt;
      if (boss.shootTimer >= 2.0 && boss.y >= boss.targetY - 10) {
        boss.shootTimer = 0;
        soundBossShoot();

        const spreadAngles = [-0.28, 0, 0.28];
        spreadAngles.forEach(function (angle) {
          const spd = 360;
          enemyBullets.push({
            x: boss.x,
            y: boss.y + boss.height / 2 + 10,
            vx: Math.sin(angle) * spd,
            vy: Math.cos(angle) * spd,
            width: 7,
            height: 14,
            isBossBullet: true
          });
        });
      }

      // Occasionally drops mini-traffic cars
      boss.dropCarTimer += dt;
      if (boss.dropCarTimer >= 4.0 && boss.y >= boss.targetY - 10) {
        boss.dropCarTimer = 0;
        const laneIdx = Math.floor(Math.random() * 3);
        const spawnX = roadX + laneIdx * laneWidth + laneWidth / 2;
        trafficCars.push({
          x: spawnX,
          y: boss.y + boss.height / 2 + 15,
          width: 38,
          height: 68,
          speed: currentSpeed * 0.45,
          colorPalette: TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)],
          isEnemy: false,
          hp: 1,
          shootCooldown: 999
        });
      }

      // Check collision with player bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        if (
          b.x >= boss.x - boss.width / 2 &&
          b.x <= boss.x + boss.width / 2 &&
          b.y >= boss.y - boss.height / 2 &&
          b.y <= boss.y + boss.height / 2
        ) {
          playerBullets.splice(i, 1);
          boss.hp -= 1;
          boss.flashTimer = 0.08;

          for (let p = 0; p < 5; p++) {
            particles.push({
              x: b.x,
              y: b.y,
              vx: (Math.random() - 0.5) * 160,
              vy: (Math.random() - 0.5) * 160,
              size: 3,
              color: '#ff0055',
              alpha: 1,
              decay: 2.5
            });
          }

          if (boss.hp <= 0) {
            defeatBoss();
            break;
          }
        }
      }
    }

    function defeatBoss() {
      soundBossExplosion();
      score += 500;
      playerHP = MAX_HP; // Restore HP to max

      floatingTexts.push({
        text: 'BOSS DEFEATED! +500',
        x: screenWidth / 2,
        y: boss.y,
        vy: 70,
        alpha: 1,
        decay: 1.6,
        color: '#ffd700'
      });

      // Massive explosion
      for (let p = 0; p < 80; p++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 380 + 80;
        particles.push({
          x: boss.x,
          y: boss.y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 8 + 3,
          color: Math.random() > 0.5 ? '#ff0055' : '#ffd700',
          alpha: 1,
          decay: Math.random() * 1.5 + 0.8
        });
      }

      boss = null;
    }

    // Combat Stats
    const MAX_HP = 3;
    let playerHP = MAX_HP;
    let playerShootTimer = 0;
    let rapidFireTimer = 0;
    let shieldTimer = 0;
    let screenDamageFlash = 0;
    let screenDamageFlashColor = 'rgba(255, 0, 50, 0.4)';

    // Input States
    const activeTouches = new Map();
    let keyLeft = false;
    let keyRight = false;

    // Player Car
    const player = {
      x: 0,
      y: 0,
      width: 44,
      height: 82,
      targetX: 0,
      vx: 0,
      tilt: 0,
      glowPulse: 0
    };

    // Game Entities
    let trafficCars = [];
    let playerBullets = [];
    let enemyBullets = [];
    let coins = [];
    let powerups = [];
    let particles = [];
    let floatingTexts = [];
    let stars = [];

    let nextCarSpawnTimer = 0;
    let nextCoinSpawnTimer = 0;
    let nextPowerupSpawnTimer = 0;

    const TRAFFIC_PALETTES = [
      { body: '#ffe600', glow: '#ffe600', light: '#fff275' },
      { body: '#39ff14', glow: '#39ff14', light: '#8aff75' },
      { body: '#b026ff', glow: '#b026ff', light: '#d580ff' },
      { body: '#ff5e00', glow: '#ff5e00', light: '#ffa366' },
      { body: '#00e5ff', glow: '#00e5ff', light: '#80f2ff' }
    ];

    // ==========================================
    // INITIALIZATION & RESIZE
    // ==========================================
    function initStars() {
      stars = [];
      const numStars = Math.max(50, Math.floor((screenWidth * screenHeight) / 10000));
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * screenWidth,
          y: Math.random() * screenHeight,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 18 + 6,
          pulseSpeed: Math.random() * 3 + 1,
          pulseOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function resize() {
      screenWidth = window.innerWidth;
      screenHeight = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      canvas.width = Math.floor(screenWidth * dpr);
      canvas.height = Math.floor(screenHeight * dpr);

      // Responsive 3-lane road width: clamped between 280px and 460px
      roadW = Math.min(Math.max(screenWidth * 0.78, 280), 460);
      roadX = (screenWidth - roadW) / 2;
      laneWidth = roadW / 3;

      player.width = Math.min(Math.max(laneWidth * 0.44, 38), 50);
      player.height = player.width * 1.86;

      if (currentState === STATE_MENU || currentState === STATE_GARAGE) {
        player.x = roadX + roadW / 2;
        player.targetX = player.x;
        player.y = screenHeight * 0.78;
      } else {
        player.y = screenHeight - player.height - 40;
      }

      initStars();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () {
      setTimeout(resize, 100);
    });

    // ==========================================
    // INPUT HANDLING
    // ==========================================
    function resetSteering() {
      keyLeft = false;
      keyRight = false;
      activeTouches.clear();
    }

    function isSteeringLeft() {
      if (keyLeft) return true;
      for (const touch of activeTouches.values()) {
        if (touch.x < screenWidth * 0.5) return true;
      }
      return false;
    }

    function isSteeringRight() {
      if (keyRight) return true;
      for (const touch of activeTouches.values()) {
        if (touch.x >= screenWidth * 0.5) return true;
      }
      return false;
    }

    window.addEventListener('keydown', function (e) {
      initAudio();
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keyLeft = true;
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keyRight = true;
        e.preventDefault();
      } else if (e.key === ' ' || e.key === 'Enter') {
        handleActionInput(screenWidth / 2, screenHeight / 2);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keyLeft = false;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keyRight = false;
      }
    });

    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      initAudio();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
        handleActionInput(t.clientX, t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (activeTouches.has(t.identifier)) {
          activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
        }
      }
    }, { passive: false });

    function handleTouchEnd(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
    }

    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    canvas.addEventListener('mousedown', function (e) {
      initAudio();
      handleActionInput(e.clientX, e.clientY);
      if (currentState === STATE_PLAYING) {
        if (e.clientX < screenWidth * 0.5) {
          keyLeft = true;
        } else {
          keyRight = true;
        }
      }
    });

    window.addEventListener('mouseup', function () {
      keyLeft = false;
      keyRight = false;
    });

    function handleActionInput(clientX, clientY) {
      if (currentState === STATE_MENU) {
        const centerY = screenHeight / 2;
        const centerX = screenWidth / 2;

        // Check GARAGE button click
        const garY = centerY + 96;
        if (Math.abs(clientX - centerX) <= 95 && Math.abs(clientY - garY) <= 25) {
          currentState = STATE_GARAGE;
          soundPowerup();
          return;
        }

        // Tap to play button or general tap outside
        startGame();
      } else if (currentState === STATE_GARAGE) {
        handleGarageClick(clientX, clientY);
      } else if (currentState === STATE_GAMEOVER) {
        const timeSinceOver = performance.now() - gameOverTimestamp;
        if (timeSinceOver >= 400) {
          startGame();
        }
      }
    }

    function handleGarageClick(clientX, clientY) {
      // Check Back Button
      if (clientX >= 16 && clientX <= 110 && clientY >= 20 && clientY <= 68) {
        currentState = STATE_MENU;
        soundCoin();
        return;
      }

      // Check Skin selections
      const centerX = screenWidth / 2;
      const cardW = Math.min(screenWidth * 0.88, 380);
      const cardH = 82;
      const startY = 95;
      const gap = 16;

      SKINS.forEach(function (skin, idx) {
        const cardY = startY + idx * (cardH + gap);
        const cardX = centerX - cardW / 2;

        if (
          clientX >= cardX &&
          clientX <= cardX + cardW &&
          clientY >= cardY &&
          clientY <= cardY + cardH
        ) {
          if (unlockedSkinIds.includes(skin.id)) {
            selectedSkinId = skin.id;
            try {
              localStorage.setItem('neon_racer_selected_skin', selectedSkinId);
            } catch (e) {}
            soundCoin();
          } else {
            soundPlayerHit();
          }
        }
      });
    }

    // ==========================================
    // GAME LIFECYCLE
    // ==========================================
    function startGame() {
      currentState = STATE_PLAYING;
      score = 0;
      distanceTraveled = 0;
      coinsCollected = 0;
      gameTime = 0;
      currentSpeed = baseSpeed;
      playerHP = MAX_HP;
      rapidFireTimer = 0;
      shieldTimer = 0;
      screenDamageFlash = 0;
      playerShootTimer = 0;

      lastBossThreshold = 0;
      boss = null;

      trafficCars = [];
      playerBullets = [];
      enemyBullets = [];
      coins = [];
      powerups = [];
      particles = [];
      floatingTexts = [];

      nextCarSpawnTimer = 0.8;
      nextCoinSpawnTimer = 1.6;
      nextPowerupSpawnTimer = 7.0;

      player.x = roadX + roadW / 2;
      player.targetX = player.x;
      player.vx = 0;
      player.tilt = 0;
      player.y = screenHeight - player.height - 40;

      lifetimeStats.totalGames += 1;
      saveStats();

      assignRandomMission();
      soundStart();
    }

    function triggerGameOver() {
      currentState = STATE_GAMEOVER;
      gameOverTimestamp = performance.now();
      resetSteering();
      soundCrash();

      saveStats();
      checkSkinUnlocks();

      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 260 + 40;
        particles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 5 + 2,
          color: Math.random() > 0.4 ? '#ff0055' : '#00ffff',
          alpha: 1,
          decay: Math.random() * 1.8 + 0.8
        });
      }
    }

    // ==========================================
    // SPAWNING HELPERS
    // ==========================================
    function getOccupiedLanesAtTop() {
      const occupied = [];
      trafficCars.forEach(function (c) {
        if (c.y < 240) {
          const laneIdx = Math.floor((c.x - roadX) / laneWidth);
          if (laneIdx >= 0 && laneIdx < 3 && !occupied.includes(laneIdx)) {
            occupied.push(laneIdx);
          }
        }
      });
      return occupied;
    }

    function spawnTrafficCar() {
      // Pause normal traffic spawning while boss is alive
      if (boss !== null) return;

      const occupied = getOccupiedLanesAtTop();
      if (occupied.length >= 2) return;

      const availableLanes = [0, 1, 2].filter(function (l) { return !occupied.includes(l); });
      if (availableLanes.length === 0) return;

      const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
      const spawnX = roadX + lane * laneWidth + laneWidth / 2;

      const speedFactor = 0.35 + Math.random() * 0.35;
      const carSpeed = currentSpeed * speedFactor;

      const isEnemy = Math.random() < 0.38;
      const palette = isEnemy
        ? { body: '#ff0033', glow: '#ff0033', light: '#ff4d6d' }
        : TRAFFIC_PALETTES[Math.floor(Math.random() * TRAFFIC_PALETTES.length)];

      trafficCars.push({
        x: spawnX,
        y: -100,
        width: player.width * 0.94,
        height: player.height * 0.94,
        speed: carSpeed,
        colorPalette: palette,
        isEnemy: isEnemy,
        hp: 1,
        shootCooldown: 1.0 + Math.random() * 1.0
      });
    }

    function spawnCoin() {
      if (boss !== null) return;
      const lane = Math.floor(Math.random() * 3);
      const spawnX = roadX + lane * laneWidth + laneWidth / 2;
      coins.push({
        x: spawnX,
        y: -40,
        radius: 13,
        pulseOffset: Math.random() * Math.PI * 2
      });
    }

    function spawnPowerup() {
      if (boss !== null) return;
      const types = ['shield', 'rapid', 'health'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const lane = Math.floor(Math.random() * 3);
      const spawnX = roadX + lane * laneWidth + laneWidth / 2;

      powerups.push({
        type: chosenType,
        x: spawnX,
        y: -50,
        radius: 17,
        pulseOffset: Math.random() * Math.PI * 2
      });
    }

    // ==========================================
    // UPDATE CYCLE
    // ==========================================
    function update(dt) {
      gameTime += dt;

      // Stars parallax
      stars.forEach(function (star) {
        star.y += (star.speed + (currentState === STATE_PLAYING ? (currentSpeed - baseSpeed) * 0.1 : 0)) * dt;
        if (star.y > screenHeight) {
          star.y = 0;
          star.x = Math.random() * screenWidth;
        }
      });

      if (currentState !== STATE_PLAYING) {
        // Idle ambient floating
        player.x = roadX + roadW / 2 + Math.sin(gameTime * 1.5) * 12;
        player.tilt = Math.sin(gameTime * 1.5) * 0.05;
        roadScrollOffset = (roadScrollOffset + 180 * dt) % 60;
        return;
      }

      // Check Boss Fight Spawn
      checkBossSpawn();
      updateBoss(dt);

      // Check Skin Unlocks during play
      checkSkinUnlocks();

      // Mission progress check
      updateMissionProgress();

      // Screen Damage Flash fade
      if (screenDamageFlash > 0) {
        screenDamageFlash = Math.max(0, screenDamageFlash - dt * 2.2);
      }

      // Power-up Buff Timers
      if (rapidFireTimer > 0) {
        rapidFireTimer = Math.max(0, rapidFireTimer - dt);
      }
      if (shieldTimer > 0) {
        shieldTimer = Math.max(0, shieldTimer - dt);
      }

      // Auto-fire player bullets (0.3s normal, 0.14s rapid fire)
      const fireInterval = rapidFireTimer > 0 ? 0.14 : 0.3;
      playerShootTimer += dt;
      if (playerShootTimer >= fireInterval) {
        playerShootTimer = 0;
        const skin = getSelectedSkin();
        const bulletColor = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;

        playerBullets.push({
          x: player.x - 10,
          y: player.y - player.height / 2 + 2,
          vy: -820,
          width: 5,
          height: 16,
          color: bulletColor
        });
        playerBullets.push({
          x: player.x + 10,
          y: player.y - player.height / 2 + 2,
          vy: -820,
          width: 5,
          height: 16,
          color: bulletColor
        });
        soundPlayerShoot();
      }

      // Difficulty Progression (caps at 900 px/sec)
      currentSpeed = Math.min(baseSpeed + distanceTraveled * 0.028, 900);
      const roadTravel = currentSpeed * dt;
      distanceTraveled += roadTravel;
      score = Math.floor(distanceTraveled / 30) + coinsCollected * 5;

      if (score > bestScore) {
        bestScore = score;
      }

      roadScrollOffset = (roadScrollOffset + roadTravel) % 60;

      // Steering
      const steerSpeed = 640;
      let moveDir = 0;
      if (isSteeringLeft()) moveDir -= 1;
      if (isSteeringRight()) moveDir += 1;

      player.vx = moveDir * steerSpeed;
      player.x += player.vx * dt;

      // Target tilt angle
      const targetTilt = moveDir * 0.14;
      player.tilt += (targetTilt - player.tilt) * Math.min(dt * 15, 1);

      // Clamp player car inside road borders
      const halfW = player.width / 2;
      const minX = roadX + halfW + 6;
      const maxX = roadX + roadW - halfW - 6;
      if (player.x < minX) {
        player.x = minX;
        player.vx = 0;
      } else if (player.x > maxX) {
        player.x = maxX;
        player.vx = 0;
      }

      // Add exhaust trail particles using selected skin
      const currentSkin = getSelectedSkin();
      const trailColor = currentSkin.trail === 'rainbow' ? getRainbowColor(180) : currentSkin.trail;

      particles.push({
        x: player.x - 8 + (Math.random() - 0.5) * 4,
        y: player.y + player.height / 2 - 2,
        vx: (Math.random() - 0.5) * 20,
        vy: 140 + Math.random() * 50,
        size: Math.random() * 3.5 + 2,
        color: trailColor,
        alpha: 0.75,
        decay: 3.5
      });
      particles.push({
        x: player.x + 8 + (Math.random() - 0.5) * 4,
        y: player.y + player.height / 2 - 2,
        vx: (Math.random() - 0.5) * 20,
        vy: 140 + Math.random() * 50,
        size: Math.random() * 3.5 + 2,
        color: trailColor,
        alpha: 0.75,
        decay: 3.5
      });

      // Update Player Bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.y += b.vy * dt;
        if (b.y < -30) {
          playerBullets.splice(i, 1);
        }
      }

      // Update Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.y += (b.vy || 500) * dt;
        if (b.vx) b.x += b.vx * dt;

        // Collision with player car
        const halfPlayerW = player.width * 0.42;
        const halfPlayerH = player.height * 0.44;
        if (
          b.x >= player.x - halfPlayerW &&
          b.x <= player.x + halfPlayerW &&
          b.y >= player.y - halfPlayerH &&
          b.y <= player.y + halfPlayerH
        ) {
          enemyBullets.splice(i, 1);
          if (shieldTimer > 0) {
            shieldTimer = 0;
            soundPowerup();
            floatingTexts.push({
              text: 'SHIELD ABSORBED!',
              x: player.x,
              y: player.y - 40,
              vy: 50,
              alpha: 1,
              decay: 2.0,
              color: '#00ffff'
            });
          } else {
            playerHP -= 1;
            screenDamageFlash = 0.45;
            screenDamageFlashColor = 'rgba(255, 0, 50, 0.45)';
            soundPlayerHit();

            for (let p = 0; p < 18; p++) {
              particles.push({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 180,
                vy: (Math.random() - 0.5) * 180,
                size: 3,
                color: '#ff0055',
                alpha: 1,
                decay: 2.5
              });
            }

            if (playerHP <= 0) {
              triggerGameOver();
              return;
            }
          }
          continue;
        }

        if (b.y > screenHeight + 40 || b.x < -30 || b.x > screenWidth + 30) {
          enemyBullets.splice(i, 1);
        }
      }

      // Spawning timers (only active when no boss)
      if (boss === null) {
        nextCarSpawnTimer -= dt;
        if (nextCarSpawnTimer <= 0) {
          spawnTrafficCar();
          nextCarSpawnTimer = Math.max(1.0 - (currentSpeed - baseSpeed) * 0.0012, 0.45) + Math.random() * 0.4;
        }

        nextCoinSpawnTimer -= dt;
        if (nextCoinSpawnTimer <= 0) {
          spawnCoin();
          nextCoinSpawnTimer = 1.4 + Math.random() * 1.8;
        }

        nextPowerupSpawnTimer -= dt;
        if (nextPowerupSpawnTimer <= 0) {
          spawnPowerup();
          nextPowerupSpawnTimer = 10.0 + Math.random() * 6.0;
        }
      }

      // Update Powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += currentSpeed * dt;

        const dx = player.x - p.x;
        const dy = player.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.width / 2 + p.radius) {
          applyPowerup(p.type);
          soundPowerup();
          powerups.splice(i, 1);
          continue;
        }

        if (p.y > screenHeight + 60) {
          powerups.splice(i, 1);
        }
      }

      // Update Traffic Cars
      for (let i = trafficCars.length - 1; i >= 0; i--) {
        const car = trafficCars[i];
        car.y += (currentSpeed - car.speed) * dt;

        // Enemy auto-firing downward every 1.5 seconds
        if (car.isEnemy) {
          car.shootCooldown -= dt;
          if (car.shootCooldown <= 0 && car.y > 20 && car.y < screenHeight - 120) {
            car.shootCooldown = 1.5;
            enemyBullets.push({
              x: car.x,
              y: car.y + car.height / 2 + 6,
              vy: 500,
              width: 5,
              height: 14
            });
            soundEnemyShoot();
          }
        }

        // Collision with Player Bullets
        let carDestroyed = false;
        for (let j = playerBullets.length - 1; j >= 0; j--) {
          const b = playerBullets[j];
          if (
            b.x >= car.x - car.width / 2 &&
            b.x <= car.x + car.width / 2 &&
            b.y >= car.y - car.height / 2 &&
            b.y <= car.y + car.height / 2
          ) {
            playerBullets.splice(j, 1);
            car.hp -= 1;

            if (car.hp <= 0) {
              carDestroyed = true;
              score += 10;
              distanceTraveled += 300;
              missionEnemiesKilled += 1;
              lifetimeStats.totalEnemies += 1;
              soundEnemyExplosion();

              floatingTexts.push({
                text: '+10',
                x: car.x,
                y: car.y,
                vy: 55,
                alpha: 1,
                decay: 1.8,
                color: '#ff0055'
              });

              for (let p = 0; p < 25; p++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 200 + 50;
                particles.push({
                  x: car.x,
                  y: car.y,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 5 + 2,
                  color: car.colorPalette.glow,
                  alpha: 1,
                  decay: Math.random() * 1.8 + 1.0
                });
              }
              break;
            }
          }
        }

        if (carDestroyed) {
          trafficCars.splice(i, 1);
          continue;
        }

        // Collision with Player Car
        const hitboxPaddingX = player.width * 0.16;
        const hitboxPaddingY = player.height * 0.14;
        const pLeft = player.x - player.width / 2 + hitboxPaddingX;
        const pRight = player.x + player.width / 2 - hitboxPaddingX;
        const pTop = player.y - player.height / 2 + hitboxPaddingY;
        const pBottom = player.y + player.height / 2 - hitboxPaddingY;

        const cLeft = car.x - car.width / 2 + hitboxPaddingX;
        const cRight = car.x + car.width / 2 - hitboxPaddingX;
        const cTop = car.y - car.height / 2 + hitboxPaddingY;
        const cBottom = car.y + car.height / 2 - hitboxPaddingY;

        if (pLeft < cRight && pRight > cLeft && pTop < cBottom && pBottom > cTop) {
          if (shieldTimer > 0) {
            shieldTimer = 0;
            trafficCars.splice(i, 1);
            soundEnemyExplosion();
            floatingTexts.push({
              text: 'SHIELD RAM!',
              x: player.x,
              y: player.y - 40,
              vy: 50,
              alpha: 1,
              decay: 2.0,
              color: '#00ffff'
            });
            continue;
          } else {
            triggerGameOver();
            return;
          }
        }

        if (car.y > screenHeight + 120) {
          trafficCars.splice(i, 1);
        }
      }

      // Update Coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.y += currentSpeed * dt;

        const dx = player.x - coin.x;
        const dy = player.y - coin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.width / 2 + coin.radius) {
          coinsCollected += 1;
          score += 5;
          missionCoinsGathered += 1;
          lifetimeStats.totalCoins += 1;
          soundCoin();

          floatingTexts.push({
            text: '+5',
            x: coin.x,
            y: coin.y,
            vy: 60,
            alpha: 1,
            decay: 2.0,
            color: '#ffd700'
          });

          for (let p = 0; p < 12; p++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 120 + 30;
            particles.push({
              x: coin.x,
              y: coin.y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              size: Math.random() * 3 + 2,
              color: '#ffd700',
              alpha: 1,
              decay: 2.5
            });
          }

          coins.splice(i, 1);
          continue;
        }

        if (coin.y > screenHeight + 40) {
          coins.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= p.decay * dt;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= ft.vy * dt;
        ft.alpha -= ft.decay * dt;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
        }
      }
    }

    function applyPowerup(type) {
      if (type === 'shield') {
        shieldTimer = 8.0;
        floatingTexts.push({
          text: 'SHIELD ACTIVE!',
          x: player.x,
          y: player.y - 40,
          vy: 50,
          alpha: 1,
          decay: 2.0,
          color: '#00e5ff'
        });
      } else if (type === 'rapid') {
        rapidFireTimer = 7.0;
        floatingTexts.push({
          text: 'RAPID FIRE!',
          x: player.x,
          y: player.y - 40,
          vy: 50,
          alpha: 1,
          decay: 2.0,
          color: '#ffe600'
        });
      } else if (type === 'health') {
        playerHP = Math.min(playerHP + 1, MAX_HP);
        floatingTexts.push({
          text: '+1 HEALTH!',
          x: player.x,
          y: player.y - 40,
          vy: 50,
          alpha: 1,
          decay: 2.0,
          color: '#39ff14'
        });
      }
    }

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, screenHeight);
      grad.addColorStop(0, '#040614');
      grad.addColorStop(0.5, '#070b1f');
      grad.addColorStop(1, '#02040d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      // Starfield
      stars.forEach(function (star) {
        const pulse = 0.7 + 0.3 * Math.sin(gameTime * star.pulseSpeed + star.pulseOffset);
        ctx.fillStyle = 'rgba(180, 220, 255, ' + (star.alpha * pulse) + ')';
        ctx.fillRect(star.x, star.y, star.radius, star.radius);
      });
    }

    function drawRoad() {
      ctx.save();

      // Road asphalt surface
      ctx.fillStyle = '#0b0f20';
      ctx.fillRect(roadX, 0, roadW, screenHeight);

      // Inner subtle dark grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let y = roadScrollOffset - 60; y < screenHeight + 60; y += 40) {
        ctx.beginPath();
        ctx.moveTo(roadX, y);
        ctx.lineTo(roadX + roadW, y);
        ctx.stroke();
      }

      // Left Neon Edge: Glowing Cyan
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 18;
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(roadX, 0);
      ctx.lineTo(roadX, screenHeight);
      ctx.stroke();

      // Right Neon Edge: Glowing Magenta
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 18;
      ctx.strokeStyle = '#ff007f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(roadX + roadW, 0);
      ctx.lineTo(roadX + roadW, screenHeight);
      ctx.stroke();

      // Dashed Lane Dividers
      ctx.shadowColor = '#80d4ff';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = 'rgba(128, 212, 255, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([32, 28]);
      ctx.lineDashOffset = -roadScrollOffset;

      for (let i = 1; i <= 2; i++) {
        const lx = roadX + i * laneWidth;
        ctx.beginPath();
        ctx.moveTo(lx, -60);
        ctx.lineTo(lx, screenHeight + 60);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawPlayerCar() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.tilt);

      const w = player.width;
      const h = player.height;
      const hw = w / 2;
      const hh = h / 2;

      const skin = getSelectedSkin();
      const glowColor = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;
      const accentColor = skin.accent;

      // Active Shield Bubble
      if (shieldTimer > 0) {
        ctx.save();
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 24;
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(hw, hh) + 12 + Math.sin(gameTime * 8) * 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0, 220, 255, 0.15)';
        ctx.fill();
        ctx.restore();
      }

      // Headlight Beams
      const beamGrad = ctx.createLinearGradient(0, -hh, 0, -hh - 160);
      beamGrad.addColorStop(0, 'rgba(0, 255, 255, 0.35)');
      beamGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(-hw + 6, -hh);
      ctx.lineTo(-hw - 18, -hh - 160);
      ctx.lineTo(-hw + 26, -hh - 160);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(hw - 6, -hh);
      ctx.lineTo(hw - 26, -hh - 160);
      ctx.lineTo(hw + 18, -hh - 160);
      ctx.closePath();
      ctx.fill();

      // Underglow
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 24;
      ctx.fillStyle = glowColor;
      ctx.beginPath();
      ctx.roundRect(-hw * 0.9, -hh * 0.9, w * 0.9, h * 0.9, 8);
      ctx.fill();

      // Car Body
      const bodyGrad = ctx.createLinearGradient(0, -hh, 0, hh);
      bodyGrad.addColorStop(0, skin.bodyTop);
      bodyGrad.addColorStop(0.5, skin.bodyMid);
      bodyGrad.addColorStop(1, skin.bodyBot);

      ctx.fillStyle = bodyGrad;
      ctx.strokeStyle = glowColor;
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(-hw + 8, -hh);
      ctx.lineTo(hw - 8, -hh);
      ctx.quadraticCurveTo(hw, -hh, hw, -hh + 12);
      ctx.lineTo(hw + 2, hh - 14);
      ctx.quadraticCurveTo(hw + 2, hh, hw - 6, hh);
      ctx.lineTo(-hw + 6, hh);
      ctx.quadraticCurveTo(-hw - 2, hh, -hw - 2, hh - 14);
      ctx.lineTo(-hw, -hh + 12);
      ctx.quadraticCurveTo(-hw, -hh, -hw + 8, -hh);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Windshield & Roof
      ctx.shadowBlur = 6;
      ctx.shadowColor = glowColor;
      ctx.fillStyle = '#061324';
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-hw * 0.58, -hh * 0.42, w * 0.58, h * 0.38, 5);
      ctx.fill();
      ctx.stroke();

      // Rear Spoiler / Accent lines
      ctx.strokeStyle = glowColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-hw + 3, hh - 6);
      ctx.lineTo(hw - 3, hh - 6);
      ctx.stroke();

      // Headlight bulbs
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.fillRect(-hw + 4, -hh + 1, 6, 4);
      ctx.fillRect(hw - 10, -hh + 1, 6, 4);

      // Tail lights
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 8;
      ctx.fillRect(-hw + 4, hh - 4, 6, 3);
      ctx.fillRect(hw - 10, hh - 4, 6, 3);

      ctx.restore();
    }

    function drawTrafficCars() {
      trafficCars.forEach(function (car) {
        ctx.save();
        ctx.translate(car.x, car.y);

        const w = car.width;
        const h = car.height;
        const hw = w / 2;
        const hh = h / 2;

        // Glow
        ctx.shadowColor = car.colorPalette.glow;
        ctx.shadowBlur = 18;

        // Car Body
        ctx.fillStyle = '#0c101d';
        ctx.strokeStyle = car.colorPalette.glow;
        ctx.lineWidth = 2.2;

        ctx.beginPath();
        ctx.roundRect(-hw, -hh, w, h, 8);
        ctx.fill();
        ctx.stroke();

        // Distinct Red Markings for Enemy Cars
        if (car.isEnemy) {
          ctx.fillStyle = '#ff0033';
          ctx.beginPath();
          ctx.moveTo(0, -hh + 8);
          ctx.lineTo(-hw + 6, hh - 8);
          ctx.lineTo(hw - 6, hh - 8);
          ctx.closePath();
          ctx.fill();
        }

        // Windshield
        ctx.fillStyle = '#05070f';
        ctx.strokeStyle = car.colorPalette.light;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(-hw * 0.6, -hh * 0.45, w * 0.6, h * 0.38, 4);
        ctx.fill();
        ctx.stroke();

        // Front Headlights (downward)
        ctx.fillStyle = car.colorPalette.light;
        ctx.fillRect(-hw + 4, hh - 4, 6, 3);
        ctx.fillRect(hw - 10, hh - 4, 6, 3);

        ctx.restore();
      });
    }

    function drawBoss() {
      if (!boss) return;

      ctx.save();
      ctx.translate(boss.x, boss.y);

      const bw = boss.width;
      const bh = boss.height;
      const hbw = bw / 2;
      const hbh = bh / 2;

      // Boss Glow
      ctx.shadowColor = boss.flashTimer > 0 ? '#ffffff' : '#ff0055';
      ctx.shadowBlur = boss.flashTimer > 0 ? 30 : 22;

      // Dark Metallic Truck Body
      const bossGrad = ctx.createLinearGradient(0, -hbh, 0, hbh);
      bossGrad.addColorStop(0, '#2d0a1b');
      bossGrad.addColorStop(0.5, '#190510');
      bossGrad.addColorStop(1, '#0f020a');

      ctx.fillStyle = boss.flashTimer > 0 ? '#ff7799' : bossGrad;
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.roundRect(-hbw, -hbh, bw, bh, 14);
      ctx.fill();
      ctx.stroke();

      // Armor plates / Grille
      ctx.strokeStyle = '#ff3377';
      ctx.lineWidth = 2;
      for (let y = -hbh + 20; y <= hbh - 20; y += 22) {
        ctx.beginPath();
        ctx.moveTo(-hbw + 12, y);
        ctx.lineTo(hbw - 12, y);
        ctx.stroke();
      }

      // Windshield
      ctx.fillStyle = '#14030a';
      ctx.strokeStyle = '#ff6699';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-hbw * 0.7, hbh - 46, bw * 0.7, 26, 6);
      ctx.fill();
      ctx.stroke();

      // Double Cannons
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(-hbw + 14, hbh - 4, 12, 16);
      ctx.fillRect(hbw - 26, hbh - 4, 12, 16);
      ctx.fillRect(-6, hbh - 4, 12, 18);

      ctx.restore();
    }

    function drawBullets() {
      ctx.save();

      // Player Bullets
      playerBullets.forEach(function (b) {
        ctx.shadowColor = b.color || '#00ffff';
        ctx.shadowBlur = 14;
        ctx.fillStyle = b.color || '#00ffff';
        ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
      });

      // Enemy Bullets
      enemyBullets.forEach(function (b) {
        ctx.shadowColor = '#ff0033';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff0033';
        ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
      });

      ctx.restore();
    }

    function drawCoins() {
      coins.forEach(function (coin) {
        ctx.save();
        ctx.translate(coin.x, coin.y);

        const pulse = 1 + 0.12 * Math.sin(gameTime * 7 + coin.pulseOffset);
        ctx.scale(pulse, pulse);

        // Glow
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 18;

        // Outer coin ring
        const radGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, coin.radius);
        radGrad.addColorStop(0, '#fff490');
        radGrad.addColorStop(0.65, '#ffd700');
        radGrad.addColorStop(1, '#c28b00');

        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
        ctx.fill();

        // Inner star detail
        ctx.strokeStyle = '#fff8b3';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, coin.radius * 0.62, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      });
    }

    function drawPowerups() {
      powerups.forEach(function (p) {
        ctx.save();
        ctx.translate(p.x, p.y);

        const pulse = 1 + 0.12 * Math.sin(gameTime * 6 + p.pulseOffset);
        ctx.scale(pulse, pulse);

        let glow = '#00ffff';
        let symbol = '🛡️';
        if (p.type === 'rapid') {
          glow = '#ffe600';
          symbol = '⚡';
        } else if (p.type === 'health') {
          glow = '#39ff14';
          symbol = '💚';
        }

        ctx.shadowColor = glow;
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#091522';
        ctx.strokeStyle = glow;
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(symbol, 0, 1);

        ctx.restore();
      });
    }

    function drawParticles() {
      ctx.save();
      particles.forEach(function (p) {
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawHUD() {
      ctx.save();

      // Screen Damage Flash Overlay
      if (screenDamageFlash > 0) {
        ctx.fillStyle = screenDamageFlashColor;
        ctx.fillRect(0, 0, screenWidth, screenHeight);
      }

      // Top-Left HP Hearts
      const heartSize = 16;
      const startX = 20;
      const startY = 32;
      for (let i = 0; i < MAX_HP; i++) {
        const isFilled = i < playerHP;
        ctx.save();
        ctx.shadowColor = isFilled ? '#ff0055' : 'transparent';
        ctx.shadowBlur = 10;
        ctx.fillStyle = isFilled ? '#ff0055' : '#331122';
        ctx.font = heartSize + 'px sans-serif';
        ctx.fillText(isFilled ? '❤️' : '🖤', startX + i * 26, startY);
        ctx.restore();
      }

      // Score (Top-Left under hearts)
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#00ffff';
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(score.toString(), 20, 68);

      ctx.shadowBlur = 0;
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
      ctx.fillText('SCORE', 20, 83);

      // Best Score (Top-Right)
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffd700';
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(bestScore.toString(), screenWidth - 20, 36);

      ctx.shadowBlur = 0;
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
      ctx.fillText('BEST', screenWidth - 20, 51);

      // Top-Center: Current Mission progress HUD
      if (currentMission) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(6, 12, 28, 0.85)';
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 1;
        const mw = Math.min(screenWidth * 0.54, 210);
        ctx.beginPath();
        ctx.roundRect(screenWidth / 2 - mw / 2, 14, mw, 28, 6);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 6;
        ctx.fillText(currentMission.label + ': ' + Math.min(missionProgress, currentMission.target) + '/' + currentMission.target, screenWidth / 2, 32);
        ctx.restore();
      }

      // Boss Health Bar at Top during Boss Fight
      if (boss) {
        ctx.save();
        const barW = Math.min(screenWidth * 0.78, 300);
        const barH = 14;
        const barX = screenWidth / 2 - barW / 2;
        const barY = 52;

        ctx.textAlign = 'center';
        ctx.font = '900 13px sans-serif';
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;
        ctx.fillText('BOSS HP: ' + Math.max(boss.hp, 0) + ' / ' + boss.maxHp, screenWidth / 2, barY - 4);

        // Bar container
        ctx.fillStyle = 'rgba(20, 0, 10, 0.85)';
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, barH, 5);
        ctx.fill();
        ctx.stroke();

        // Bar Fill
        const fillW = Math.max(0, (boss.hp / boss.maxHp) * (barW - 4));
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(barX + 2, barY + 2, fillW, barH - 4);
        ctx.restore();
      }

      // Floating Texts (+5, +10, Boss Defeated, etc.)
      floatingTexts.forEach(function (ft) {
        ctx.save();
        ctx.globalAlpha = Math.max(ft.alpha, 0);
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = ft.color;
        ctx.font = '900 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      ctx.restore();
    }

    function drawGarage() {
      ctx.fillStyle = 'rgba(4, 6, 20, 0.94)';
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      const centerX = screenWidth / 2;

      // Header Bar
      // Back Button
      ctx.save();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0a1d30';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(18, 24, 88, 38, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('◀ BACK', 62, 43);

      // Title
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 24px sans-serif';
      ctx.fillText('CYBER GARAGE', centerX + 20, 43);
      ctx.restore();

      // 4 Skin Cards
      const cardW = Math.min(screenWidth * 0.88, 380);
      const cardH = 82;
      const startY = 95;
      const gap = 16;

      SKINS.forEach(function (skin, idx) {
        const cardY = startY + idx * (cardH + gap);
        const cardX = centerX - cardW / 2;
        const isUnlocked = unlockedSkinIds.includes(skin.id);
        const isSelected = selectedSkinId === skin.id;

        const skinGlow = skin.glow === 'rainbow' ? getRainbowColor() : skin.glow;

        ctx.save();
        // Card Background
        ctx.fillStyle = isSelected ? '#12233f' : '#0a0d1e';
        ctx.strokeStyle = isSelected ? skinGlow : (isUnlocked ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 255, 255, 0.12)');
        ctx.lineWidth = isSelected ? 2.5 : 1.5;

        if (isSelected) {
          ctx.shadowColor = skinGlow;
          ctx.shadowBlur = 16;
        }

        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 14);
        ctx.fill();
        ctx.stroke();

        // Car Miniature Preview on Left
        const previewX = cardX + 38;
        const previewY = cardY + cardH / 2;
        ctx.save();
        ctx.translate(previewX, previewY);
        ctx.scale(0.55, 0.55);

        ctx.shadowColor = isUnlocked ? skinGlow : '#555555';
        ctx.shadowBlur = 12;
        ctx.fillStyle = isUnlocked ? skin.bodyTop : '#222222';
        ctx.strokeStyle = isUnlocked ? skinGlow : '#666666';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-16, -28, 32, 56, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#081726';
        ctx.fillRect(-10, -8, 20, 14);
        ctx.restore();

        // Skin Info Texts
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        // Skin Name
        ctx.shadowColor = isUnlocked ? skinGlow : 'transparent';
        ctx.shadowBlur = 8;
        ctx.fillStyle = isUnlocked ? '#ffffff' : '#777777';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(skin.name, cardX + 76, cardY + 16);

        // Unlock status or requirement
        ctx.font = '12px sans-serif';
        if (isUnlocked) {
          ctx.fillStyle = '#39ff14';
          ctx.fillText('UNLOCKED', cardX + 76, cardY + 44);
        } else {
          ctx.fillStyle = '#ff6688';
          ctx.fillText('🔒 ' + skin.reqDesc, cardX + 76, cardY + 44);
        }

        // Action badge on right
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        if (isSelected) {
          ctx.fillStyle = skinGlow;
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('SELECTED ★', cardX + cardW - 16, cardY + cardH / 2);
        } else if (isUnlocked) {
          ctx.fillStyle = '#8e9bbb';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('EQUIP ▶', cardX + cardW - 16, cardY + cardH / 2);
        } else {
          ctx.fillStyle = '#555555';
          ctx.font = '18px sans-serif';
          ctx.fillText('🔒', cardX + cardW - 18, cardY + cardH / 2);
        }

        ctx.restore();
      });
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(10, 2, 12, 0.84)';
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      const centerX = screenWidth / 2;
      const centerY = screenHeight / 2;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 32;
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 48px sans-serif';
      ctx.fillText('CRASHED!', centerX, centerY - 105);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeText('CRASHED!', centerX, centerY - 105);
      ctx.restore();

      const cardW = Math.min(screenWidth * 0.8, 300);
      const cardH = 120;
      const cardY = centerY - 65;

      ctx.save();
      ctx.fillStyle = 'rgba(14, 18, 36, 0.9)';
      ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(centerX - cardW / 2, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#8e9bbb';
      ctx.font = '13px sans-serif';
      ctx.fillText('FINAL SCORE', centerX, cardY + 28);

      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 36px sans-serif';
      ctx.fillText(score.toString(), centerX, cardY + 68);

      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('BEST SCORE: ' + (lifetimeStats.bestScore || bestScore), centerX, cardY + 102);
      ctx.restore();

      const timeSinceOver = performance.now() - gameOverTimestamp;
      const isReadyToRetry = timeSinceOver >= 400;

      const pulse = isReadyToRetry ? 1 + 0.05 * Math.sin(gameTime * 5) : 1;
      const btnW = 200 * pulse;
      const btnH = 54 * pulse;
      const btnY = centerY + 105;

      ctx.save();
      ctx.shadowColor = isReadyToRetry ? '#ff007f' : '#555555';
      ctx.shadowBlur = isReadyToRetry ? 22 : 4;
      ctx.fillStyle = isReadyToRetry ? '#2a0a20' : '#1a1a24';
      ctx.strokeStyle = isReadyToRetry ? '#ff007f' : '#666666';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.roundRect(centerX - btnW / 2, btnY - btnH / 2, btnW, btnH, 27);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isReadyToRetry ? '#ffffff' : '#888888';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('RETRY', centerX, btnY);
      ctx.restore();
    }

    // ==========================================
    // MAIN LOOP
    // ==========================================
    let lastTimestamp = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.05);
      lastTimestamp = now;

      update(dt);

      ctx.save();
      ctx.scale(dpr, dpr);

      drawBackground();
      drawRoad();
      drawCoins();
      drawPowerups();
      drawBullets();
      drawBoss();
      drawPlayerCar();
      drawTrafficCars();
      drawParticles();

      if (currentState === STATE_PLAYING) {
        drawHUD();
      } else if (currentState === STATE_MENU) {
        drawMenu();
      } else if (currentState === STATE_GARAGE) {
        drawGarage();
      } else if (currentState === STATE_GAMEOVER) {
        drawGameOver();
      }

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    resize();
    requestAnimationFrame(function (timestamp) {
      lastTimestamp = timestamp;
      gameLoop(timestamp);
    });

  })();
  </script>
</body>
</html>
